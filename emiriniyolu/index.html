  const cantaDugmesi = document.getElementById('cantaAc');
  const cantaPaneli = document.getElementById('canta');
  const azHareket = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  const PIPLER = { 1: [5], 2: [1, 9], 3: [1, 5, 9], 4: [1, 3, 7, 9], 5: [1, 3, 5, 7, 9], 6: [1, 3, 4, 6, 7, 9] };
  const esc = (x) => String(x).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  let s = null;            // motor durumu
  let secilenSinif = 'savasci';
  let oyuncuAdi = '';
  let secilenCinsiyet = 'erkek'; // yalnızca portreyi değiştirir
  let sonSeviyeler = {};           // sayaçların (Mürekkep) bir önceki çizimdeki seviyesi: eşik aşılınca uyarı

  /** Sayacın şu anki seviyesi (kitap.sayaclar[ad].seviyeler: enFazla'ya göre sıralı). */
  function sayacSeviyesi(ad) {
    const tanim = (kitap.sayaclar || {})[ad];
    if (!tanim || !tanim.seviyeler) return null;
    const n = (s.sayaclar && s.sayaclar[ad]) || 0;
    const i = tanim.seviyeler.findIndex((v) => n <= v.enFazla);
    return { indeks: i < 0 ? tanim.seviyeler.length - 1 : i, seviye: tanim.seviyeler[i < 0 ? tanim.seviyeler.length - 1 : i] };
  }
  let cizilmis = new Set(); // haritada daha önce çizilmiş öğeler (yenileri mürekkeplensin)
  let mesgul = false;       // zar yuvarlanırken tıklamaları yut

  const isle = (t) => esc(M.metinIsle(kitap, s, t));

  // ───────── küçük çizimler ─────────
  const SIMGE = {
    savasci: '<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 6 54 14v16c0 15-10 24-22 28C20 54 10 45 10 30V14Z" fill="#3a4a44" stroke="#e8643a" stroke-width="3"/><path d="M32 14v36M20 26h24" stroke="#e9e4d6" stroke-width="3" stroke-linecap="round"/></svg>',
    hirsiz: '<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="22" cy="24" r="11" fill="none" stroke="#7fe0c4" stroke-width="4"/><path d="M30 31 52 53M44 45l5-5M39 40l5-5" stroke="#e9e4d6" stroke-width="4" stroke-linecap="round"/></svg>',
    buyucu: '<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M20 58 40 18" stroke="#c9a46a" stroke-width="5" stroke-linecap="round"/><path d="M44 4l3 8 8 3-8 3-3 8-3-8-8-3 8-3Z" fill="#ff8a5c"/><circle cx="40" cy="18" r="5" fill="#7fe0c4"/></svg>',
  };

  // Sınıf portresi: görsel varsa resim, yoksa sınıf simgesiyle bir yer tutucu.
  function portreHTML(id, cinsiyet, alt, w, h) {
    const ad = 'sinif_' + id + '_' + cinsiyet;
    if (gorselVar(ad)) return '<img src="' + gorselYolu(ad) + '" alt="' + esc(alt) + '" width="' + w + '" height="' + h + '" loading="eager">';
    return '<span class="portre-bos" aria-hidden="true">' + SIMGE[id] + '</span>';
  }

  function sahneCizimi(id) {
    // Görsel gelene kadar her oda için aynı kemerin farklı ışıkta bir çizimi.
    let h = 0; for (const c of id) h = (h * 31 + c.charCodeAt(0)) % 360;
    const isik = id.startsWith('son_olum') || id === 'son_cukur' ? '#e05252' : id === 'magara' ? '#7fe0c4' : 'hsl(' + (15 + (h % 30)) + ' 85% 58%)';
    return '<svg viewBox="0 0 800 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true">' +
      '<defs><radialGradient id="ig" cx="50%" cy="62%" r="55%"><stop offset="0" stop-color="' + isik + '" stop-opacity=".55"/><stop offset="1" stop-color="#0a0f0d" stop-opacity="0"/></radialGradient>' +
      '<linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#26332e"/><stop offset="1" stop-color="#121a17"/></linearGradient></defs>' +
      '<rect width="800" height="400" fill="url(#tg)"/>' +
      Array.from({ length: 7 }, (_, r) => Array.from({ length: 9 }, (_, c) => '<rect x="' + (c * 92 - (r % 2) * 46) + '" y="' + r * 58 + '" width="88" height="54" rx="4" fill="#ffffff" opacity="' + (0.025 + ((r * 7 + c * 3 + h) % 5) * 0.008) + '"/>').join('')).join('') +
      '<rect width="800" height="400" fill="url(#ig)"/>' +
      '<path d="M300 400V215a100 100 0 0 1 200 0V400Z" fill="#060908"/>' +
      '<path d="M300 400V215a100 100 0 0 1 200 0V400" fill="none" stroke="#3b4c45" stroke-width="10"/>' +
      '<rect x="222" y="160" width="10" height="46" fill="#5a4630"/><circle cx="227" cy="152" r="12" fill="' + isik + '"/>' +
      '<rect x="568" y="160" width="10" height="46" fill="#5a4630"/><circle cx="573" cy="152" r="12" fill="' + isik + '"/>' +
      '<path d="M0 400 800 400 800 360 0 380Z" fill="#0a0f0d"/></svg>';
  }

  // ───────── görseller ─────────
  // Derlemenin yazdığı liste: hangi düğümün görseli gerçekten var. Liste yoksa (geliştirme) hepsi denenir.
  const MEVCUT = Array.isArray(window.YK_GORSELLER) ? new Set(window.YK_GORSELLER) : null;
  const gorselVar = (ad) => !MEVCUT || MEVCUT.has(ad);
  const gorselYolu = (ad) => 'gorseller/' + encodeURIComponent(ad) + '.webp';
  const yuklenen = new Set();   // tarayıcının belleğinde hazır olan görseller
  const istenen = new Map();    // önceden yükleme için tutulan Image nesneleri

  function onYukle(ad) {
    if (!ad || !gorselVar(ad) || istenen.has(ad)) return;
    const im = new Image();
    im.decoding = 'async';
    im.onload = () => { yuklenen.add(ad); if (im.decode) im.decode().catch(() => {}); };
    im.src = gorselYolu(ad);
    istenen.set(ad, im);
  }

  /** Bulunduğun odadan iki adımda varılabilecek odaların görsellerini önceden yükle. */
  function komsulariYukle(id) {
    const gor = new Set([id]);
    let sinir = [id];
    for (let adim = 0; adim < 2; adim++) {
      const yeni = [];
      for (const x of sinir) {
        const d = kitap.dugumler[x];
        for (const c of (d && d.secenekler) || []) {
          for (const h of [c.git, c.sinama && c.sinama.basari, c.sinama && c.sinama.basarisizlik, c.dovus && c.dovus.zafer, c.dovus && c.dovus.kacis]) {
            if (h && !gor.has(h)) { gor.add(h); yeni.push(h); }
          }
        }
      }
      sinir = yeni;
    }
    gor.add(kitap.olumDugumu);
    for (const x of gor) { const d = kitap.dugumler[x]; if (!d) continue; onYukle((s ? M.gorselAdaylari(kitap, s, d, x) : [d.gorsel || x]).find(gorselVar)); }
  }

  function gorselHTML(d) {
    // Duruma göre görsel (ör. Corin yanında yoksa Corin'siz görsel); listedeki ilk var olan gösterilir.
    const adaylar = M.gorselAdaylari(kitap, s, d, s.dugum);
    const ad = adaylar.find(gorselVar) || adaylar[0];
    // Görseli olmayan odada yer tutucu çizim; görseli olan odada yalnızca görsel (önceden yüklendiyse geçişsiz).
    if (!gorselVar(ad)) return '<div class="gorsel">' + sahneCizimi(ad) + '<span class="etiket">Görsel yuvası: ' + esc(ad) + '</span></div>';
    return '<div class="gorsel"><img class="' + (yuklenen.has(ad) ? 'hazir' : 'yukleniyor') + '" src="' + gorselYolu(ad) + '" alt="' + esc(d.baslik) + '" data-ad="' + esc(ad) + '"></div>';
  }

  // Çok yüzlü zarların çizimi: dış şekil + iç yüz + kenarlar. 6 yüzlü noktalı küp olarak kalır.
  const SEKIL = {
    4: { dis: '50,5 96,90 4,90', ic: '50,30 76,82 24,82', kenar: 'M50 5 50 30M96 90 76 82M4 90 24 82', sy: 22 },
    8: { dis: '50,3 96,50 50,97 4,50', ic: '50,20 80,64 20,64', kenar: 'M50 3 50 20M96 50 80 64M50 97 80 64M50 97 20 64M4 50 20 64', sy: 6 },
    10: { dis: '50,3 93,40 50,97 7,40', ic: '50,22 74,52 50,74 26,52', kenar: 'M50 3 50 22M93 40 74 52M7 40 26 52M50 97 50 74', sy: 2 },
    12: { dis: '50,3 95,36 78,94 22,94 5,36', ic: '50,24 74,42 65,72 35,72 26,42', kenar: 'M50 3 50 24M95 36 74 42M78 94 65 72M22 94 35 72M5 36 26 42', sy: 2 },
    20: { dis: '50,3 91,26 91,74 50,97 9,74 9,26', ic: '50,22 76,66 24,66', kenar: 'M50 3 50 22M91 26 76 66M91 74 76 66M50 97 76 66M50 97 24 66M9 74 24 66M9 26 24 66M9 26 50 22M91 26 50 22', sy: 14 },
  };
  function cokYuzlu(yuz) {
    const k = SEKIL[yuz];
    return '<svg viewBox="0 0 100 100" aria-hidden="true"><polygon class="zd-dis" points="' + k.dis + '"/><polygon class="zd-ic" points="' + k.ic + '"/><path class="zd-kenar" d="' + k.kenar + '"/></svg>';
  }

  function zarHTML(v, sinif, yuz) {
    yuz = yuz || 6;
    if (yuz !== 6) return '<div class="zar cok ' + (sinif || '') + '" data-son="' + v + '" data-yuz="' + yuz + '" title="' + yuz + ' yüzlü">' + cokYuzlu(yuz) + '<span style="margin-top:' + SEKIL[yuz].sy + 'px">' + v + '</span></div>';
    let h = '<div class="zar ' + (sinif || '') + '" data-son="' + v + '" data-yuz="6" title="6 yüzlü">';
    for (let i = 1; i <= 9; i++) h += '<i class="' + (PIPLER[v].includes(i) ? 'a' : '') + '"></i>';
    return h + '</div>';
  }
  function zarYuzu(el, v) {
    if (el.dataset.yuz !== '6') { el.querySelector('span').textContent = v; return; }
    el.querySelectorAll('i').forEach((p, i) => p.classList.toggle('a', PIPLER[v].includes(i + 1)));
  }
  /** Bir ifade atışını (zarlar + ek) tek satırda çizer: etiket, zarlar, = toplam. */
  function atisHTML(etiket, atis, sinif, birim) {
    if (!atis) return '';
    return '<div class="atis"><span class="kim">' + esc(etiket) + '<small>' + esc(M.Zar.ifadeAdi(atis.ifade)) + '</small></span>' +
      atis.zarlar.map((v) => zarHTML(v, sinif, atis.yuz)).join('') +
      (atis.ek ? '<span class="ek">' + (atis.ek > 0 ? '+ ' : '− ') + Math.abs(atis.ek) + '</span>' : '') +
      '<span class="esit">= <b>' + atis.toplam + '</b> ' + esc(birim || '') + '</span></div>';
  }
  const rastgeleYuz = (el) => 1 + Math.floor(Math.random() * +(el.dataset.yuz || 6));

  function zarlariYuvarla(kapVeyaListe) {
    const zarlar = Array.isArray(kapVeyaListe) ? kapVeyaListe : [...kapVeyaListe.querySelectorAll('.zar')];
    if (azHareket || !zarlar.length) return Promise.resolve();
    mesgul = true;
    zarlar.forEach((z) => { z.classList.add('yuvarlan'); zarYuzu(z, rastgeleYuz(z)); });
    return new Promise((bitti) => {
      let n = 0;
      const t = setInterval(() => {
        zarlar.forEach((z) => zarYuzu(z, rastgeleYuz(z)));
        if (++n >= 10) {
          clearInterval(t);
          zarlar.forEach((z) => { z.classList.remove('yuvarlan'); zarYuzu(z, +z.dataset.son); z.classList.add('oturdu'); });
          mesgul = false;
          bitti();
        }
      }, 75);
    });
  }

  // ───────── ekran 1: kanca + sınıf seçimi ─────────
  function secimEkrani() {
    s = null; cizilmis = new Set();
    if (logoAlt) logoAlt.textContent = 'Zarlı bir zindan macerası';
    komsulariYukle(kitap.baslangic); // sınıf seçilirken ilk odaların görselleri hazırlanır
    // Görünüş değişince portre beklemeden gelsin: iki görünüşün portrelerini de önceden yükle.
    Object.keys(kitap.siniflar).forEach((id) => ['kadin', 'erkek'].forEach((g) => {
      const ad = 'sinif_' + id + '_' + g;
      if (MEVCUT && MEVCUT.has(ad)) new Image().src = gorselYolu(ad);
    }));
    bastanDugmesi.hidden = true;
    cantaDugmesi.hidden = true;
    const kartlar = Object.entries(kitap.siniflar).map(([id, c]) => {
      const enIyi = Math.max(c.guc, c.ceviklik, c.akil);
      const deger = (ad, v, sinif) => '<div class="deger' + (sinif ? ' ' + sinif : '') + '"><b>' + v + '</b><span>' + ad + '</span></div>';
      const oz = (ad, v) => deger(ad, v, v === enIyi ? 'guclu' : v === 0 ? 'zayif' : '');
      const rozetler = (c.rozetler || []).map((r) => '<li><b>' + esc(r.ad) + '</b><span>' + esc(r.acik) + '</span></li>').join('');
      return '<button type="button" class="sinif sinif-' + id + '" data-sinif="' + id + '" aria-pressed="' + (id === secilenSinif) + '">' +
        '<div class="portre">' + portreHTML(id, secilenCinsiyet, c.ad + ' portresi', 720, 960) +
        (c.zorluk ? '<span class="zorluk-rozet z-' + esc(c.zorluk.toLocaleLowerCase('tr')) + '">' + esc(c.zorluk) + '</span>' : '') + '<div class="portre-yazi"><span class="secildi">Seçildi</span><h3>' + esc(c.ad) + '</h3><p>' + esc(c.aciklama) + '</p></div></div>' +
        '<div class="govde"><div class="degerler">' + oz('Güç', c.guc) + oz('Çeviklik', c.ceviklik) + oz('Akıl', c.akil) +
        deger('Can', c.can, 'can') + deger('Zırh', c.zirh, 'zirh') + '</div>' +
        '<p class="silah"><span>' + esc(c.silah) + '</span>' + esc(M.Zar.ifadeAdi(c.hasarZari)) + ' + ' + esc(M.OZELLIK_ADLARI[c.saldiriOzelligi]) + '</p>' +
        (rozetler ? '<ul class="rozet-listesi">' + rozetler + '</ul>' : '<p class="yetenek">' + esc(c.yetenek) + '</p>') +
        '</div></button>';
    }).join('');
    ekran.innerHTML =
      '<section class="kapak"><div><h1>Yedinci Kat</h1>' +
      '<p>Ölmek üzere olan bir haritacı eline bir rulo tutuşturuyor: yedi kat aşağı inen bir zindanın haritası. Harita, sen yürüdükçe kendini çiziyor.</p>' +
      '<p>En dipteki odaya biri senin adını yazmış. Mürekkep henüz kurumamış.</p>' +
      '<p class="soru">Adını kim yazdı? Haritacı onu neden sana verdi? Yedinci katta bekleyen ne?</p></div>' +
      (gorselVar('kapak')
        ? '<figure class="kitap-kapagi"><img src="' + gorselYolu('kapak') + '" alt="Yedinci Kat kitap kapağı: yedi kat aşağı inen bir zindan, merdivenden aşağı açılan bir harita ve en dipte bir ejderha gözü" width="720" height="964"></figure>'
        : '<div class="harita" aria-hidden="true"><h3>Haritacı Halvard’ın rulosu</h3>' + bosHarita() + '</div>') + '</section>' +
      '<div class="secim-bas"><h2>Kim olarak ineceksin?</h2>' +
      '<div class="cinsiyet" role="group" aria-label="Kahramanın görünüşü"><span>Görünüş</span>' +
      ['kadin', 'erkek'].map((g) => '<button type="button" data-cinsiyet="' + g + '" aria-pressed="' + (g === secilenCinsiyet) + '">' + (g === 'kadin' ? 'Kadın' : 'Erkek') + '</button>').join('') +
      '</div></div>' +
      '<div class="siniflar">' + kartlar + '</div>' +
      '<form class="basla" id="baslaForm"><label>Adın (yedinci katta yazan ad)<input id="ad" maxlength="18" autocomplete="off" placeholder="Gezgin" value="' + esc(oyuncuAdi) + '"></label>' +
      '<button class="birincil" type="submit">Zindana in</button></form>' +
      '<div class="kurallar"><h2>Kurallar</h2><ul>' +
      '<li><b>Sınama:</b> 20 yüzlü + ilgili özellik, zorluğa eşit ya da büyükse başarı. Zorluklar: kolay 10, orta 13, zor 16.</li>' +
      '<li><b>Saldırı:</b> 20 yüzlü + saldırı özelliğin rakibin Zırh’ına eşit ya da büyükse vurursun. Hasar: silahının zarı + aynı özellik. Sonra rakip senin Zırh’ına saldırır.</li>' +
      '<li><b>Doğal 20</b> kritik vuruştur: hasar zarları iki kez atılır. <b>Doğal 1</b> her zaman ıskadır.</li>' +
      '<li><b>Şans:</b> kitap boyunca bir kez, başarısız bir sınamayı ya da ıskaladığın saldırını yeniden atabilirsin.</li></ul></div>';
    ekran.querySelectorAll('[data-cinsiyet]').forEach((b) => b.addEventListener('click', () => {
      secilenCinsiyet = b.dataset.cinsiyet;
      ekran.querySelectorAll('[data-cinsiyet]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
      ekran.querySelectorAll('.sinif').forEach((k) => {
        const id = k.dataset.sinif, yer = k.querySelector('.portre');
        yer.querySelector('img, .portre-bos').outerHTML = portreHTML(id, secilenCinsiyet, kitap.siniflar[id].ad + ' portresi', 720, 960);
      });
    }));
    ekran.querySelectorAll('.sinif').forEach((b) => b.addEventListener('click', () => {
      secilenSinif = b.dataset.sinif;
      ekran.querySelectorAll('.sinif').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    }));
    document.getElementById('ad').addEventListener('input', (e) => {
      const yer = document.getElementById('kapakAd');
      if (yer) yer.textContent = e.target.value.trim() || 'adın';
    });
    document.getElementById('baslaForm').addEventListener('submit', (e) => {
      e.preventDefault();
      oyuncuAdi = document.getElementById('ad').value.trim();
      baslat();
    });
  }

  function baslat() {
    s = M.yeniOyun(kitap, secilenSinif, oyuncuAdi);
    s.cinsiyet = secilenCinsiyet; // görünüş; motor kullanmaz, durumla birlikte taşınır
    sonSeviyeler = {};
    cizilmis = new Set();
    sonKat = 1;
    bastanDugmesi.hidden = false;
    cantaDugmesi.hidden = false;
    ciz();
  }

  // ───────── harita ─────────
  const HUCRE = 78, OFS = 1; // x: -1..1
  function konum(h) { return { x: (h.x + OFS) * HUCRE + HUCRE / 2, y: h.y * 62 + 28 }; }
  // Son düğümlerin haritası yok: oyuncunun son bulunduğu katı göster.
  let sonKat = 1;
  function katNo(id) { const h = kitap.dugumler[id].harita; if (h) sonKat = h.kat || 1; return sonKat; }
  function haritaBoyu(kat) {
    const yMax = Math.max(...Object.values(kitap.dugumler).filter((d) => d.harita && (d.harita.kat || 1) === kat).map((d) => d.harita.y));
    return { w: HUCRE * 3, h: (yMax + 1) * 62 + 74 };
  }

  function bosHarita() {
    // Kapaktaki rulo: boş, yalnızca en dipte ıslak ad.
    return '<svg viewBox="0 0 234 150"><path d="M117 8v70" stroke="#2b2118" stroke-width="1.5" stroke-dasharray="1 6" opacity=".45"/>' +
      '<text class="yedinci" x="117" y="104">VII. KAT</text><text class="islak" id="kapakAd" x="117" y="128">' + esc(oyuncuAdi || 'adın') + '</text></svg>';
  }

  function haritaHTML() {
    const kat = katNo(s.dugum);
    const ayniKat = (h) => h && (h.kat || 1) === kat;
    const b = haritaBoyu(kat);
    let svg = '<svg viewBox="0 0 ' + b.w + ' ' + b.h + '" role="img" aria-label="Kendini çizen harita">';
    const yeniler = [];
    for (const g of s.gecisler) {
      const [a, c] = g.split('>').map((id) => kitap.dugumler[id].harita);
      if (!ayniKat(a) || !ayniKat(c) || (a.x === c.x && a.y === c.y)) continue;
      const p = konum(a), q = konum(c);
      const k = 'y:' + g, yeni = !cizilmis.has(k); if (yeni) yeniler.push(k);
      svg += '<line class="yol' + (yeni ? ' yeni' : '') + '" x1="' + p.x + '" y1="' + p.y + '" x2="' + q.x + '" y2="' + q.y + '"/>';
    }
    const odalar = new Map();
    for (const id of s.ziyaret) { const h = kitap.dugumler[id].harita; if (ayniKat(h)) odalar.set(h.x + ',' + h.y, { h, id }); }
    const simdiki = kitap.dugumler[s.dugum].harita;
    for (const [kk, { h }] of odalar) {
      const p = konum(h), k = 'o:' + kat + ':' + kk, yeni = !cizilmis.has(k); if (yeni) yeniler.push(k);
      const simdi = simdiki && simdiki.x === h.x && simdiki.y === h.y;
      svg += '<g class="oda' + (simdi ? ' simdi' : '') + (yeni ? ' yeni' : '') + '"><rect x="' + (p.x - 32) + '" y="' + (p.y - 15) + '" width="64" height="30" rx="5"/><text x="' + p.x + '" y="' + (p.y + 1) + '">' + esc(h.etiket) + '</text></g>';
    }
    svg += '<line x1="' + b.w / 2 + '" y1="' + (b.h - 70) + '" x2="' + b.w / 2 + '" y2="' + (b.h - 46) + '" stroke="#2b2118" stroke-width="1.5" stroke-dasharray="1 5" opacity=".5"/>';
    svg += '<text class="yedinci" x="' + b.w / 2 + '" y="' + (b.h - 30) + '">VII. KAT</text><text class="islak" x="' + b.w / 2 + '" y="' + (b.h - 10) + '">' + esc(s.ad) + '</text></svg>';
    yeniler.forEach((k) => cizilmis.add(k));
    return '<div class="harita"><h3>Harita · ' + kat + '. Kat</h3>' + svg + '</div>';
  }

  // ───────── karakter kâğıdı ─────────
  /** Kalıcı gelişimler: sınıfın başlangıç değerlerine göre fark. */
  function kazanimlar() {
    const c = kitap.siniflar[s.sinif];
    const l = [];
    for (const [oz, ad] of Object.entries(M.OZELLIK_ADLARI)) if (s.ozellik[oz] > c[oz]) l.push({ ad, once: c[oz], simdi: s.ozellik[oz] });
    if (s.zirh > c.zirh) l.push({ ad: 'Zırh', once: c.zirh, simdi: s.zirh });
    if (s.maxCan > c.can) l.push({ ad: 'En yüksek Can', once: c.can, simdi: s.maxCan });
    return l;
  }
  const arti = (simdi, once) => (simdi > once ? '<em class="arti">+' + (simdi - once) + '</em>' : '');
  const esyaSayisi = () => Object.values(s.esyalar).reduce((a, n) => a + (n > 0 ? n : 0), 0);

  function kagitHTML() {
    const c = kitap.siniflar[s.sinif];
    const hak = (n, max) => '<span class="hak">' + '✦'.repeat(n) + '<span class="bos">' + '✦'.repeat(Math.max(0, max - n)) + '</span></span>';
    const oz = (k, ad) => '<div><b>' + s.ozellik[k] + arti(s.ozellik[k], c[k]) + '</b>' + ad + '</div>';
    return '<div class="kagit"><div class="kagit-bas"><span class="kisi-portre sinif-' + s.sinif + ' g-' + (s.cinsiyet || 'erkek') + '">' + portreHTML(s.sinif, s.cinsiyet || 'erkek', '', 96, 128) + '</span><div><h3>' + esc(s.ad) + '</h3><p class="alt">' + esc(c.ad) + '</p></div></div>' +
      '<div class="olcu"><span>Can</span><span class="cubuk can"><i style="width:' + Math.max(0, (s.can / s.maxCan) * 100) + '%"></i></span><b>' + Math.max(0, s.can) + '<small>/' + s.maxCan + '</small></b></div>' +
      '<div class="ozellikler">' + oz('guc', 'Güç') + oz('ceviklik', 'Çeviklik') + oz('akil', 'Akıl') + '</div>' +
      '<div class="satir"><span>Zırh</span><span>' + s.zirh + arti(s.zirh, c.zirh) + '</span></div>' +
      '<div class="satir"><span>' + esc(c.silah) + (s.silahEki ? ' <em class="arti">dövülmüş</em>' : '') + '</span><span>' + esc(M.Zar.ifadeAdi(c.hasarZari)) + ' + ' + (s.ozellik[c.saldiriOzelligi] + (s.silahEki || 0)) + ' hasar</span></div>' +
      '<div class="satir"><span>Şans</span><span>' + (s.sans > 0 ? 'Bir kez yeniden atabilirsin' : 'Kullanıldı') + '</span></div>' +
      (c.buyuHakki ? '<div class="satir"><span>Büyü hakkı</span>' + hak(s.buyuHakki, c.buyuHakki) + '</div>' : '') +
      (c.kalkan ? '<div class="satir"><span>Kalkan</span><span>' + (s.dovus ? (s.dovus.kalkan ? 'Hazır' : 'Bu dövüşte kullanıldı') : 'Her dövüşte 1 darbe') + '</span></div>' : '') +
      '<div class="satir"><span>Altın</span><span>' + s.altin + '</span></div>' +
      Object.entries(kitap.sayaclar || {}).map(([ad, tanim]) => {
        const n = (s.sayaclar && s.sayaclar[ad]) || 0, max = tanim.enFazla || 10;
        const sv = sayacSeviyesi(ad);
        return '<div class="satir sayac" title="' + esc(tanim.aciklama || '') + '"><span>' + esc(tanim.ad) +
          (sv ? ' <em class="sayac-seviye s' + sv.indeks + '">' + esc(sv.seviye.ad) + '</em>' : '') + '</span><span class="damlalar" aria-label="' + n + ' / ' + max + '">' +
          Array.from({ length: max }, (_, i) => '<i class="' + (i < n ? 'dolu' : '') + '"></i>').join('') + '</span></div>' +
          (sv && sv.seviye.acik ? '<p class="sayac-acik">' + esc(sv.seviye.acik) + '</p>' : '');
      }).join('') +
      '<button class="ikincil canta-kisa" type="button" data-canta>' + CANTA_SIMGE + 'Çantayı aç <span class="adet">' + esyaSayisi() + ' eşya</span></button></div>';
  }

  // ───────── çanta ─────────
  const CANTA_SIMGE = '<svg class="simge" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.2 7.5C5.8 9.6 4 13.2 4 16.2A4.8 4.8 0 0 0 8.8 21h6.4a4.8 4.8 0 0 0 4.8-4.8c0-3-1.8-6.6-6.2-8.7Z" fill="currentColor" opacity=".85"/><path d="M9 3.5h6l-1.6 4h-2.8Z" fill="currentColor"/><path d="M8.5 7.5h7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M15.5 7.5c1.6.2 2.6 1.1 2.8 2.4" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>';
  const ESYA_SIMGE = {
    iksir: '<path d="M9 3h6M10 3v5L5.5 17a3 3 0 0 0 2.7 4h7.6a3 3 0 0 0 2.7-4L14 8V3" fill="none" stroke="#e9e4d6" stroke-width="1.6"/><path d="M7.2 14h9.6l1.5 3.2a2 2 0 0 1-1.8 2.8H7.5a2 2 0 0 1-1.8-2.8Z" fill="#e05252"/>',
    mesale: '<path d="M11 10h2l-1 11Z" fill="#8a6a42"/><path d="M12 2c3 3 3.5 5 2.5 7H9.5C8.5 7 9 5 12 2Z" fill="#e8643a"/><path d="M12 5c1.3 1.5 1.4 2.6 1 4h-2c-.4-1.4-.3-2.5 1-4Z" fill="#ffd27a"/>',
    maymuncuk: '<path d="M4 20 15 9" stroke="#c9ced0" stroke-width="2" stroke-linecap="round"/><circle cx="17" cy="7" r="3.2" fill="none" stroke="#c9ced0" stroke-width="1.8"/><path d="M6 18l2 2M8 16l2 2" stroke="#c9ced0" stroke-width="1.6"/>',
    kemik_anahtar: '<circle cx="7" cy="7" r="3.5" fill="#efe6cf"/><path d="M9.5 9.5 19 19M15 15l2-2M17 17l2-2" stroke="#efe6cf" stroke-width="2.2" stroke-linecap="round"/>',
    halvard_sayfasi: '<path d="M6 3h9l3 3v15H6Z" fill="#e3d6b4"/><path d="M9 9h6M9 12h6M9 15h4" stroke="#5a4630" stroke-width="1.2"/>',
    halvard_yelegi: '<path d="M8 3 5 6v15h5v-8h4v8h5V6l-3-3-2 3h-4Z" fill="#8a5a34"/><path d="M12 6v14" stroke="#5a3a20" stroke-width="1"/>',
  };
  const esyaSimgesi = (id) => '<svg viewBox="0 0 24 24" aria-hidden="true">' + (ESYA_SIMGE[id] || '<circle cx="12" cy="12" r="6" fill="#a9b3a8"/>') + '</svg>';

  function cantaAc() {
    if (!s) return;
    const esyalar = Object.entries(s.esyalar).filter(([, n]) => n > 0);
    const kaz = kazanimlar();
    const belgeler = (kitap.belgeler || []).filter((b) => s.bayraklar[b.bayrak]);
    const esyaKarti = ([id, n]) => {
      const e = kitap.esyalar[id] || { ad: id, aciklama: '' };
      const k = M.esyaKullanilabilir(kitap, s, id);
      const dugme = id === 'iksir'
        ? '<button class="birincil kucuk" type="button" data-kullan="iksir"' + (k.aktif ? '' : ' disabled') + '>İç</button>' + (k.aktif ? '' : '<span class="neden">' + esc(k.neden) + '</span>')
        : '';
      return '<li class="esya' + (e.kalici ? ' kalici' : '') + '"><span class="esya-simge">' + esyaSimgesi(id) + '</span><div class="esya-govde"><b>' + esc(e.ad) +
        (n > 1 ? ' <span class="adet">× ' + n + '</span>' : '') + (e.kalici ? ' <span class="rozet ozel">Kalıcı</span>' : '') + '</b><p>' + esc(e.aciklama) + '</p>' +
        (dugme ? '<div class="esya-eylem">' + dugme + '</div>' : '') + '</div></li>';
    };
    cantaPaneli.innerHTML = '<div class="canta-kutu" role="dialog" aria-modal="true" aria-labelledby="cantaBaslik">' +
      '<div class="canta-ust"><h2 id="cantaBaslik">' + CANTA_SIMGE + 'Çanta</h2><button class="ikincil" type="button" data-kapat aria-label="Çantayı kapat">Kapat</button></div>' +
      '<div class="canta-icerik">' +
      '<section><h3>Eşyalar</h3>' + (esyalar.length ? '<ul class="esyalar">' + esyalar.map(esyaKarti).join('') + '</ul>' : '<p class="ozet">Çantan boş.</p>') +
      '<p class="altin-satiri"><b>' + s.altin + '</b> altın</p></section>' +
      '<section><h3>Kalıcı kazanımlar</h3>' + (kaz.length
        ? '<ul class="kazanimlar">' + kaz.map((k) => '<li><span>' + esc(k.ad) + '</span><span>' + k.once + ' → <b>' + k.simdi + '</b> <em class="arti">+' + (k.simdi - k.once) + '</em></span></li>').join('') + '</ul>'
        : '<p class="ozet">Henüz yok. Her katın sonundaki merdivende bir gelişim seçersin.</p>') + '</section>' +
      '<section><h3>Belgeler</h3>' + (belgeler.length
        ? belgeler.map((b) => '<article class="belge"><h4>' + esc(b.baslik) + '</h4><p>' + esc(b.metin) + '</p></article>').join('')
        : '<p class="ozet">Henüz bir şey bulmadın.</p>') + '</section>' +
      '</div></div>';
    cantaPaneli.hidden = false;
    document.body.classList.add('canta-acik');
    const k = cantaPaneli.querySelector('[data-kapat]');
    if (k) k.focus();
  }

  function cantaKapat() {
    cantaPaneli.hidden = true;
    document.body.classList.remove('canta-acik');
  }

  cantaPaneli.addEventListener('click', (e) => {
    if (e.target === cantaPaneli || e.target.closest('[data-kapat]')) { cantaKapat(); if (cantaDugmesi && !cantaDugmesi.hidden) cantaDugmesi.focus(); return; }
    const kullan = e.target.closest('[data-kullan]');
    if (kullan && !kullan.disabled && !mesgul) {
      cantaKapat();
      ilerle(M.esyaKullan(kitap, s, kullan.dataset.kullan, zar));
    }
  });
  cantaDugmesi.addEventListener('click', cantaAc);
  ekran.addEventListener('click', (e) => { if (e.target.closest('[data-canta]')) cantaAc(); });


  // ───────── sahne ─────────
  function ciz() {
    const d = M.dugum(kitap, s);
    const notKotu = s.not && /−\d|Kaçamadın|kıpırdamadı|tetiklendi/.test(s.not);
    let h = '<div class="oyun"><section class="sahne">' + gorselHTML(d) + '<div class="metin">';
    if (s.son) h += '<div class="son-afis ' + s.son.tur + '">' + esc(s.son.baslik) + '</div>';
    h += '<h2>' + esc(d.baslik) + '</h2>';
    if (s.not) h += '<p class="not' + (notKotu ? ' kotu' : '') + '">' + isle(s.not) + '</p>';
    for (const ad of Object.keys(kitap.sayaclar || {})) {
      const sv = sayacSeviyesi(ad);
      if (!sv) continue;
      const once = sonSeviyeler[ad];
      if (once != null && once !== sv.indeks && sv.seviye.uyari) {
        h += '<p class="not sayac-uyari">' + esc(sv.indeks > once ? sv.seviye.uyari : (sv.seviye.geriUyari || sv.seviye.uyari)) + '</p>';
      }
      sonSeviyeler[ad] = sv.indeks;
    }
    if (s.zarNotu && s.zarNotu.neden === 'altin') {
      h += s.zarNotu.atis ? '<div class="not zarnot" id="zarNotu">' + atisHTML('Altın', s.zarNotu.atis, '', 'altın') + '</div>'
        : '<p class="not zarnot">+' + s.zarNotu.deger + ' altın</p>';
    }
    if (s.zarNotu && s.zarNotu.neden === 'iksir') {
      h += '<div class="not zarnot" id="zarNotu">' + atisHTML('İksir', s.zarNotu.atis, '', 'Can') + '<p class="hesap" style="margin:4px 0 0">İksiri içtin: <b>+' + s.zarNotu.deger + ' Can</b>.</p></div>';
    }
    if (!s.dovus) h += M.gorunenMetin(kitap, s, d).map((p) => '<p>' + isle(p) + '</p>').join('');
    h += '<div id="eylem"></div></div></section><aside class="yan">' + kagitHTML() + haritaHTML() + '</aside></div>';
    ekran.innerHTML = h;
    cantaDugmesi.querySelector('.adet').textContent = esyaSayisi();
    const kat = katNo(s.dugum);
    if (logoAlt) logoAlt.textContent = kat ? kat + '. Kat · ' + (kitap.katAdlari[kat] || '') : '';
    const img = ekran.querySelector('.gorsel img');
    if (img) {
      const ad = img.dataset.ad;
      const bitti = () => { yuklenen.add(ad); img.classList.add('yuklendi'); };
      if (img.complete && img.naturalWidth) bitti();
      else img.addEventListener('load', bitti);
      img.addEventListener('error', () => { img.parentNode.innerHTML = sahneCizimi(ad); });
    }
    komsulariYukle(s.dugum);
    const eylem = document.getElementById('eylem');
    const zn = document.getElementById('zarNotu');
    if (zn) zarlariYuvarla(zn);
    if (s.son) sonCiz(eylem);
    else if (s.bekleyen) bekleyenCiz(eylem);
    else if (s.dovus) dovusCiz(eylem);
    else seceneklerCiz(eylem);
  }

  function ilerle(yeniDurum, yukariKaydir) {
    s = yeniDurum;
    ciz();
    if (yukariKaydir) ekran.scrollIntoView({ block: 'start', behavior: azHareket ? 'auto' : 'smooth' });
  }

  function seceneklerCiz(kap) {
    const sc = M.secenekler(kitap, s);
    kap.innerHTML = '<div class="secimler">' + sc.map((x, n) => {
      let rozet = '';
      if (x.hatirla) rozet += '<span class="rozet hatirla" title="Daha önce verdiğin bir karar burada işe yarıyor">↺ ' + esc(x.hatirla) + '</span>';
      if (x.sayac) for (const [ad, n] of Object.entries(x.sayac)) {
        const tanim = (kitap.sayaclar || {})[ad] || { ad };
        rozet += '<span class="rozet sayac-rozet" title="' + esc(tanim.aciklama || '') + '">' + (n > 0 ? '+' : '−') + Math.abs(n) + ' ' + esc(tanim.ad) + '</span>';
      }
      if (x.gelisim) rozet += '<span class="rozet ozel">Kalıcı</span>';
      if (x.ozel) rozet += '<span class="rozet ozel">' + esc(x.ozel.map((id) => kitap.siniflar[id].ad).join(' / ')) + '</span>';
      if (x.sinama && x.sinama.ustalik) rozet += '<span class="rozet ozel">Ustalık</span>';
      if (x.sinama) rozet += '<span class="rozet zarli">' + esc(x.sinama.ozellikAdi) + ' · zorluk ' + x.sinama.zorluk + ' · %' + Math.round(x.sinama.olasilik * 100) + '</span>';
      if (x.tur === 'dovus') rozet += '<span class="rozet zarli">Dövüş</span>';
      if (!x.aktif) rozet += '<span class="rozet kilit">' + esc(x.neden) + '</span>';
      return '<button class="secim" type="button" data-i="' + x.indeks + '"' + (x.aktif ? '' : ' disabled') + '><span class="no">' + (n + 1) + '</span><span class="ne">' + esc(x.metin) + '</span>' + rozet + '</button>';
    }).join('') + '</div>';
    kap.querySelectorAll('.secim:not(:disabled)').forEach((b) => b.addEventListener('click', () => {
      if (mesgul) return;
      const t = M.secenekler(kitap, s).find((x) => x.indeks === +b.dataset.i);
      ilerle(M.sec(kitap, s, +b.dataset.i, zar), t.tur === 'git');
    }));
  }

  function sinamaHTML(b, baslik) {
    const zarlar = b.zarlar || [b.zar];
    const onceki = b.sansKullanildi ? '<p class="ozet">Şans kullanıldı. İlk atış: ' + ((b.onceki.zarlar || [b.onceki.zar]).join(' ve ')) + '</p>' : '';
    // Ustalıkta iki zar: yüksek olan sayılır, düşük olan soluk gösterilir.
    let enYuksekGosterildi = false;
    const zarHtml = zarlar.map((v) => {
      const sayilan = v === b.zar && !enYuksekGosterildi;
      if (sayilan) enYuksekGosterildi = true;
      return zarHTML(v, zarlar.length > 1 && !sayilan ? 'soluk' : '', 20);
    }).join('');
    const ustalikSatiri = b.ustalik ? '<span class="rozet ozel">Ustalık: iki zar, yükseği sayılır</span>' : '';
    const zarYazisi = b.ustalik ? zarlar.join(' ve ') + ' → ' + b.zar : String(b.zar);
    return '<div class="panel"><h3>' + esc(baslik) + ' ' + ustalikSatiri + '</h3>' + onceki +
      '<div class="zarlar">' + zarHtml + '</div>' +
      '<div class="gec gizli"><p class="hesap">' + zarYazisi + ' + ' + esc(b.ozellikAdi) + ' ' + b.deger + ' = <b>' + b.toplam + '</b> · zorluk ' + b.zorluk + '</p>' +
      '<span class="sonuc ' + (b.basari ? 'iyi' : 'kotu') + '">' + (b.basari ? 'Başarı' : 'Başarısızlık') + '</span>' +
      dugmelerHTML(b) + '</div></div>';
  }


  function dugmelerHTML(b) {
    return '<div class="dugmeler"><button class="birincil" type="button" id="devam">Devam</button>' +
      (b.sansUygun ? '<button class="ikincil" type="button" id="sans">Şansını kullan: yeniden at (1 hak)</button>' : '') + '</div>';
  }

  function bekleyenCiz(kap) {
    const b = s.bekleyen;
    if (b.tip === 'sinama') kap.innerHTML = sinamaHTML(b, b.ozellikAdi + ' sınaması');
    else kap.innerHTML = dovusPaneli(b);
    const gec = kap.querySelector('.gec');
    const ilk = [...kap.querySelectorAll('.zar')].filter((z) => !z.closest('.gec'));
    // İki aşama: önce isabet zarları, sonuç görününce hasar zarları.
    zarlariYuvarla(ilk).then(() => {
      if (gec) gec.classList.remove('gizli');
      return gec ? zarlariYuvarla(gec) : null;
    }).then(() => {
      if (b.dusman && b.dusman.isabet && !b.dusman.kalkanla) document.querySelector('.kagit').classList.add('vurus');
      const d = document.getElementById('devam');
      if (d) d.focus({ preventScroll: true });
    });
    kap.addEventListener('click', (e) => {
      if (mesgul) return;
      if (e.target.id === 'devam') {
        const sonra = M.devam(kitap, s, zar);
        ilerle(sonra, b.tip === 'sinama' || !sonra.dovus);
      }
      if (e.target.id === 'sans') ilerle(M.sansKullan(kitap, s, zar));
    });
  }


  // ───────── dövüş ─────────
  function rakipHTML() {
    const dv = s.dovus, dm = dv.dusman, c = kitap.siniflar[s.sinif];
    const bilgi = (zirh, saldiri, hasar) => '<p class="ozet" style="margin:4px 0 0">Zırh ' + zirh + ' · Saldırı +' + saldiri + ' · Hasar ' + esc(hasar) + '</p>';
    const canBar = (n, max) => '<div class="olcu"><span>Can</span><span class="cubuk can"><i style="width:' + Math.max(0, (n / max) * 100) + '%"></i></span><b>' + Math.max(0, n) + '</b></div>';
    const ek = (n) => (n ? ' + ' + n : '');
    return '<div class="rakip"><div><div class="ad">' + esc(dm.ad) + ' <small>· tur ' + dv.tur + '</small></div>' + canBar(dv.dusmanCan, dm.can) +
      bilgi(dm.zirh, dm.saldiri, M.Zar.ifadeAdi(dm.hasarZari) + ek(dm.hasarEki)) + '</div>' +
      '<div><div class="ad">' + esc(s.ad) + '</div>' + canBar(s.can, s.maxCan) +
      bilgi(s.zirh + (dv.ekZirh || 0) + (dv.ekZirh ? ' (hece +' + dv.ekZirh + ')' : ''), s.ozellik[c.saldiriOzelligi], M.Zar.ifadeAdi(c.hasarZari) + ek(s.ozellik[c.saldiriOzelligi] + (s.silahEki || 0))) + '</div></div>';
  }


  function kayitHTML() {
    const k = s.dovus.kayit.slice(-4);
    return k.length ? '<ul class="kayit">' + k.map((x) => '<li>' + esc(x) + '</li>').join('') + '</ul>' : '';
  }

  /** Hasar satırı: zarlar (+ ifade eki) + özellik eki = hasar. */
  function hasarHTML(etiket, r, sinif) {
    const a = r.hasarAtisi;
    if (!a) return '';
    return '<div class="atis"><span class="kim">' + esc(etiket) + '<small>' + esc(M.Zar.ifadeAdi(a.ifade)) + '</small></span>' +
      a.zarlar.map((v) => zarHTML(v, sinif, a.yuz)).join('') +
      (a.ek ? '<span class="ek">+ ' + a.ek + '</span>' : '') +
      (a.ozellikEki ? '<span class="ek">+ ' + a.ozellikEki + '</span>' : '') +
      '<span class="esit">= <b>' + r.hasar + '</b> hasar</span></div>';
  }

  /** Bir saldırının sonuç satırı: zar + bonus = toplam · Zırh → isabet/ıska. */
  function saldiriSonucu(r, ad, hedefAdi) {
    const etiket = r.sinsi ? 'Sinsi ilk vuruş: kesin kritik' : r.kritik ? 'Kritik!' : r.nat === 1 ? 'Doğal 1: ıska' : r.isabet ? 'İsabet' : 'Iska';
    const sinif = !r.isabet ? (r.kim === 'oyuncu' ? 'kotu' : 'iyi') : r.kalkanla ? 'ara' : r.kim === 'oyuncu' ? 'iyi' : 'kotu';
    return '<p class="hesap"><b>' + esc(ad) + ':</b> ' + r.nat + ' + ' + r.bonus + ' = <b>' + r.toplam + '</b> · ' + esc(hedefAdi) + ' ' + r.zirh +
      ' <span class="sonuc kucuk ' + sinif + '">' + (r.kalkanla ? 'Kalkan savuşturdu' : etiket) + '</span></p>';
  }

  function dovusPaneli(b) {
    const dv = s.dovus, dm = dv.dusman, c = kitap.siniflar[s.sinif];
    let ilk = '', gec = '';
    if (b.sansKullanildi) ilk += '<p class="ozet">Şans kullanıldı. İlk atış: ' + b.onceki.zar + '</p>';
    if (b.oyuncu) {
      ilk += '<div class="taraf"><span class="kim">Sen</span>' + zarHTML(b.oyuncu.nat, '', 20) + '</div>';
      gec += saldiriSonucu(b.oyuncu, 'Sen', 'Zırh') + hasarHTML(c.silah + (b.oyuncu.kritik ? ' · kritik' : ''), b.oyuncu, '');
    }
    if (b.buyu) {
      ilk += '<div class="atis"><span class="kim">Ateş Oku<small>kesin isabet</small></span>' + b.buyu.zarlar.map((v) => zarHTML(v, '', b.buyu.yuz)).join('') + '<span class="esit">= <b>' + b.buyu.toplam + '</b> hasar</span></div>';
    }
    if (b.hece) {
      ilk += '<p class="hesap"><b>Kalkan Hecesi:</b> havada soluk bir kalkan belirdi. Bu dövüşte Zırhın <b>+' + b.hece + '</b>.</p>';
    }
    if (b.iksir) {
      ilk += '<div class="atis"><span class="kim">İksir<small>' + esc(M.Zar.ifadeAdi(b.iksir.atis.ifade)) + '</small></span>' + b.iksir.atis.zarlar.map((v) => zarHTML(v, '', b.iksir.atis.yuz)).join('') +
        '<span class="ek">+ ' + b.iksir.atis.ek + '</span><span class="esit">= <b>+' + b.iksir.iyilesme + '</b> Can</span></div>';
    }
    if (b.kacis) {
      const k = b.kacis;
      ilk += '<div class="taraf"><span class="kim">Kaçış</span>' + zarHTML(k.zar, '', 20) + '</div>';
      gec += '<p class="hesap"><b>Kaçış:</b> ' + k.zar + ' + Çeviklik ' + k.deger + ' = <b>' + k.toplam + '</b> · zorluk ' + k.zorluk +
        ' <span class="sonuc kucuk ' + (k.basari ? 'iyi' : 'kotu') + '">' + (k.basari ? 'Kaçtın' : 'Kaçamadın') + '</span></p>';
    }
    if (b.dusman) {
      ilk += '<div class="taraf"><span class="kim">' + esc(dm.ad) + '</span>' + zarHTML(b.dusman.nat, 'dusman', 20) + '</div>';
      gec += saldiriSonucu(b.dusman, dm.ad, 'Zırhın') + hasarHTML(dm.silah || dm.ad, b.dusman, 'dusman');
    } else if (b.pusu && dv.dusmanCan > b.oyuncu.hasar) {
      gec += '<p class="hesap">' + esc(dm.ad) + ' şaşkın; bu tur karşılık veremedi.</p>';
    } else if (!b.kacis || !b.kacis.basari) {
      gec += '<p class="hesap">' + esc(dm.ad) + ' yere yığılıyor; saldıramadan düştü.</p>';
    }
    return '<div class="panel"><h3>Dövüş: ' + esc(dm.ad) + '</h3>' + rakipHTML() +
      '<div class="zarlar" style="flex-direction:column;align-items:flex-start">' + ilk + '</div>' +
      '<div class="gec gizli">' + gec + dugmelerHTML(b) + '</div>' + kayitHTML() + '</div>';
  }



  function dovusCiz(kap) {
    const eylemler = M.dovusEylemleri(kitap, s);
    kap.innerHTML = '<div class="panel"><h3>Dövüş: ' + esc(s.dovus.dusman.ad) + '</h3>' + rakipHTML() +
      '<p class="ozet" style="margin:0 0 4px">Önce sen davranırsın, sonra rakip senin Zırh’ına saldırır.</p>' +
      '<div class="secimler">' + eylemler.map((e, n) =>
        '<button class="secim" type="button" data-e="' + e.id + '"' + (e.aktif ? '' : ' disabled') + '><span class="no">' + (n + 1) + '</span><span class="ne">' + esc(e.ad) + '</span>' +
        (e.id === 'saldir' ? '<span class="rozet ' + (e.pusu ? 'ozel">kesin kritik' : 'zarli">isabet %' + Math.round(e.olasilik * 100)) + '</span>' : '') +
        (e.id === 'kac' ? '<span class="rozet zarli">Çeviklik · zorluk ' + s.dovus.kacisZorlugu + ' · %' + Math.round(e.olasilik * 100) + '</span>' : '') +
        (!e.aktif && e.neden ? '<span class="rozet kilit">' + esc(e.neden) + '</span>' : '') + '</button>').join('') +
      '</div>' + kayitHTML() + '</div>';
    kap.querySelectorAll('.secim:not(:disabled)').forEach((b) => b.addEventListener('click', () => {
      if (!mesgul) ilerle(M.dovusEylem(kitap, s, b.dataset.e, zar));
    }));
  }

  function sonCiz(kap) {
    const oda = new Set(s.ziyaret.map((id) => kitap.dugumler[id].harita).filter(Boolean).map((h) => (h.kat || 1) + ':' + h.x + ',' + h.y)).size;
    const sayfa = s.esyalar.halvard_sayfasi || 0;
    kap.innerHTML = '<p class="ozet">Gezilen oda: ' + oda + ' · Halvard’ın sayfaları: ' + sayfa + '/3 · Altın: ' + s.altin + ' · Kalan Can: ' + Math.max(0, s.can) + ' · Şans: ' + (s.sans ? 'kullanılmadı' : 'kullanıldı') + '</p>' +
      '<div class="dugmeler"><button class="birincil" type="button" id="tekrar">Aynı karakterle yeniden in</button><button class="ikincil" type="button" id="baska">Başka sınıf seç</button></div>';
    document.getElementById('tekrar').addEventListener('click', baslat);
    document.getElementById('baska').addEventListener('click', secimEkrani);
  }

  // ───────── klavye: 1-9 seçer, Enter/Boşluk devam ─────────
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !cantaPaneli.hidden) { cantaKapat(); return; }
    if (!s || mesgul || e.target.tagName === 'INPUT') return;
    if ((e.key === 'ç' || e.key === 'Ç' || e.key === 'c') && cantaPaneli.hidden) { e.preventDefault(); cantaAc(); return; }
    if (!cantaPaneli.hidden) return;
    if (/^[1-9]$/.test(e.key)) {
      const b = ekran.querySelectorAll('#eylem .secim')[+e.key - 1];
      if (b && !b.disabled) { e.preventDefault(); b.click(); }
    }
  });

  bastanDugmesi.addEventListener('click', secimEkrani);
  secimEkrani();
}

</script>
</body>
</html>
