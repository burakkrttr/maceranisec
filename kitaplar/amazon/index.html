<style>
/* Tek tema bilerek: karanlık bir oda, masada açık bir kitap, arkada fırtınalı pencere.
   Düzen: masaüstünde iki sayfalı açık kitap (solda levha ve bekçinin kaydı, sağda metin), telefonda tek sayfa. */
:root {
  --night: #0c1012;        /* oda, kitabın dışı */
  --paper: #efe6d1;        /* sayfa */
  --paper-edge: #e2d6bb;   /* sayfa kenarı, cilt gölgesi */
  --ink: #2b241d;          /* metin mürekkebi */
  --faded: #75685a;        /* soluk mürekkep, ikincil metin */
  --rubric: #8d3a26;       /* kırmızı mürekkep: § numaraları, başharfler, süslemeler */
  --lamp: #e9b34f;         /* fener ışığı, kapak vurgusu */
  --display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --body: "EB Garamond", "Iowan Old Style", Georgia, serif;
  --hand: "Caveat", "Segoe Print", "Bradley Hand", cursive;
  --cloth: #3b2520;        /* cilt kumaşı */
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--night); color: var(--ink); font-family: var(--body); overflow: hidden; }
canvas#sea { position: fixed; inset: 0; width: 100%; height: 100%; display: block; opacity: 0.42; }
.vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, rgba(12,16,18,0) 30%, rgba(12,16,18,0.85) 100%); }

/* üst şerit */
.top {
  background: linear-gradient(var(--night) 55%, rgba(12,16,18,0));
  position: fixed; top: 0; left: 0; right: 0; z-index: 4;
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding: 12px clamp(16px, 3vw, 36px);
  font-family: var(--display); color: #cfc4ad;
}
.top .series { font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; }
.top .series b { color: var(--lamp); font-weight: 600; }
.top nav { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.link {
  font-family: var(--display); font-size: 17px; font-weight: 600; letter-spacing: 0.06em;
  background: none; border: 0; color: #cfc4ad; cursor: pointer; padding: 6px 10px; border-radius: 2px;
}
.link:hover { color: var(--lamp); }
a.link { text-decoration: none; }
.link:focus-visible, .choice:focus-visible, .btn:focus-visible { outline: 2px solid var(--lamp); outline-offset: 3px; }
.confirm { display: none; gap: 4px; align-items: center; font-style: italic; color: #cfc4ad; font-size: 16px; }
.confirm.show { display: inline-flex; }

main { position: relative; z-index: 2; height: 100%; overflow-y: auto; padding: 64px clamp(10px, 3vw, 40px) 40px; }

/* ---------- açık kitap ---------- */
.book {
  max-width: 1120px; margin: 0 auto;
  display: grid; grid-template-columns: 1fr 1fr;
  background: var(--paper);
  border-radius: 3px 6px 6px 3px;
  box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(0,0,0,0.25), 0 6px 0 -2px #d9ccad, 0 10px 0 -4px #cdbf9e;
  position: relative;
}
.book::before { /* cilt */
  content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 70px; transform: translateX(-50%); pointer-events: none;
  background: linear-gradient(90deg, rgba(0,0,0,0) 0%, rgba(80,60,30,0.10) 38%, rgba(40,28,10,0.28) 50%, rgba(80,60,30,0.10) 62%, rgba(0,0,0,0) 100%);
}
.leaf {
  position: relative; padding: 46px clamp(26px, 4vw, 58px) 54px;
  background-image:
    radial-gradient(rgba(120,95,55,0.07) 1px, transparent 1px),
    radial-gradient(rgba(120,95,55,0.05) 1px, transparent 1px);
  background-size: 7px 7px, 11px 11px; background-position: 0 0, 3px 5px;
  min-height: min(760px, calc(100vh - 110px));
}
.leaf.left { border-right: 1px solid rgba(120,95,55,0.15); }
.folio { position: absolute; bottom: 20px; left: 0; right: 0; text-align: center; font-family: var(--display); font-size: 15px; color: var(--faded); letter-spacing: 0.1em; }

/* sol sayfa: levha + kayıt */
.plate { display: flex; flex-direction: column; gap: 22px; }
.act-title { text-align: center; font-family: var(--display); text-transform: uppercase; letter-spacing: 0.22em; font-size: 13.6px; color: var(--rubric); }
.act-title span { display: block; font-size: 30px; letter-spacing: 0.06em; color: var(--ink); font-variant: normal; text-transform: none; font-weight: 600; margin-top: 2px; }
.ill { margin: 0; padding: 10px; background: #f6efdf; border: 1px solid rgba(80,60,30,0.25); box-shadow: inset 0 0 0 4px var(--paper), inset 0 0 0 5px rgba(80,60,30,0.25); }
.ill img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; filter: sepia(0.18) contrast(1.02); }
.ill figcaption { text-align: center; font-style: italic; font-size: 16px; color: var(--faded); margin-top: 8px; }
.log { border-top: 1px solid rgba(80,60,30,0.3); border-bottom: 1px solid rgba(80,60,30,0.3); padding: 14px 4px; display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; gap: 6px; }
.log div { font-size: 11.2px; color: var(--faded); text-transform: uppercase; letter-spacing: 0.12em; }
.log b { display: block; font-family: var(--display); font-size: 30px; color: var(--ink); font-weight: 600; letter-spacing: 0.02em; font-variant-numeric: lining-nums tabular-nums; text-transform: none; }
.margin-note { font-style: italic; font-size: 18px; line-height: 1.55; color: var(--faded); text-align: center; padding: 0 10px; text-wrap: balance; }
.fleuron { text-align: center; color: var(--rubric); font-size: 22px; letter-spacing: 0.6em; }

/* sağ sayfa: metin */
.sect { text-align: center; font-family: var(--display); color: var(--rubric); font-size: 22px; font-weight: 600; letter-spacing: 0.08em; }
.sect::before, .sect::after { content: "❧"; font-size: 16px; margin: 0 12px; position: relative; top: -2px; opacity: 0.8; }
.sect::before { display: inline-block; transform: scaleX(-1); }
.leaf h2 { font-family: var(--display); font-weight: 600; font-size: 24px; text-align: center; margin: 6px 0 4px; text-transform: uppercase; letter-spacing: 0.08em; text-wrap: balance; }
.kind { text-align: center; font-style: italic; color: var(--rubric); font-size: 17px; margin-bottom: 4px; }
.text { margin-top: 22px; }
.text p { font-size: 20px; line-height: 1.58; margin: 0 0 12px; text-align: justify; hyphens: auto; -webkit-hyphens: auto; text-indent: 1.4em; }
.text p.lead, .text p.first { text-indent: 0; }
.text p.lead::first-letter { float: left; font-family: var(--display); font-weight: 600; color: var(--rubric); font-size: 76px; line-height: 0.82; padding: 6px 8px 0 0; }
.text p.quote { font-style: italic; text-indent: 0; margin: 4px 1.6em 14px; text-align: left; color: #3d342b; }
.sub { font-family: var(--display); text-transform: uppercase; letter-spacing: 0.2em; color: var(--rubric); font-size: 13.6px; text-align: center; margin: 26px 0 10px; }
.fates { list-style: none; padding: 0; margin: 0; }
.fates li { font-size: 18px; line-height: 1.5; padding: 7px 0; border-bottom: 1px dotted rgba(80,60,30,0.35); }
.fates b { text-transform: uppercase; letter-spacing: 0.06em; font-size: 15.2px; margin-right: 6px; }
.the-end { text-align: center; font-family: var(--display); font-size: 40px; letter-spacing: 0.4em; color: var(--ink); margin: 30px 0 4px; padding-left: 0.4em; }
.missed { list-style: none; padding: 0; margin: 0; }
.missed li { font-style: italic; color: var(--faded); font-size: 17px; text-align: center; padding: 3px 0; }
.tally { text-align: center; font-style: italic; color: var(--faded); font-size: 16px; margin-top: 14px; }

/* seçenekler: oyun kitabı yönergesi */
.choices { margin-top: 26px; border-top: 1px solid rgba(80,60,30,0.3); padding-top: 14px; display: flex; flex-direction: column; }
.choice {
  display: flex; align-items: baseline; gap: 10px; width: 100%; text-align: left; cursor: pointer;
  background: none; border: 0; border-bottom: 1px dotted rgba(80,60,30,0.3); padding: 11px 4px;
  font-family: var(--body); font-size: 19px; line-height: 1.4; color: var(--ink);
}
.choice .ct { flex: 1; font-style: italic; }
.choice .cn { font-family: var(--display); font-weight: 600; font-size: 20px; color: var(--rubric); white-space: nowrap; font-variant-numeric: lining-nums; }
.choice:hover .ct { text-decoration: underline; text-decoration-color: var(--rubric); text-underline-offset: 4px; }
.choice:hover { background: rgba(141,58,38,0.05); }

/* sayfa çevirme */
@keyframes ink { from { opacity: 0.1; transform: translateX(10px); } to { opacity: 1; transform: none; } }

/* ---------- kapak ---------- */
.cover-wrap { max-width: 1040px; margin: 0 auto; display: grid; grid-template-columns: minmax(280px, 430px) 1fr; gap: clamp(24px, 4vw, 56px); align-items: center; min-height: calc(100vh - 120px); }
.cover {
  container-type: inline-size;
  position: relative; aspect-ratio: 2 / 3; border-radius: 3px 8px 8px 3px; overflow: hidden;
  background: #101619 center / cover no-repeat;
  box-shadow: 0 30px 70px rgba(0,0,0,0.7), inset 6px 0 0 rgba(0,0,0,0.25), inset 9px 0 0 rgba(255,255,255,0.05);
  color: #f1e7cf; display: flex; flex-direction: column; justify-content: space-between; padding: 30px 26px 26px 34px;
}
.cover::before { content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(6,10,12,0.78) 0%, rgba(6,10,12,0.05) 38%, rgba(6,10,12,0.05) 62%, rgba(6,10,12,0.85) 100%); }
.cover > * { position: relative; }
.cover .band { font-family: var(--display); text-transform: uppercase; letter-spacing: 0.18em; font-size: clamp(9px, 2.7cqi, 12.5px); white-space: nowrap; text-align: center; color: var(--lamp); border-top: 1px solid rgba(233,179,79,0.5); border-bottom: 1px solid rgba(233,179,79,0.5); padding: 6px 0; }
.cover h1 { font-family: var(--display); font-weight: 600; font-size: clamp(44px, 19cqi, 88px); letter-spacing: 0.16em; text-align: center; margin: 18px 0 0; padding-left: 0.16em; line-height: 1; text-shadow: 0 2px 24px rgba(0,0,0,0.6); }
.cover .subt { text-align: center; font-style: italic; font-size: clamp(15px, 4.6cqi, 20px); margin-bottom: 10px; color: #e4d8bd; }
.cover .author { text-align: center; font-family: var(--display); font-size: clamp(14px, 4.8cqi, 20px); letter-spacing: 0.26em; text-transform: uppercase; padding-left: 0.26em; white-space: nowrap; }
.backcover { color: #e6dcc4; }
.backcover .slogan { font-family: var(--display); font-size: clamp(28px, 3.2vw, 38px); line-height: 1.2; font-weight: 600; color: #f3e9d2; margin: 0 0 18px; text-wrap: balance; }
.backcover p { font-size: 19px; line-height: 1.6; margin: 0 0 12px; max-width: 58ch; color: #d6cbb2; }
.colophon { display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; margin: 22px 0; padding: 14px 0; border-top: 1px solid rgba(214,203,178,0.25); border-bottom: 1px solid rgba(214,203,178,0.25); font-size: 17px; }
.colophon dt { text-transform: uppercase; letter-spacing: 0.14em; color: #a99d86; }
.colophon dd { margin: 0; color: #efe5cd; }
.btn {
  font-family: var(--display); font-size: 22px; font-weight: 600; letter-spacing: 0.1em;
  background: var(--lamp); color: #1d1608; border: 0; padding: 12px 28px; border-radius: 2px; cursor: pointer;
  box-shadow: 0 8px 24px rgba(233,179,79,0.25);
}
.btn:hover { background: #f2c56a; }

/* ---------- defter ---------- */
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 6; width: min(400px, 92vw);
  background: var(--paper); color: var(--ink); box-shadow: -20px 0 50px rgba(0,0,0,0.5);
  transform: translateX(105%); transition: transform .35s ease; padding: 28px 28px 34px; overflow-y: auto;
}
.drawer.open { transform: none; }
.drawer::before { content: ""; position: absolute; top: 0; left: 28px; width: 14px; height: 70px; background: var(--rubric); clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 82%, 0 100%); }
.drawer h3 { font-family: var(--display); text-transform: uppercase; letter-spacing: 0.2em; color: var(--rubric); font-size: 14.4px; margin: 26px 0 8px; text-align: center; }
.drawer h3:first-of-type { margin-top: 54px; }
.drawer ul { list-style: none; padding: 0; margin: 0; }
.drawer li { font-size: 17px; line-height: 1.5; padding: 8px 0; border-bottom: 1px dotted rgba(80,60,30,0.35); }
.drawer .empty { color: var(--faded); font-style: italic; }
.drawer-close { position: absolute; top: 14px; right: 16px; color: var(--ink); }

.toast {
  position: fixed; left: 50%; top: 58px; z-index: 7; transform: translate(-50%, -10px);
  font-style: italic; font-size: 18px; color: var(--paper); background: rgba(43,36,29,0.94);
  padding: 9px 18px; border-radius: 2px; border-left: 3px solid var(--rubric);
  opacity: 0; transition: opacity .4s, transform .4s; pointer-events: none; max-width: 90vw; text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 860px) {
  .book { grid-template-columns: 1fr; }
  .book::before { display: none; }
  .leaf { min-height: 0; padding: 30px 22px 50px; }
  .leaf.left { border-right: 0; border-bottom: 1px solid rgba(120,95,55,0.2); padding-bottom: 24px; }
  .plate { position: static; gap: 14px; }
  .log b { font-size: 24px; }
  .text p { font-size: 18.5px; text-align: left; }
  .leaf.left .folio { display: none; }
  main { padding-top: 92px; }
  .top .series { font-size: 13px; }
  .cover-wrap { grid-template-columns: 1fr; justify-items: center; }
  .cover { width: min(360px, 86vw); }
  .backcover { text-align: left; }
}
@media (prefers-reduced-motion: reduce) {
  .turn .leaf.right > *, .turn .leaf.left .plate { animation: none; }
  .drawer, .toast { transition: none; }
}

/* ===== kitap havası: cilt, sayfa kalınlığı, kurdele, sayfa başlıkları ===== */
.binding {
  max-width: 1150px; margin: 6px auto 30px; position: relative;
  background: var(--cloth); border-radius: 6px; padding: 12px 14px 14px;
  background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.025) 0 2px, transparent 2px 4px), repeating-linear-gradient(-45deg, rgba(0,0,0,0.08) 0 2px, transparent 2px 4px);
  box-shadow: 0 34px 80px rgba(0,0,0,0.65), inset 0 0 0 1px rgba(255,255,255,0.06), inset 0 0 30px rgba(0,0,0,0.5);
}
.binding .book { box-shadow: 0 2px 6px rgba(0,0,0,0.35); border-radius: 2px; perspective: 2400px; }
.edges { position: absolute; top: 16px; bottom: 18px; z-index: 0; border-radius: 2px;
  background: repeating-linear-gradient(90deg, #efe6d1 0 1px, #cfc1a0 1px 2px); }
.edges.l { right: calc(100% - 14px); }
.edges.r { left: calc(100% - 14px); }
.ribbon { position: absolute; z-index: 3; top: -6px; left: calc(50% + 14px); width: 11px; height: calc(100% + 46px); pointer-events: none;
  background: linear-gradient(90deg, #6f2a1b, #9b4430 45%, #7a2f1f); clip-path: polygon(0 0, 100% 0, 100% 100%, 50% calc(100% - 12px), 0 100%);
  box-shadow: 2px 0 4px rgba(0,0,0,0.3); opacity: 0.95; }
.leaf { background-color: var(--paper); }
.leaf.left { background-image:
    linear-gradient(90deg, rgba(90,65,30,0.10) 0%, rgba(90,65,30,0) 7%, rgba(90,65,30,0) 84%, rgba(70,50,20,0.16) 100%),
    radial-gradient(rgba(120,95,55,0.07) 1px, transparent 1px), radial-gradient(rgba(120,95,55,0.05) 1px, transparent 1px); }
.leaf.right { background-image:
    linear-gradient(90deg, rgba(70,50,20,0.16) 0%, rgba(90,65,30,0) 16%, rgba(90,65,30,0) 93%, rgba(90,65,30,0.10) 100%),
    radial-gradient(rgba(120,95,55,0.07) 1px, transparent 1px), radial-gradient(rgba(120,95,55,0.05) 1px, transparent 1px); }
.leaf { background-size: auto, 7px 7px, 11px 11px; background-position: 0 0, 0 0, 3px 5px; }
.runhead { position: absolute; top: 20px; left: 0; right: 0; text-align: center; font-family: var(--display); text-transform: uppercase; letter-spacing: 0.26em; font-size: 11.2px; color: var(--faded); }
.folio { bottom: 20px; text-align: left; padding: 0 clamp(26px, 4vw, 58px); font-variant-numeric: oldstyle-nums; font-size: 16px; }
.leaf.right .folio { text-align: right; }

/* bekçinin defteri: el yazısı kayıt */
.ledger { background: #f6eedb; border: 1px solid rgba(80,60,30,0.25); padding: 12px 16px 14px; transform: rotate(-0.6deg);
  background-image: repeating-linear-gradient(transparent 0 29px, rgba(70,90,120,0.22) 29px 30px); box-shadow: 0 2px 6px rgba(60,40,10,0.12); }
.ledger .lh { font-family: var(--display); text-transform: uppercase; letter-spacing: 0.2em; font-size: 10.4px; color: var(--rubric); }
.ledger .lv { font-family: var(--hand); font-size: 25px; line-height: 30px; color: #263a5a; }
.margin-note.hand { font-family: var(--hand); font-style: normal; font-size: 24px; line-height: 1.25; color: #263a5a; transform: rotate(-1.2deg); }
.margin-note .lbl { display: block; font-family: var(--body); font-style: italic; font-size: 16px; color: var(--faded); margin-bottom: 6px; }

/* seçenekler: içindekiler gibi noktalı çizgi */
.choice { border-bottom: 0; padding: 9px 2px; gap: 8px; }
.choice .ct { flex: 0 1 auto; }
.choice .lead-dots { flex: 1 1 24px; border-bottom: 2px dotted rgba(80,60,30,0.45); transform: translateY(-5px); min-width: 24px; }
.choice .cn::before { content: "§ "; font-size: 15px; }
.choices { border-top: 0; }
.choices::before { content: "❦"; display: block; text-align: center; color: var(--rubric); font-size: 20px; margin-bottom: 6px; }

/* sayfa çevirme */
.flip { position: absolute; top: 0; bottom: 0; left: 50%; width: 50%; z-index: 5; transform-origin: left center; transform-style: preserve-3d; pointer-events: none; animation: flip .85s cubic-bezier(.45,.05,.3,1) forwards; }
.flip .face { position: absolute; inset: 0; overflow: hidden; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.flip .face.back { transform: rotateY(180deg); }
.flip .face::after { content: ""; position: absolute; inset: 0; pointer-events: none; animation: shade .85s ease forwards; }
@keyframes flip { from { transform: rotateY(0deg); } to { transform: rotateY(-180deg); } }
@keyframes shade { 0% { background: rgba(40,28,10,0); } 50% { background: rgba(40,28,10,0.28); } 100% { background: rgba(40,28,10,0); } }
.hide-under { visibility: hidden; }
.lift { position: absolute; inset: 0; z-index: 5; transform-origin: left center; pointer-events: none; animation: lift .6s ease-in forwards; background: var(--paper); overflow: hidden; }
@keyframes lift { 0% { transform: perspective(1400px) rotateY(0); opacity: 1; box-shadow: 0 0 0 rgba(0,0,0,0); } 75% { opacity: 1; box-shadow: 20px 0 40px rgba(0,0,0,0.35); } 100% { transform: perspective(1400px) rotateY(-100deg); opacity: 0; } }

@media (max-width: 860px) {
  .binding { padding: 8px 8px 10px; }
  .edges, .ribbon { display: none; }
  .ledger .lv { font-size: 22px; }
  .runhead { top: 12px; }
}
@media (prefers-reduced-motion: reduce) { .flip, .lift { display: none; } }

/* ===== karar kartları ===== */
.choices { margin-top: 30px; gap: 12px; }
.choices::before { content: none; }
.decide { display: flex; align-items: center; gap: 14px; margin-bottom: 4px; font-family: var(--display); text-transform: uppercase; letter-spacing: 0.2em; font-size: 13.6px; color: var(--rubric); }
.decide::before, .decide::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, rgba(141,58,38,0.5)); }
.decide::after { background: linear-gradient(90deg, rgba(141,58,38,0.5), transparent); }
.choice {
  display: grid; grid-template-columns: 52px 1fr auto; align-items: center; gap: 14px;
  padding: 12px 16px 12px 12px; border: 1px solid rgba(80,60,30,0.22); border-radius: 3px;
  background: #f7f0de; box-shadow: inset 0 0 0 3px #f7f0de, inset 0 0 0 4px rgba(80,60,30,0.12), 0 1px 2px rgba(60,40,10,0.08);
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;

/* § numaraları: başlangıç 1, gerisi sabit tohumla karıştırılmış (klasik oyun kitabı gibi) */
const NUM = (() => {
  let seed = 1962;
  const rnd = () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const keys = [];
  Object.keys(S).forEach((k) => {
    keys.push(k);
    (S[k].choices || []).forEach((c, i) => keys.push(k + "#" + i));
    if (S[k].next) keys.push(k + "#next");
  });
  const pool = []; for (let n = 2; n <= 240; n++) pool.push(n);
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  const map = { a1: 1 }; let p = 0;
  keys.forEach((k) => { if (k !== "a1") map[k] = pool[p++]; });
  return map;
})();

let MUTE = false, toastTimer = null;

  if (MUTE) return;
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 3200);
}

    val(sec.akibet).forEach(([w, t]) => { right += `<li><b>${esc(w)}.</b> ${esc(t)}</li>`; });
    right += `</ul><div class="sub">${UI.yil}</div><div class="text"><p class="first">${esc(val(sec.yil))}</p></div>`;
    right += `<div class="the-end">${UI.son}</div>`;
    saveEnding(sec.end.id);
    right += `<div class="tally">${UI.bulunan(loadEndings().length, META.sonSayisi)}</div>`;
    right += `<div class="tally">${UI.takip} <a class="ig" href="${META.instagram}" target="_blank" rel="noopener">@${esc(META.instagramKullanici)}</a></div>`;
  }
  /* Perde sonundaki "Bu gece kaçırdıkların" kutusu okur isteğiyle kaldırıldı (2026-11-21).
     Kitaplardaki BOOK.hints verisi duruyor; geri açmak için bu bloğu eski haline getirmek yeterli. */

  right += `<div class="choices" id="choices"></div><div class="folio">${page + 1}</div>`;

  const read = Math.min(14, 3 + Math.round(state.steps * 0.8)), rest = Math.max(3, 16 - read);
  $("view").innerHTML = `<div class="binding"><div class="edges l" style="width:${read}px"></div><div class="edges r" style="width:${rest}px"></div><article class="book" id="book"><div class="leaf left" id="leaf-l">${left}</div><div class="leaf right" id="leaf-r">${right}</div></article><div class="ribbon"></div></div>`;

  const box = $("choices");
  const dh = document.createElement("div"); dh.className = "decide";
  dh.textContent = sec.end ? UI.kapatmadan : sec.actEnd ? ((typeof BOOK.actEndHead === "function" ? BOOK.actEndHead(sec) : BOOK.actEndHead) || UI.geceDevam) : UI.neYapacaksin;
  box.appendChild(dh);
  const addBtn = (text, n, onClick, id) => {
    const b = document.createElement("button");
    b.className = "choice"; b.type = "button"; if (id) b.id = id;
    b.innerHTML = (n == null ? `<span class="seal blank" aria-hidden="true">❧</span>` : `<span class="seal" aria-label="${UI.bolum(n)}">${n}</span>`)
      + `<span class="ct">${esc(text)}</span><span class="go" aria-hidden="true">${n == null ? UI.kapagaDon : UI.sayfayaGit}</span>`;
    b.addEventListener("click", onClick);
    box.appendChild(b);
  };
  if (sec.end || sec.actEnd) {
    if (sec.next) addBtn(sec.next.t, NUM[state.sec + "#next"], () => go(sec.next, NUM[state.sec + "#next"]), "c-next");
    if (sec.end) {
      addBtn(BOOK.againText || UI.bastan, 1, () => { state = fresh(); render(true); }, "c-again");
      addBtn(UI.KapagaDon, null, () => { state = Object.assign(fresh(), { sec: "cover" }); render(); }, "c-cover");
    }
  } else {
    sec.choices.forEach((c, i) => {
      if (c.if && !c.if(state)) return;
      const n = choiceNum(state.sec, c, i);
      addBtn(c.t, n, () => go(c, n), "c-" + i);
    });
  }
}

function go(choice, shownNum) {
  const oldRight = $("leaf-r") ? $("leaf-r").innerHTML : null;
  const oldLeft = $("leaf-l") ? $("leaf-l").innerHTML : null;
  const oldBook = $("book") ? $("book").innerHTML : null;
  state.steps = (state.steps || 0) + 1;
  if (choice.fx) choice.fx(state);
  state.sec = typeof choice.to === "function" ? choice.to(state) : choice.to;
  state.num = shownNum || null;
  const next = S[state.sec];
  if (next.enter) next.enter(state);
  render(true);
  flipFrom(oldRight, oldBook, oldLeft);
  if (next.end && window.ATM) ATM.flash = 1;
}

function flipFrom(oldRight, oldBook, oldLeft) {
  const book = $("book");
  if (!book || !oldRight || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const twoPage = getComputedStyle(book).gridTemplateColumns.split(" ").length > 1;
  if (twoPage) {
    const newLeft = $("leaf-l");
    const fl = document.createElement("div");
    fl.className = "flip";
    fl.innerHTML = `<div class="face front leaf right">${oldRight}</div><div class="face back leaf left">${newLeft.innerHTML}</div>`;
    // çevrilen sayfa üstünü örtene kadar altta eski sol sayfa görünür, gerçek kitaptaki gibi
    const newLeftHTML = newLeft.innerHTML;
    if (oldLeft) newLeft.innerHTML = oldLeft; else newLeft.classList.add("hide-under");
    book.appendChild(fl);
    setTimeout(() => { newLeft.innerHTML = newLeftHTML; newLeft.classList.remove("hide-under"); fl.remove(); }, 860);
  } else {
    const lf = document.createElement("div");
    lf.className = "lift book";
    lf.innerHTML = oldBook;
    lf.style.display = "block";
    book.appendChild(lf);
    setTimeout(() => lf.remove(), 620);
  }
}

function render(turn) {
  if (window.sozlukKapat) sozlukKapat();
  const onCover = state.sec === "cover";
  ["btn-book", "btn-cover"].forEach((id) => { $(id).style.visibility = onCover ? "hidden" : "visible"; });
  if (window.ATM) ATM.target = onCover ? (BOOK.coverAtmos ?? 0.6) : BOOK.atmos(S[state.sec]);
  if (window.ATM && !onCover && BOOK.hour) ATM.hour = BOOK.hour(S[state.sec], val(S[state.sec].time));
  if (onCover) renderCover(); else renderPage(turn);
  renderDrawer();
  $("main").scrollTop = 0;
}

function renderDrawer() {
  const items = $("items"); items.innerHTML = "";
  BOOK.items(state).forEach((x) => { const li = document.createElement("li"); li.textContent = x; items.appendChild(li); });

  const notes = $("notes"); notes.innerHTML = "";
  if (!state.notes.length) { const li = document.createElement("li"); li.className = "empty"; li.textContent = UI.bosDefter; notes.appendChild(li); }
  state.notes.forEach((n) => { const li = document.createElement("li"); li.textContent = n; notes.appendChild(li); });
  $("note-count").textContent = state.notes.length ? "(" + state.notes.length + ")" : "";

  const ends = $("endings"); ends.innerHTML = "";
  const found = loadEndings();
  ENDINGS.forEach((e) => {
    const li = document.createElement("li");
    li.textContent = found.includes(e.id) ? e.title : "· · ·";
    if (!found.includes(e.id)) li.className = "empty";
    ends.appendChild(li);
  });
}

if (META.kutuphane) { const l = $("lnk-lib"); l.href = META.kutuphane; l.hidden = false; }
$("btn-book").addEventListener("click", () => $("drawer").classList.add("open"));
$("btn-close").addEventListener("click", () => $("drawer").classList.remove("open"));
$("btn-cover").addEventListener("click", () => { $("confirm").classList.add("show"); $("btn-cover").style.display = "none"; });
const closeConfirm = () => { $("confirm").classList.remove("show"); $("btn-cover").style.display = ""; };
$("btn-no").addEventListener("click", closeConfirm);
$("btn-yes").addEventListener("click", () => { closeConfirm(); state = Object.assign(fresh(), { sec: "cover" }); render(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("drawer").classList.remove("open"); });


/* ---------- Sözlük: bir kelimeye dokununca kitaptaki anlamı (books/<id>/sozluk.js varsa) ---------- */
if (typeof SOZLUK !== "undefined") (function () {
  const st = document.createElement("style");
  st.textContent = `
  #sozluk { position: fixed; z-index: 60; max-width: 300px; padding: 10px 14px 11px; border-radius: 8px; background: #fbf6ea; color: #2a2118;
    box-shadow: 0 10px 30px rgba(0,0,0,.35), 0 0 0 1px rgba(120,90,50,.35); font-family: "EB Garamond", Georgia, serif; font-size: 18px; line-height: 1.35;
    opacity: 0; transform: translateY(4px); transition: opacity .15s, transform .15s; pointer-events: none; }
  #sozluk.acik { opacity: 1; transform: none; pointer-events: auto; }
  #sozluk b { font-weight: 600; } #sozluk .an { display: block; margin-top: 2px; }
  #sozluk .kal { display: block; margin-top: 7px; padding-top: 6px; border-top: 1px solid rgba(120,90,50,.25); font-size: 15px; }
  #sozluk .dil { display: block; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: #8a6a3a; margin-bottom: 3px; }
  #sozluk-isaret { position: fixed; z-index: 59; border-radius: 3px; background: rgba(233,179,79,.35); pointer-events: none; display: none; }
  .text p, .quote, .cover-wrap p { -webkit-tap-highlight-color: transparent; }
  .sozluk-ipucu { font-style: italic; font-size: 15px; opacity: .8; margin: 10px 0 4px; }`;
  document.head.appendChild(st);
  const balon = document.createElement("div"); balon.id = "sozluk"; balon.setAttribute("role", "status"); document.body.appendChild(balon);
  const isaret = document.createElement("div"); isaret.id = "sozluk-isaret"; document.body.appendChild(isaret);
  const HARF = /[\p{L}'’]/u;
  const temiz = (w) => w.toLocaleLowerCase("en").replace(/̇/g, "").replace(/’/g, "'").replace(/^'+|'+$/g, "");
  const kok = (w) => (w.length > 4 ? w.replace(/(ing|ed|s)$/, "") : w);
  const KAL = {}; Object.keys(SOZLUK.kaliplar || {}).forEach((k) => { KAL[k.split(" ").map(kok).join(" ")] = k; });
  function anlam(w) { const t = temiz(w); return SOZLUK.kelimeler[t] || (t.endsWith("'s") && SOZLUK.kelimeler[t.slice(0, -2)]) || null; }
  function kalip(metin, bas, son) {
    // dokunulan kelimeyi içeren 2-3 kelimelik kalıp var mı
    const ws = []; const re = /[\p{L}'’]+/gu; let m;
    while ((m = re.exec(metin))) ws.push({ w: kok(temiz(m[0])), a: m.index, b: m.index + m[0].length });
    const i = ws.findIndex((x) => x.a === bas); if (i < 0) return null;
    for (const n of [3, 2]) for (let j = i - n + 1; j <= i; j++) {
      if (j < 0 || j + n > ws.length) continue;
      const k = KAL[ws.slice(j, j + n).map((x) => x.w).join(" ")]; if (k) return k;
    }
    return null;
  }
  function noktadan(x, y) {
    if (document.caretPositionFromPoint) { const p = document.caretPositionFromPoint(x, y); return p && { node: p.offsetNode, off: p.offset }; }
    if (document.caretRangeFromPoint) { const r = document.caretRangeFromPoint(x, y); return r && { node: r.startContainer, off: r.startOffset }; }
    return null;
  }
  window.sozlukKapat = () => { balon.classList.remove("acik"); isaret.style.display = "none"; };
  document.addEventListener("click", (e) => {
    const hedef = e.target.closest && e.target.closest(".text p, .quote, .cover-wrap p");
    if (!hedef || e.target.closest("a, button") || String(window.getSelection())) { sozlukKapat(); return; }
    const c = noktadan(e.clientX, e.clientY);
    if (!c || c.node.nodeType !== 3) { sozlukKapat(); return; }
    const t = c.node.textContent; let a = c.off, b = c.off;
    while (a > 0 && HARF.test(t[a - 1])) a--;
    while (b < t.length && HARF.test(t[b])) b++;
    const kelime = t.slice(a, b).replace(/^['’]+|['’]+$/g, "");
    if (!kelime) { sozlukKapat(); return; }
    const an = anlam(kelime); const kl = kalip(t, a, b);
    if (!an && !kl) { sozlukKapat(); return; }
    const r = document.createRange(); r.setStart(c.node, a); r.setEnd(c.node, b);
    const k = r.getBoundingClientRect();
    if (k.width === 0 || e.clientX < k.left - 4 || e.clientX > k.right + 4) { sozlukKapat(); return; }
    balon.innerHTML = `<span class="dil" lang="tr">${esc(SOZLUK.baslik || "")}</span><b>${esc(kelime)}</b>` + (an ? `<span class="an" lang="tr">${esc(an)}</span>` : "") +
      (kl ? `<span class="kal"><b>${esc(kl)}</b> → ${esc(SOZLUK.kaliplar[kl])}</span>` : "");
    isaret.style.cssText = `display:block;left:${k.left - 2}px;top:${k.top - 1}px;width:${k.width + 4}px;height:${k.height + 2}px`;
    balon.classList.add("acik");
    const bw = balon.offsetWidth, bh = balon.offsetHeight;
    let x = Math.min(Math.max(8, k.left + k.width / 2 - bw / 2), window.innerWidth - bw - 8);
    let y = k.top - bh - 10; if (y < 8) y = k.bottom + 10;
    balon.style.left = x + "px"; balon.style.top = y + "px";
    e.stopPropagation();
  });
  ["scroll", "resize"].forEach((ev) => window.addEventListener(ev, () => sozlukKapat(), true));
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") sozlukKapat(); });
})();

/* ---------------- Orman sahnesi: saate göre gökyüzü, ağaç katmanları, sis, yağmur, ateş böcekleri ---------------- */
const jungle = { level: 0.2, target: 0.2, flash: 0, hour: 6.5, h: 6.5 };
window.ATM = jungle;
(function scene() {
  const cv = $("sea"), ctx = cv.getContext("2d");
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W, H, dpr, layers = [], drops = [], flies = [];
  let seed = 7;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  const lerp = (a, b, t) => a + (b - a) * t;
  const mix = (c1, c2, t) => c1.map((v, i) => Math.round(lerp(v, c2[i], t)));
  const rgb = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

  // gökyüzü renkleri: [üst, alt] saat noktalarına göre
  const SKY = [
    [0, [6, 10, 9], [14, 24, 18]], [5, [10, 16, 16], [40, 46, 40]], [6.3, [52, 70, 72], [214, 150, 96]],
    [8, [96, 132, 118], [178, 196, 164]], [12, [110, 150, 132], [196, 210, 180]], [16.5, [92, 122, 108], [190, 180, 140]],
    [18.2, [60, 52, 62], [210, 122, 70]], [19.3, [16, 20, 22], [40, 34, 30]], [24, [6, 10, 9], [14, 24, 18]]
  ];
  function skyAt(h) {
    for (let i = 0; i < SKY.length - 1; i++) {
      const [a, t1, b1] = SKY[i], [b, t2, b2] = SKY[i + 1];
      if (h >= a && h <= b) { const t = (h - a) / (b - a); return [mix(t1, t2, t), mix(b1, b2, t)]; }
    }
    return [SKY[0][1], SKY[0][2]];
  }
  const nightness = (h) => (h < 5 || h > 19.5) ? 1 : (h < 6.5 ? 1 - (h - 5) / 1.5 : (h > 18 ? (h - 18) / 1.5 : 0));

  function makeLayer(depth) {
    const c = document.createElement("canvas"); c.width = W * dpr; c.height = H * dpr;
    const g = c.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const base = H * (0.42 + depth * 0.16), shade = Math.round(20 + depth * 10);
    g.fillStyle = `rgb(${shade - 8},${shade + 14},${shade})`;
    // gövdeler
    for (let x = -40; x < W + 40; x += 30 + rnd() * 90) {
      const w = 3 + depth * 5 + rnd() * 4; g.fillRect(x, base - 40 * depth, w, H);
    }
    // taç yaprakları: üst üste daireler
    for (let x = -60; x < W + 60; x += 18 + rnd() * 26) {
      const y = base - rnd() * (60 + depth * 40), r = 24 + rnd() * (40 + depth * 30);
      g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
    }
    g.fillRect(0, base, W, H);
    // ön katmanda büyük yapraklar
    if (depth > 1.5) {
      for (let i = 0; i < 26; i++) {
        const x = rnd() * W, y = H * (0.7 + rnd() * 0.3), l = 60 + rnd() * 110, a = -1.2 + rnd() * 2.4;
        g.save(); g.translate(x, y); g.rotate(a); g.beginPath(); g.ellipse(0, -l / 2, l * 0.22, l / 2, 0, 0, Math.PI * 2); g.fill(); g.restore();
      }
    }
    return c;
  }
  function size() {
    dpr = Math.min(2, window.devicePixelRatio || 1); W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    seed = 7; layers = [0, 1, 2].map(makeLayer);
    drops = Array.from({ length: 320 }, () => ({ x: Math.random() * W, y: Math.random() * H, l: 10 + Math.random() * 16, v: 10 + Math.random() * 8 }));
    flies = Array.from({ length: 40 }, () => ({ x: Math.random() * W, y: H * (0.45 + Math.random() * 0.5), p: Math.random() * 6.28, s: 0.3 + Math.random() * 0.6 }));
  }
  window.addEventListener("resize", size); size();

  function frame(t) {
    const time = t / 1000;
    jungle.level += (jungle.target - jungle.level) * 0.02;
    jungle.h += (jungle.hour - jungle.h) * 0.02;
    const h = jungle.h, L = jungle.level, n = nightness(h);
    const [top, bot] = skyAt(h);
    const sky = ctx.createLinearGradient(0, 0, 0, H * 0.75);
    sky.addColorStop(0, rgb(top)); sky.addColorStop(1, rgb(bot));
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

    // güneş ya da ay pusu
    const sunX = W * (0.15 + 0.7 * Math.min(1, Math.max(0, (h - 6) / 12))), sunY = H * (0.55 - 0.35 * Math.sin(Math.PI * Math.min(1, Math.max(0, (h - 6) / 12))));
    const glow = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, 260);
    glow.addColorStop(0, n > 0.5 ? "rgba(200,215,220,0.10)" : "rgba(255,226,160,0.35)"); glow.addColorStop(1, "rgba(255,226,160,0)");
    ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);

    // ağaç katmanları: geceye göre karart, sis aralarında
    layers.forEach((lc, i) => {
      const drift = reduce ? 0 : Math.sin(time * 0.05 + i) * (2 + i * 2);
      ctx.globalAlpha = 1; ctx.drawImage(lc, drift, 0, W, H);
      ctx.fillStyle = `rgba(0,0,0,${0.15 + n * 0.55 + i * 0.05})`;
      ctx.globalCompositeOperation = "source-atop"; ctx.globalCompositeOperation = "source-over";
      // sis bandı
      const my = H * (0.5 + i * 0.12) + Math.sin(time * 0.1 + i) * 8;
      const mist = ctx.createLinearGradient(0, my - 60, 0, my + 60);
      const ma = (0.10 + (h > 4.5 && h < 9 ? 0.18 : 0.04)) * (1 - n * 0.6);
      mist.addColorStop(0, "rgba(220,230,220,0)"); mist.addColorStop(0.5, `rgba(220,230,220,${ma})`); mist.addColorStop(1, "rgba(220,230,220,0)");
      ctx.fillStyle = mist; ctx.fillRect(0, my - 60, W, 120);
    });
    ctx.fillStyle = `rgba(4,8,6,${0.25 + n * 0.45})`; ctx.fillRect(0, 0, W, H);

    // ateş böcekleri (gece)
    if (n > 0.2) {
      flies.forEach((f) => {
        const x = f.x + Math.sin(time * f.s + f.p) * 30, y = f.y + Math.cos(time * f.s * 0.8 + f.p) * 18;
        const a = n * (0.4 + 0.6 * Math.max(0, Math.sin(time * 2 * f.s + f.p)));
        const g = ctx.createRadialGradient(x, y, 0, x, y, 9); g.addColorStop(0, `rgba(220,255,140,${a})`); g.addColorStop(1, "rgba(220,255,140,0)");
        ctx.fillStyle = g; ctx.fillRect(x - 9, y - 9, 18, 18);
      });
    }

    // şimşek ve yağmur
    if (!reduce && L > 0.5 && Math.random() < 0.002 * L) jungle.flash = 0.7;
    if (jungle.flash > 0) { ctx.fillStyle = `rgba(220,235,230,${jungle.flash * 0.3})`; ctx.fillRect(0, 0, W, H); jungle.flash *= 0.86; if (jungle.flash < 0.02) jungle.flash = 0; }
    const cnt = Math.floor(drops.length * L);
    if (cnt > 0) {
      ctx.strokeStyle = `rgba(190,215,205,${0.1 + 0.25 * L})`; ctx.lineWidth = 1; ctx.beginPath();
      for (let i = 0; i < cnt; i++) {
        const d = drops[i]; ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - 2, d.y + d.l);
        if (!reduce) { d.y += d.v; d.x -= 0.6; if (d.y > H) { d.y = -20; d.x = Math.random() * (W + 50); } }
      }
      ctx.stroke();
    }
    if (!reduce) requestAnimationFrame(frame);
  }
  if (reduce) { frame(0); window.addEventListener("resize", () => frame(0)); }
  else requestAnimationFrame(frame);
})();

/* ---------------- Başlat ---------------- */
function start(data) {
  if (data && data.sec && (data.sec === "cover" || S[data.sec])) state = Object.assign(fresh(), data);
  else if (location.hash === "#oku") state = fresh();
  render();
}
window.claude?.hot?.snapshot?.(() => state);
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
