<style>
/* Tek tema bilerek: karanlık bir oda, masada açık bir kitap, arkada fırtınalı pencere.
   Düzen: masaüstünde iki sayfalı açık kitap (solda levha ve bekçinin kaydı, sağda metin), telefonda tek sayfa. */
:root {
  --night: #0c1012;        /* oda, kitabın dışı */
  --paper: #efe6d1;        /* sayfa */
  --paper-edge: #e2d6bb;   /* sayfa kenarı, cilt gölgesi */
  --ink: #2b241d;          /* metin mürekkebi */
  --faded: #75685a;        /* soluk mürekkep, ikincil metin */
  --rubric: #8d3a26;       /* kırmızı mürekkep: § numaraları, başharfler, süslemeler */
  --lamp: #e9b34f;         /* fener ışığı, kapak vurgusu */
  --display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --body: "EB Garamond", "Iowan Old Style", Georgia, serif;
  --hand: "Caveat", "Segoe Print", "Bradley Hand", cursive;
  --cloth: #3b2520;        /* cilt kumaşı */
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--night); color: var(--ink); font-family: var(--body); overflow: hidden; }
canvas#sea { position: fixed; inset: 0; width: 100%; height: 100%; display: block; opacity: 0.42; }
.vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, rgba(12,16,18,0) 30%, rgba(12,16,18,0.85) 100%); }

/* üst şerit */
.top {
  background: linear-gradient(var(--night) 55%, rgba(12,16,18,0));
  position: fixed; top: 0; left: 0; right: 0; z-index: 4;
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding: 12px clamp(16px, 3vw, 36px);
  font-family: var(--display); color: #cfc4ad;
}
.top .series { font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; }
.top .series b { color: var(--lamp); font-weight: 600; }
.top nav { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.link {
  font-family: var(--display); font-size: 17px; font-weight: 600; letter-spacing: 0.06em;
  background: none; border: 0; color: #cfc4ad; cursor: pointer; padding: 6px 10px; border-radius: 2px;
}
.link:hover { color: var(--lamp); }
a.link { text-decoration: none; }
.link:focus-visible, .choice:focus-visible, .btn:focus-visible { outline: 2px solid var(--lamp); outline-offset: 3px; }
.confirm { display: none; gap: 4px; align-items: center; font-style: italic; color: #cfc4ad; font-size: 16px; }
.confirm.show { display: inline-flex; }

main { position: relative; z-index: 2; height: 100%; overflow-y: auto; padding: 64px clamp(10px, 3vw, 40px) 40px; }

/* ---------- açık kitap ---------- */
.book {
  max-width: 1120px; margin: 0 auto;
  display: grid; grid-template-columns: 1fr 1fr;
  background: var(--paper);
  border-radius: 3px 6px 6px 3px;
  box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(0,0,0,0.25), 0 6px 0 -2px #d9ccad, 0 10px 0 -4px #cdbf9e;
  position: relative;
}
.book::before { /* cilt */
  content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 70px; transform: translateX(-50%); pointer-events: none;
  background: linear-gradient(90deg, rgba(0,0,0,0) 0%, rgba(80,60,30,0.10) 38%, rgba(40,28,10,0.28) 50%, rgba(80,60,30,0.10) 62%, rgba(0,0,0,0) 100%);
}
.leaf {
  position: relative; padding: 46px clamp(26px, 4vw, 58px) 54px;
  background-image:
    radial-gradient(rgba(120,95,55,0.07) 1px, transparent 1px),
    radial-gradient(rgba(120,95,55,0.05) 1px, transparent 1px);
  background-size: 7px 7px, 11px 11px; background-position: 0 0, 3px 5px;
  min-height: min(760px, calc(100vh - 110px));
}
.leaf.left { border-right: 1px solid rgba(120,95,55,0.15); }
.folio { position: absolute; bottom: 20px; left: 0; right: 0; text-align: center; font-family: var(--display); font-size: 15px; color: var(--faded); letter-spacing: 0.1em; }

/* sol sayfa: levha + kayıt */
.plate { display: flex; flex-direction: column; gap: 22px; }
.act-title { text-align: center; font-family: var(--display); text-transform: uppercase; letter-spacing: 0.22em; font-size: 13.6px; color: var(--rubric); }
.act-title span { display: block; font-size: 30px; letter-spacing: 0.06em; color: var(--ink); font-variant: normal; text-transform: none; font-weight: 600; margin-top: 2px; }
.ill { margin: 0; padding: 10px; background: #f6efdf; border: 1px solid rgba(80,60,30,0.25); box-shadow: inset 0 0 0 4px var(--paper), inset 0 0 0 5px rgba(80,60,30,0.25); }
.ill img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; filter: sepia(0.18) contrast(1.02); }
.ill figcaption { text-align: center; font-style: italic; font-size: 16px; color: var(--faded); margin-top: 8px; }
.log { border-top: 1px solid rgba(80,60,30,0.3); border-bottom: 1px solid rgba(80,60,30,0.3); padding: 14px 4px; display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; gap: 6px; }
.log div { font-size: 11.2px; color: var(--faded); text-transform: uppercase; letter-spacing: 0.12em; }
.log b { display: block; font-family: var(--display); font-size: 30px; color: var(--ink); font-weight: 600; letter-spacing: 0.02em; font-variant-numeric: lining-nums tabular-nums; text-transform: none; }
.margin-note { font-style: italic; font-size: 18px; line-height: 1.55; color: var(--faded); text-align: center; padding: 0 10px; text-wrap: balance; }
.fleuron { text-align: center; color: var(--rubric); font-size: 22px; letter-spacing: 0.6em; }

/* sağ sayfa: metin */
.sect { text-align: center; font-family: var(--display); color: var(--rubric); font-size: 22px; font-weight: 600; letter-spacing: 0.08em; }
.sect::before, .sect::after { content: "❧"; font-size: 16px; margin: 0 12px; position: relative; top: -2px; opacity: 0.8; }
.sect::before { display: inline-block; transform: scaleX(-1); }
.leaf h2 { font-family: var(--display); font-weight: 600; font-size: 24px; text-align: center; margin: 6px 0 4px; text-transform: uppercase; letter-spacing: 0.08em; text-wrap: balance; }
.kind { text-align: center; font-style: italic; color: var(--rubric); font-size: 17px; margin-bottom: 4px; }
.text { margin-top: 22px; }
.text p { font-size: 20px; line-height: 1.58; margin: 0 0 12px; text-align: justify; hyphens: auto; -webkit-hyphens: auto; text-indent: 1.4em; }
.text p.lead, .text p.first { text-indent: 0; }
.text p.lead::first-letter { float: left; font-family: var(--display); font-weight: 600; color: var(--rubric); font-size: 76px; line-height: 0.82; padding: 6px 8px 0 0; }
.text p.quote { font-style: italic; text-indent: 0; margin: 4px 1.6em 14px; text-align: left; color: #3d342b; }
.sub { font-family: var(--display); text-transform: uppercase; letter-spacing: 0.2em; color: var(--rubric); font-size: 13.6px; text-align: center; margin: 26px 0 10px; }
.fates { list-style: none; padding: 0; margin: 0; }
.fates li { font-size: 18px; line-height: 1.5; padding: 7px 0; border-bottom: 1px dotted rgba(80,60,30,0.35); }
.fates b { text-transform: uppercase; letter-spacing: 0.06em; font-size: 15.2px; margin-right: 6px; }
.the-end { text-align: center; font-family: var(--display); font-size: 40px; letter-spacing: 0.4em; color: var(--ink); margin: 30px 0 4px; padding-left: 0.4em; }
.missed { list-style: none; padding: 0; margin: 0; }
.missed li { font-style: italic; color: var(--faded); font-size: 17px; text-align: center; padding: 3px 0; }
.tally { text-align: center; font-style: italic; color: var(--faded); font-size: 16px; margin-top: 14px; }

/* seçenekler: oyun kitabı yönergesi */
.choices { margin-top: 26px; border-top: 1px solid rgba(80,60,30,0.3); padding-top: 14px; display: flex; flex-direction: column; }
.choice {
  display: flex; align-items: baseline; gap: 10px; width: 100%; text-align: left; cursor: pointer;
  background: none; border: 0; border-bottom: 1px dotted rgba(80,60,30,0.3); padding: 11px 4px;
  font-family: var(--body); font-size: 19px; line-height: 1.4; color: var(--ink);
}
.choice .ct { flex: 1; font-style: italic; }
.choice .cn { font-family: var(--display); font-weight: 600; font-size: 20px; color: var(--rubric); white-space: nowrap; font-variant-numeric: lining-nums; }
.choice:hover .ct { text-decoration: underline; text-decoration-color: var(--rubric); text-underline-offset: 4px; }
.choice:hover { background: rgba(141,58,38,0.05); }

/* sayfa çevirme */
@keyframes ink { from { opacity: 0.1; transform: translateX(10px); } to { opacity: 1; transform: none; } }

/* ---------- kapak ---------- */
.cover-wrap { max-width: 1040px; margin: 0 auto; display: grid; grid-template-columns: minmax(280px, 430px) 1fr; gap: clamp(24px, 4vw, 56px); align-items: center; min-height: calc(100vh - 120px); }
.cover {
  container-type: inline-size;
  position: relative; aspect-ratio: 2 / 3; border-radius: 3px 8px 8px 3px; overflow: hidden;
  background: #101619 center / cover no-repeat;
  box-shadow: 0 30px 70px rgba(0,0,0,0.7), inset 6px 0 0 rgba(0,0,0,0.25), inset 9px 0 0 rgba(255,255,255,0.05);
  color: #f1e7cf; display: flex; flex-direction: column; justify-content: space-between; padding: 30px 26px 26px 34px;
}
.cover::before { content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(6,10,12,0.78) 0%, rgba(6,10,12,0.05) 38%, rgba(6,10,12,0.05) 62%, rgba(6,10,12,0.85) 100%); }
.cover > * { position: relative; }
.cover .band { font-family: var(--display); text-transform: uppercase; letter-spacing: 0.18em; font-size: clamp(9px, 2.7cqi, 12.5px); white-space: nowrap; text-align: center; color: var(--lamp); border-top: 1px solid rgba(233,179,79,0.5); border-bottom: 1px solid rgba(233,179,79,0.5); padding: 6px 0; }
.cover h1 { font-family: var(--display); font-weight: 600; font-size: clamp(44px, 19cqi, 88px); letter-spacing: 0.16em; text-align: center; margin: 18px 0 0; padding-left: 0.16em; line-height: 1; text-shadow: 0 2px 24px rgba(0,0,0,0.6); }
.cover .subt { text-align: center; font-style: italic; font-size: clamp(15px, 4.6cqi, 20px); margin-bottom: 10px; color: #e4d8bd; }
.cover .author { text-align: center; font-family: var(--display); font-size: clamp(14px, 4.8cqi, 20px); letter-spacing: 0.26em; text-transform: uppercase; padding-left: 0.26em; white-space: nowrap; }
.backcover { color: #e6dcc4; }
.backcover .slogan { font-family: var(--display); font-size: clamp(28px, 3.2vw, 38px); line-height: 1.2; font-weight: 600; color: #f3e9d2; margin: 0 0 18px; text-wrap: balance; }
.backcover p { font-size: 19px; line-height: 1.6; margin: 0 0 12px; max-width: 58ch; color: #d6cbb2; }
.colophon { display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; margin: 22px 0; padding: 14px 0; border-top: 1px solid rgba(214,203,178,0.25); border-bottom: 1px solid rgba(214,203,178,0.25); font-size: 17px; }
.colophon dt { text-transform: uppercase; letter-spacing: 0.14em; color: #a99d86; }
.colophon dd { margin: 0; color: #efe5cd; }
.btn {
  font-family: var(--display); font-size: 22px; font-weight: 600; letter-spacing: 0.1em;
  background: var(--lamp); color: #1d1608; border: 0; padding: 12px 28px; border-radius: 2px; cursor: pointer;
  box-shadow: 0 8px 24px rgba(233,179,79,0.25);
}
.btn:hover { background: #f2c56a; }

/* ---------- defter ---------- */
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 6; width: min(400px, 92vw);
  background: var(--paper); color: var(--ink); box-shadow: -20px 0 50px rgba(0,0,0,0.5);
  transform: translateX(105%); transition: transform .35s ease; padding: 28px 28px 34px; overflow-y: auto;
}
.drawer.open { transform: none; }
.drawer::before { content: ""; position: absolute; top: 0; left: 28px; width: 14px; height: 70px; background: var(--rubric); clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 82%, 0 100%); }
.drawer h3 { font-family: var(--display); text-transform: uppercase; letter-spacing: 0.2em; color: var(--rubric); font-size: 14.4px; margin: 26px 0 8px; text-align: center; }
.drawer h3:first-of-type { margin-top: 54px; }
.drawer ul { list-style: none; padding: 0; margin: 0; }
.drawer li { font-size: 17px; line-height: 1.5; padding: 8px 0; border-bottom: 1px dotted rgba(80,60,30,0.35); }
.drawer .empty { color: var(--faded); font-style: italic; }
.drawer-close { position: absolute; top: 14px; right: 16px; color: var(--ink); }

.toast {
  position: fixed; left: 50%; top: 58px; z-index: 7; transform: translate(-50%, -10px);
  font-style: italic; font-size: 18px; color: var(--paper); background: rgba(43,36,29,0.94);
  padding: 9px 18px; border-radius: 2px; border-left: 3px solid var(--rubric);
  opacity: 0; transition: opacity .4s, transform .4s; pointer-events: none; max-width: 90vw; text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 860px) {
  .book { grid-template-columns: 1fr; }
  .book::before { display: none; }
  .leaf { min-height: 0; padding: 30px 22px 50px; }
  .leaf.left { border-right: 0; border-bottom: 1px solid rgba(120,95,55,0.2); padding-bottom: 24px; }
  .plate { position: static; gap: 14px; }
  .log b { font-size: 24px; }
  .text p { font-size: 18.5px; text-align: left; }
  .leaf.left .folio { display: none; }
  main { padding-top: 92px; }
  .top .series { font-size: 13px; }
  .cover-wrap { grid-template-columns: 1fr; justify-items: center; }
  .cover { width: min(360px, 86vw); }
  .backcover { text-align: left; }
}
@media (prefers-reduced-motion: reduce) {
  .turn .leaf.right > *, .turn .leaf.left .plate { animation: none; }
  .drawer, .toast { transition: none; }
}

/* ===== kitap havası: cilt, sayfa kalınlığı, kurdele, sayfa başlıkları ===== */
.binding {
  max-width: 1150px; margin: 6px auto 30px; position: relative;
  background: var(--cloth); border-radius: 6px; padding: 12px 14px 14px;
  background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.025) 0 2px, transparent 2px 4px), repeating-linear-gradient(-45deg, rgba(0,0,0,0.08) 0 2px, transparent 2px 4px);
  box-shadow: 0 34px 80px rgba(0,0,0,0.65), inset 0 0 0 1px rgba(255,255,255,0.06), inset 0 0 30px rgba(0,0,0,0.5);
}
.binding .book { box-shadow: 0 2px 6px rgba(0,0,0,0.35); border-radius: 2px; perspective: 2400px; }
.edges { position: absolute; top: 16px; bottom: 18px; z-index: 0; border-radius: 2px;
  background: repeating-linear-gradient(90deg, #efe6d1 0 1px, #cfc1a0 1px 2px); }
.edges.l { right: calc(100% - 14px); }
.edges.r { left: calc(100% - 14px); }
.ribbon { position: absolute; z-index: 3; top: -6px; left: calc(50% + 14px); width: 11px; height: calc(100% + 46px); pointer-events: none;
  background: linear-gradient(90deg, #6f2a1b, #9b4430 45%, #7a2f1f); clip-path: polygon(0 0, 100% 0, 100% 100%, 50% calc(100% - 12px), 0 100%);
  box-shadow: 2px 0 4px rgba(0,0,0,0.3); opacity: 0.95; }
.leaf { background-color: var(--paper); }
.leaf.left { background-image:
    linear-gradient(90deg, rgba(90,65,30,0.10) 0%, rgba(90,65,30,0) 7%, rgba(90,65,30,0) 84%, rgba(70,50,20,0.16) 100%),
    radial-gradient(rgba(120,95,55,0.07) 1px, transparent 1px), radial-gradient(rgba(120,95,55,0.05) 1px, transparent 1px); }
.leaf.right { background-image:
    linear-gradient(90deg, rgba(70,50,20,0.16) 0%, rgba(90,65,30,0) 16%, rgba(90,65,30,0) 93%, rgba(90,65,30,0.10) 100%),
    radial-gradient(rgba(120,95,55,0.07) 1px, transparent 1px), radial-gradient(rgba(120,95,55,0.05) 1px, transparent 1px); }
.leaf { background-size: auto, 7px 7px, 11px 11px; background-position: 0 0, 0 0, 3px 5px; }
.runhead { position: absolute; top: 20px; left: 0; right: 0; text-align: center; font-family: var(--display); text-transform: uppercase; letter-spacing: 0.26em; font-size: 11.2px; color: var(--faded); }
.folio { bottom: 20px; text-align: left; padding: 0 clamp(26px, 4vw, 58px); font-variant-numeric: oldstyle-nums; font-size: 16px; }
.leaf.right .folio { text-align: right; }

/* bekçinin defteri: el yazısı kayıt */
.ledger { background: #f6eedb; border: 1px solid rgba(80,60,30,0.25); padding: 12px 16px 14px; transform: rotate(-0.6deg);
  background-image: repeating-linear-gradient(transparent 0 29px, rgba(70,90,120,0.22) 29px 30px); box-shadow: 0 2px 6px rgba(60,40,10,0.12); }
.ledger .lh { font-family: var(--display); text-transform: uppercase; letter-spacing: 0.2em; font-size: 10.4px; color: var(--rubric); }
.ledger .lv { font-family: var(--hand); font-size: 25px; line-height: 30px; color: #263a5a; }
.margin-note.hand { font-family: var(--hand); font-style: normal; font-size: 24px; line-height: 1.25; color: #263a5a; transform: rotate(-1.2deg); }
.margin-note .lbl { display: block; font-family: var(--body); font-style: italic; font-size: 16px; color: var(--faded); margin-bottom: 6px; }

/* seçenekler: içindekiler gibi noktalı çizgi */
.choice { border-bottom: 0; padding: 9px 2px; gap: 8px; }
.choice .ct { flex: 0 1 auto; }
.choice .lead-dots { flex: 1 1 24px; border-bottom: 2px dotted rgba(80,60,30,0.45); transform: translateY(-5px); min-width: 24px; }
.choice .cn::before { content: "§ "; font-size: 15px; }
.choices { border-top: 0; }
.choices::before { content: "❦"; display: block; text-align: center; color: var(--rubric); font-size: 20px; margin-bottom: 6px; }

/* sayfa çevirme */
.flip { position: absolute; top: 0; bottom: 0; left: 50%; width: 50%; z-index: 5; transform-origin: left center; transform-style: preserve-3d; pointer-events: none; animation: flip .85s cubic-bezier(.45,.05,.3,1) forwards; }
.flip .face { position: absolute; inset: 0; overflow: hidden; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.flip .face.back { transform: rotateY(180deg); }
.flip .face::after { content: ""; position: absolute; inset: 0; pointer-events: none; animation: shade .85s ease forwards; }
@keyframes flip { from { transform: rotateY(0deg); } to { transform: rotateY(-180deg); } }
@keyframes shade { 0% { background: rgba(40,28,10,0); } 50% { background: rgba(40,28,10,0.28); } 100% { background: rgba(40,28,10,0); } }
.hide-under { visibility: hidden; }
.lift { position: absolute; inset: 0; z-index: 5; transform-origin: left center; pointer-events: none; animation: lift .6s ease-in forwards; background: var(--paper); overflow: hidden; }
@keyframes lift { 0% { transform: perspective(1400px) rotateY(0); opacity: 1; box-shadow: 0 0 0 rgba(0,0,0,0); } 75% { opacity: 1; box-shadow: 20px 0 40px rgba(0,0,0,0.35); } 100% { transform: perspective(1400px) rotateY(-100deg); opacity: 0; } }

@media (max-width: 860px) {
  .binding { padding: 8px 8px 10px; }
  .edges, .ribbon { display: none; }
  .ledger .lv { font-size: 22px; }
  .runhead { top: 12px; }
}
@media (prefers-reduced-motion: reduce) { .flip, .lift { display: none; } }

/* ===== karar kartları ===== */
.choices { margin-top: 30px; gap: 12px; }
.choices::before { content: none; }
.decide { display: flex; align-items: center; gap: 14px; margin-bottom: 4px; font-family: var(--display); text-transform: uppercase; letter-spacing: 0.2em; font-size: 13.6px; color: var(--rubric); }
.decide::before, .decide::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, rgba(141,58,38,0.5)); }
.decide::after { background: linear-gradient(90deg, rgba(141,58,38,0.5), transparent); }
.choice {
  display: grid; grid-template-columns: 52px 1fr auto; align-items: center; gap: 14px;
  padding: 12px 16px 12px 12px; border: 1px solid rgba(80,60,30,0.22); border-radius: 3px;
  background: #f7f0de; box-shadow: inset 0 0 0 3px #f7f0de, inset 0 0 0 4px rgba(80,60,30,0.12), 0 1px 2px rgba(60,40,10,0.08);
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}

  act1_end: {
    act: 1, time: "00:20", ruzgar: 0.85,
    actEnd: true, next: { t: "Go on to Act 2", to: "e1" },
    title: "Sandstorm",
    enter: (s) => {
      if (s.kacis === "sena") flag(s, "ORRIN_YANINDA");
      else if (s.kacis === "yalan" && has(s, "KURSUN")) flag(s, "ORRIN_SERBEST");
      else flag(s, "ORRIN_ESIR");

    },
    text: (s) => {
      const p = [];
      if (s.kacis === "yalan" && has(s, "KURSUN")) {
        p.push("\"There's nothing here but scrap,\" you say. Your voice doesn't shake, and that surprises you.");
        p.push("The Inquisitor looks at you for a long time. Then he walks slowly through the workshop, running his fingers along the shelves; he passes the lead box and doesn't stop. \"The storm is dying down,\" he says at the door. \"I'll be back at dawn. Until then, try to remember.\" He leaves.");
        p.push("The moment the door closes, Orrin opens the box and holds the cube out to you. \"Don't wait for dawn,\" he says. \"Go now. I'll stay here and lie again. They believe an old man.\" He hugs you; Orrin never hugs anyone.");
      } else if (s.kacis === "yalan") {
        p.push("\"There's nothing here but scrap,\" you say.");
        p.push("Without dropping his smile, the Inquisitor walks to the workbench. He raises his hand; the cube stirs on the bench, as if pulled by an invisible thread. At that moment Orrin hurls the heavy wrench in his hand at the lamp. Darkness. A shout. Orrin's voice: \"Take the cube and run!\"");
        p.push((has(s, "KURSUN") ? "You grab the lead box" : "You grab the cube") + " and dive out the back door into the storm. KT-4 clings to your shoulder, beeping like a scream. Behind you, inside the workshop, something topples, glass breaks. Then Orrin's voice cuts off.");
      } else if (s.kacis === "arka") {
        p.push((has(s, "KURSUN") ? "You grab the lead box" : "You grab the cube") + " and lunge for the back door. \"Stop,\" the Inquisitor says calmly; it isn't even an order. Orrin steps in front of the door and spreads his arms wide. \"Why not deal with an old scrap man for a bit, sir.\"");
        p.push("You plunge into the storm. KT-4 clings to your shoulder, its eye dimmed. You look back once: in the workshop doorway, behind a curtain of sand, two stormtroopers are dragging Orrin out by the arms.");
      } else {
        p.push("You whisper into the radio: \"Channel four. Sena. Orrin's workshop. Now.\" Then you turn to the Inquisitor and start talking: the pod, the scrapyard, the weather, whatever comes. Orrin understands and starts talking too; the two of you, one old, one young, launch into a ridiculous haggle over scrap.");
        p.push("Just as the Inquisitor's patience is running out, the back wall of the workshop shakes with the roar of an engine. Sena's sand speeder, headlights blazing, pulls up at the back door. \"Get on!\" You pull Orrin by the arm and jump onto the speeder. " + (has(s, "KURSUN") ? "The lead box is under your arm." : "The cube is in your pocket.") + " The speeder dives into the storm; behind you a red light flares for a moment and vanishes in the curtain of sand.");
      }
      p.push("The sandstorm is everywhere now. No sky, no horizon; only wind and sand." + (s.kacis === "sena" ? "" : " ") + (s.kacis === "sena" ? "" : has(s, "KURSUN") && s.kacis !== "yalan" ? "The lead box is under your arm; the cube inside is silent, but you feel its weight." : "The cube beats in your pocket, its hum blending with the sound of the storm."));
      p.push(has(s, "ANLASMA") || has(s, "SENA_BILIYOR")
        ? "Sena's ship sits impounded at the garrison. The coil is still in Orrin's scrapyard. Tonight, the only way off Kessar goes through the garrison."
        : has(s, "ORRIN_SERBEST") ? "The Inquisitor will be back at dawn. The only way off Kessar is through the ships at the garrison, and there are only a few hours until dawn." : "The only way off Kessar is through the ships at the garrison. And there's no one left in town who doesn't know who you are.");
      return p;
    }
  },

        : "A woman in a worn pilot's jacket, alone, is working a lockpick on the hangar's service door. The patch on her shoulder has been torn off." + (s.tuneldenGir ? " When she hears the grate creak she spins around and raises her blaster; seeing the droid on your shoulder, she lowers it, comes silently to the grate and crouches beside it. \"Sena,\" she whispers. \"My ship's in there, impounded. Are you running too?\"" : " When she sees you her hand goes to the blaster at her belt, then she sees the sand on your face and the droid on your shoulder and lowers it. \"Sena,\" she says. \"My ship's in there, impounded. Are you running too?\"")));

      if (has(s, "ORRIN_ESIR")) p.push((s.tuneldenGir ? "At the far end of the yard" : "Inside the wall") + ", a low building has bars on its windows. The cell block. Orrin is in there." + (has(s, "YEMIN") ? " You squeeze the broken pipe in your pocket." : ""));

      "You defied the storm, and the storm won. There was shelter, and you didn't stop.",
      "The speeder coughs one last time on the slope of a dune and goes silent. Sena tries to clear the sand; it's no use. Orrin pulls the three of you to the lee side of the speeder; you sit back to back and pull your scarves over your faces. The sand settles over you slowly, like a blanket.",
      (kutu(s) ? "Inside the lead box, the cube" : "The cube in your pocket") + " warms one last time. Then only the wind."
    ] : [
      "You couldn't find your way in the storm. You didn't listen to KT-4, or KT-4 didn't know you well enough.",
      "You walked for an hour, maybe two. Then on the slope of a dune your knees gave way. KT-4 climbed down from your shoulder and began to circle in front of you, beeping, beeping. Its voice was lost in the wind.",
      (kutu(s) ? "Inside the lead box, the cube" : "The cube in your pocket") + " warmed one last time. The hum grew soft, almost like a lullaby. Then only the wind."
    ],
    sabah: (s) => "In the morning the storm dies down. Kessar's two suns rise at the same moment, as always. On the sand " + (s.kum === "motor" ? "there's nothing to see but the broken rear fin of a speeder." : "sits a small, rusty droid. Its single eye fixed on the sand, it waits."),
    akibet: (s) => [
      ["You", "They didn't find you. Not the Empire, not anyone."],
      ["The cube", "Under the sand. Maybe one day another storm will bring it back to the surface."],
      ...(s.kum === "motor" ? [["Sena", "She tried to save the speeder until the very end. Then she put her hand over yours."]] : []),
      ["Orrin", s.kum === "motor" ? "He was beside you. Until the end." : (has(s, "ORRIN_ESIR") ? "At the garrison, in a cell. He never forgot you." : "In his workshop, watching the door every evening.")],
      ["KT-4", s.kum === "motor" ? "With you." : "For weeks it waited on that dune. Then a scrap dealer found it and cleaned it up. Every evening, when the suns set, it still looks at the same spot in the desert."]
    ],
    yil: "In Varn the children tell a story: on stormy nights a blue light rises from the desert. Whoever looks at it hears a hum begin in their ear."
  },

  /* ================= ACT 3: THE HOLOCRON ================= */
  f1: {
    act: 3, konum: (s) => s.hedef === "mekik" ? "The Inquisitor's shuttle" : s.hedef === "kristal" ? "The temple under the garrison" : "Varn garrison", time: "04:12", ruzgar: 0.15,
    title: "Sirens",
    text: (s) => {
      const p = [];
      if (s.hedef === "mekik") return [
        "You can hear the sirens even through the shuttle's hull. The ramp closes, the engines fire. You hold your breath among the crates; shaking, the ship lifts off the ground.",
        "A radio exchange comes from the cockpit: \"The Brother is staying at the garrison. I'm taking the shuttle up to the ship in orbit.\" The pilot is alone. The Inquisitor stayed below.",
        "You lean toward a small porthole. The garrison shrinks below. A shadow is running in front of the hangar: maybe Sena. The searchlights are hunting for her.",
        "KT-4 doesn't move at all on your shoulder. Its single eye is fixed on the panel of the cockpit door."
      ];
      if (s.hedef === "gemi" && has(s, "GEMI_HAZIR")) {
        p.push("The Sand Sparrow's engines are humming. Sena jumps into the cockpit, touching the switches by heart. \"Two minutes!\" she shouts. \"If we lift off before the engines are warm, we'll crash at the end of the strip!\"");
        p.push("The hangar's big door shudders as if pounded from outside. Then the shuddering stops. Then heavy, steady blows begin to fall on the middle of the door. With each blow the metal bends a little further inward. Someone is forcing the door.");
      } else if (s.hedef === "gemi") {
        p.push("The Sand Sparrow can't lift off. Sena looks out the hangar's side window at the landing strip. On the strip, its ramp still open, stands the Inquisitor's shuttle.");
        p.push("\"That ship,\" she says. \"We'll go in that. I can fly anything.\" You ease the service door open. The yard is white with searchlight glare.");
      } else if (s.hedef === "orrin") {
        p.push("With Orrin's arm over your shoulder, you limp down the corridor. KT-4 has locked the door behind you; from the other side comes the sound of heavy boots.");
        p.push("\"Leave me,\" Orrin says, out of breath. \"I'll slow you down. If you have a ship, run.\"");
      } else {
        p.push((kutu(s) ? "The crystal is in your palm. The cube is in the lead box, but the crystal finds it anyway; the two pulse together like a heartbeat" : "The crystal is in your palm, the cube in your pocket. The two pulse together like a heartbeat") + "; the lines on the temple walls flash for an instant each time their light beats.");
        p.push("From the top of the stairs comes a sound: the grate being lifted. Then footsteps. Unhurried, measured footsteps.");
        p.push("Behind you, in the dark, is the mouth of the tunnel back to the Dry Well.");
      }
      return p;
    },
    choices: [
      { t: "Run to the ship, wait for Sena", to: "f3", if: (s) => s.hedef === "gemi" && has(s, "GEMI_HAZIR") },
      { t: "Cross the yard and run for the shuttle", to: "f3", if: (s) => s.hedef === "gemi" && !has(s, "GEMI_HAZIR") },
      { t: "Tell Sena «Go!»; open the cube, hold the door yourself", to: "e_bedel", if: (s) => s.hedef === "gemi", fx: (s) => { s.direkBedel = true; } },
      { t: "Carry Orrin on your back, run for the hangar", to: "f3", if: (s) => s.hedef === "orrin", fx: (s) => { rel(s, "orrin", 1, "Orrin will never forget that you carried him on your back."); } },
      { t: "Listen to him: run alone", to: "e_yalniz", if: (s) => s.hedef === "orrin", fx: (s) => { s.yalniz = "orrin"; } },
      { t: "Wait for him at the stairs", to: "f3", if: (s) => s.hedef === "kristal" },
      { t: "Escape back through the tunnel", to: "e_yalniz", if: (s) => s.hedef === "kristal", fx: (s) => { s.yalniz = "tunel"; } },
      { t: "Stay hidden; wherever it goes, it goes", to: "e_kacak", if: (s) => s.hedef === "mekik", fx: (s) => { s.kacak = "yalniz"; } },
      { t: "Signal KT-4: take the cockpit, turn back", to: "f3", if: (s) => s.hedef === "mekik", fx: (s) => { s.geriDondu = true; rel(s, "kt4", 1, "KT-4 did the bravest thing of its life."); } }
    ]
  },

  f3: {
    act: 3, konum: (s) => s.hedef === "kristal" ? "The temple under the garrison" : "Varn garrison", time: "04:20", ruzgar: 0.1, img: (s) => s.hedef === "kristal" ? null : "yuzlesme", imgLabel: "The Seventh Brother",
    title: "The Seventh Brother",
    text: (s) => {
      const p = [];
      const tapinak = s.hedef === "kristal";
      if (s.geriDondu) p.push("KT-4 opens the cockpit door's lock in two seconds; before the pilot can even turn around, it locks out the systems wired to his seat. The shuttle swings around in an arc and lands hard in the garrison's yard. Sena runs out of the hangar's shadow and leaps onto the ramp." + ((has(s, "ORRIN_YANINDA") || has(s, "ORRIN_KATILDI")) ? " Orrin follows, limping." : ""));
      else if (s.hedef === "gemi" && has(s, "GEMI_HAZIR")) p.push("The door splits in two and falls to the floor. The red light goes out.");
      else if (s.hedef === "gemi") p.push("When you reach the middle of the yard, the searchlights suddenly lock in place. All of them on the same spot: you.");
      else if (s.hedef === "orrin") p.push("Three steps from the hangar's service door, the door opens by itself.");
      p.push(tapinak
        ? "He stands on the bottom step of the stairs. Tall, gray-haired, black-coated. His eyes are closed. The crystal's blue light falls on his face, and he smiles as if he could feel it."
        : (s.geriDondu ? "He stands at the foot of the ramp. Tall, gray-haired, black-coated. His eyes are closed. No one saw when he arrived." : "He stands in front of you. Tall, gray-haired, black-coated. His eyes are closed. In his hand, a long, thin sword."));
      p.push({ q: "I came to Kessar for a holocron. I didn't know I would find a child. But I felt you, from the moment you opened the pod." });
      if (has(s, "ORRIN_ESIR") && !has(s, "ORRIN_KURTARILDI")) p.push({ q: "The old scrap dealer is in his cell. He asked about you. Do you wonder what I told him?" });
      if (has(s, "YEMIN")) p.push("The broken pipe in your pocket suddenly grows heavy. Something in your chest grows hot, something different from the cube's warmth. Something angry and dark.");
      if (has(s, "KRISTAL")) p.push({ q: "When Ilara Venn hid that crystal here, I was here too. I couldn't find it. You did. Do you see how special you are?" });
      p.push({ q: "The woman inside will teach you patience, waiting, losing. I will teach you to win. Give me your anger; let me turn it into a blade." });
      if (!tapinak && (s.hedef === "orrin" || has(s, "ORRIN_YANINDA") || has(s, "ORRIN_KATILDI"))) p.push("Orrin is beside you, his face white as chalk. He whispers: \"Don't listen to him, kid.\"");
      if (!tapinak && !s.geriDondu) p.push(has(s, "GEMI_HAZIR") ? "Behind you the Sand Sparrow's engines rise. Sena shouts from the cockpit: \"Ready!\"" : s.hedef === "orrin" ? "Sena's voice comes from inside the hangar: \"The shuttle on the strip! We run for it!\"" : "The shuttle is waiting on the strip. Sena is frozen beside you, her hand on her blaster.");
      return p;
    },
    choices: [
      { t: "Listen to your anger: attack him", to: "e_golge", if: (s) => has(s, "OFKE") || (has(s, "ORRIN_ESIR") && !has(s, "ORRIN_KURTARILDI")) },
      { t: "Take the hand he's holding out", to: "e_golge", if: (s) => !(has(s, "OFKE") || (has(s, "ORRIN_ESIR") && !has(s, "ORRIN_KURTARILDI"))) },
      { t: "Open the cube, call to the woman inside", to: "f4" },
      { t: "Look at Orrin: he has that heavy wrench in his hand", to: "f5", if: (s) => s.hedef !== "kristal" && (has(s, "ORRIN_YANINDA") || has(s, "ORRIN_KATILDI")) && (s.r.orrin || 0) >= 2, fx: (s) => { s.orrinPlan = true; } },
      { t: "Look at KT-4: it seems to have a plan", to: "f5", if: (s) => (s.r.kt4 || 0) >= 1 && s.hedef !== "kristal", fx: (s) => { s.kt4Plan = true; } }
    ]
  },

  f4: {
    act: 3, konum: (s) => s.hedef === "kristal" ? "The temple under the garrison" : "Varn garrison", time: "04:25", ruzgar: 0.1,
    title: "The Holocron",
    text: (s) => {
      const p = [];
      p.push(kutu(s) ? "You tear off the lid of the lead box and fling it away. The cube drops into your palm, as if of its own accord." : "You take the cube out of your pocket.");
      p.push("You close your eyes. This time no face comes; only the voice. Not at your ear, but inside you.");
      p.push({ q: "Don't be afraid. The anger and the fear are yours. But you are bigger than them. Let the light through." });
      p.push(has(s, "KRISTAL")
        ? "The cube opens. Thin blue lines peel away from its corners and reach for the crystal in your palm. The instant they join, the light bursts out like a wave. Where the Inquisitor's sword meets the wave, it cracks like glass. The man is thrown backward; his back slams into the wall. He opens his eyes. Yellow, astonished eyes."
        : "The cube opens. A blue light rises from its corners and stands between you like a wall. The Inquisitor draws his sword and strikes the light; with each blow the light shudders, but it doesn't break. Your arms are burning. You don't know how long you can hold it.");
      p.push(s.hedef === "kristal"
        ? "Stones rain from the temple ceiling. The stairs are clear. Up above, at the far end of the yard, Sena must be waiting at the hangar door."
        : "Soldiers are running from every corner of the garrison, but no one can get inside the light. Sena's voice comes from behind you: \"Come on! Now!\"");
      return p;
    },
    choices: [
      { t: "Hold the light; let them go", to: "e_bedel" },
      { t: "Let go of the light, run", to: "f5" }
    ]
  },

  f5: {
    act: 3, konum: "The skies of Kessar", time: "04:40", ruzgar: 0.05, img: "kalkis", imgLabel: "Liftoff",
    title: "Liftoff",
    text: (s) => {
      const p = [];
      const serce = has(s, "GEMI_HAZIR");
      if (s.orrinPlan) p.push("Orrin gives you a single wink. Then, with the wrist of a smuggler of forty years, he hurls the heavy wrench at the biggest searchlight in the yard. The glass explodes, sparks rain down, and half the yard is plunged into darkness. The Inquisitor raises his sword, but for an instant he's searching for his bearings; that instant is enough. You run through the dark to the ramp, Orrin's arm over your shoulder.");
      else if (s.kt4Plan) p.push("KT-4 launches off your shoulder and clamps onto the fire panel on the hangar wall. A second later every extinguisher in the ceiling bursts at once; the yard turns into a cloud of white foam. The Inquisitor's eyes are closed, but the soldiers' are not. You run blind through the cloud. At the last moment KT-4 leaps onto the ramp.");
      else if (s.hedef === "kristal") p.push("You take the stairs two at a time. You cross the yard like the wind; the soldiers are still staring at the light in the temple. Sena sees you in front of the hangar and starts running for the shuttle on the strip.");
      else p.push("You turn and run. The light holds behind you a little longer, then slowly fades.");
      p.push(serce
        ? "The Sand Sparrow shoots off the strip like an arrow. As her nose comes up the hull shudders; Sena clenches her teeth and pulls the stick all the way back."
        : "Sena takes off before the shuttle's ramp has even closed. \"This thing's controls are awful,\" she mutters, but her voice is laughing.");
      p.push("Two Imperial fighters lift off behind you. Laser fire streaks past the wings. KT-4 is plugged into a panel, shifting the targets on the screens one by one; you're at the targeting sight, firing where it points. One fighter hits the rocks; the other is swallowed by the last tail of the storm.");
      if (has(s, "ORRIN_YANINDA") || has(s, "ORRIN_KATILDI") || has(s, "ORRIN_KURTARILDI")) p.push("Orrin is in the back seat, one hand on his chest, his eyes on the window. Varn shrinks below. The town where he spent his whole life turns into a handful of lights. He says nothing.");
      p.push("And then the suns. Kessar's two suns rise above the horizon at the same moment; what's left of the storm's dust is painted gold. The ship punches through the atmosphere into the dark.");
      p.push("Sena turns in her seat and looks at you. \"So,\" she says. \"Where to now?\"" + ((s.r.sena || 0) >= 2 ? " She pauses. \"Wherever you say. You trusted me tonight; I trust you.\"" : ""));
      return p;
    },
    choices: [
      { t: "To Sena's friends: let the holocron go to the rebellion", to: "e_isyan" },
      { t: "Give it to no one: chart your own course", to: "e_kacak", fx: (s) => { s.kacak = "sena"; } }
    ]
  },

  e_isyan: {
    act: 3, konum: "Hyperspace", uzay: true, time: "05:10", ruzgar: 0.05,
    end: { id: "isyan", kind: (s) => has(s, "KRISTAL") ? "Best ending" : "Ending" },
    title: "Spark of Rebellion",
    text: (s) => [
      "Sena enters a course and the ship jumps into the stars. The stars stretch into long white lines.",
      "You take the holocron into your lap. It doesn't hum anymore; it seems to breathe, slow and calm." + (has(s, "KRISTAL") ? " The crystal is beside it, close enough for the two to touch." : ""),
      "\"Will the rebellion believe you?\" KT-4 asks, or that's what its beeping sounds like. You don't know. But for the first time, you feel you're not running away with a ship, or from something. You're going toward something."
    ],
    sabah: (s) => "Three days later, at a hidden base, a tired-faced woman takes the holocron in both hands. The cube glows once in her palm. Her eyes fill with tears: \"I knew Ilara Venn,\" she says." + (has(s, "TUNEL") ? "" : " So the woman in the cube had a name."),
    akibet: (s) => [
      ["You", has(s, "KRISTAL") ? "Within the rebellion, the first apprentice to walk the path Ilara left behind. One day the crystal will be the heart of a blade." : "The rebellion's youngest pilot candidate. At night you sit beside the holocron and wait for its voice."],
      ["Sena", "In the pilot's seat, whatever the ship. You always in the seat beside her."],
      ["Orrin", has(s, "ORRIN_YANINDA") || has(s, "ORRIN_KATILDI") || has(s, "ORRIN_KURTARILDI") ? "In the base's scrapyard. He gets broken ships flying in a week; nobody understands how he does it." : (has(s, "ORRIN_ESIR") ? "A year later the rebels raided the Varn garrison. The first man out of the cells; his first question: «Is the kid all right?»" : "In Varn, in his workshop. Every night he looks at the sky and guesses which of the shooting stars is you.")],
      ["KT-4", "The base's best-loved droid. Nobody believes it came out of an old scrap heap."]
    ],
    yil: "Years later a ship lands on Kessar, freed from the Empire. The first person down the ramp bends and takes a handful of sand. Warm."
  },

  e_kacak: {
    act: 3, konum: "The Outer Rim", uzay: true, time: "06:00", ruzgar: 0.05,
    end: { id: "kacak", kind: "Ending" },
    title: "The Smuggler's Road",
    text: (s) => s.kacak === "yalniz" ? [
      "As the shuttle docks with the giant ship in orbit, KT-4 opens the emergency hatch of the cargo hold. An escape pod. Just like the one that fell into the scrapyard.",
      "The pod drops you at a dusty trading station on the edge of the Outer Rim. No one asks who you are. It's that kind of place.",
      "You wrap the cube in a rag and put it at the bottom of your backpack. The one thing you learned from Orrin turns out to be useful: buying and selling scrap."
    ] : [
      "Sena is quiet for a while. Then she shrugs. \"One day the rebellion will want something from you too. Everyone does.\" She changes course.",
      "You haul cargo through the Outer Rim's ports, the ones that aren't on anyone's map. Sometimes legal, mostly not. The ship is small, the money is thin, life is wide open.",
      "The holocron is hidden in the cargo hold, under a fuel coil. Some nights it hums. You pretend not to hear it. Most nights."
    ],
    sabah: (s) => s.kacak === "yalniz" ? "From the station's window you can see the stars. None of them are Kessar's suns." : "One morning in a port, at a smugglers' table, someone mentions Kessar: one night a light was seen at the garrison. Sena looks at you. You look at your glass.",
    akibet: (s) => [
      ["You", s.kacak === "yalniz" ? "A scrap dealer on the Outer Rim. A good one. When news of the Inquisitors comes, you change stations." : "One of the youngest smugglers on the Outer Rim. The Empire doesn't know your name. Yet."],
      ["Sena", s.kacak === "yalniz" ? "You never saw her again. Sometimes in a port, when you see a brown pilot's jacket, your heart stops." : "Captain. You're the copilot. Not a day goes by that you don't argue, and not a day will come when you leave each other."],
      ["Orrin", has(s, "ORRIN_YANINDA") || has(s, "ORRIN_KATILDI") || has(s, "ORRIN_KURTARILDI") ? (s.kacak === "yalniz" ? "He stayed at the garrison. You never found out what happened to him." : "He knows the ship's engines better than you do. And he still calls you foolish kid.") : (has(s, "ORRIN_ESIR") ? "In the garrison's cell. The promise you made yourself to go back for him is still stuck in your throat." : "In Varn. Once a month you send him money, unsigned.")],
      ["The holocron", "Hidden. Silent. Waiting."]
    ],
    yil: "In some ports they tell a story: there was a smuggler who carried a stone cube in a bag. Never sold it to anyone, at any price."
  },

  e_bedel: {
    act: 3, konum: (s) => s.hedef === "kristal" ? "The temple under the garrison" : "Varn garrison", time: "04:30", ruzgar: 0.1,
    end: { id: "bedel", kind: "Ending" },
    title: "The Last Light",
    text: (s) => {
      const p = [];
      if (s.direkBedel) p.push((kutu(s) ? "You open the lead box and take the cube in your palm" : "You take the cube out of your pocket") + " and, without turning to Sena, shout \"Go!\" The cube opens; the blue light rising from it seals " + (has(s, "GEMI_HAZIR") ? "the gap in the buckling door" : "the service door") + " like a wall. On the other side, the Inquisitor raises his sword and begins to strike the light.");
      p.push("You hold the light. Your arms burn, then stop burning. The voice is still speaking inside you, but not in words anymore.");
      p.push(s.hedef === "kristal"
        ? "You take KT-4 from your shoulder and push it toward the stairs. \"Go. Find her.\" It hesitates for a moment, then runs. Soon, from above, from the far end of the yard, you hear a ship lift off. Sena. She couldn't wait for you; you wouldn't have wanted her to."
        : "Sena's voice comes from behind you, once, twice. Then you hear the ramp close and the engines rise." + (has(s, "ORRIN_YANINDA") || has(s, "ORRIN_KATILDI") || has(s, "ORRIN_KURTARILDI") ? " Orrin's last words blend with the roar of the engines; you can't make them out, but you know what he said." : "") + " A shrill beep from KT-4. It's on the ship too.");
      p.push("The Inquisitor is on the other side of the light. He has lowered his sword. He's looking at you; his eyes are open. On his face there's no anger, but something else. Envy, perhaps.");
      p.push("The light flares one last time. Then everything is white.");
      return p;
    },
    sabah: (s) => "When the soldiers return to " + (s.hedef === "kristal" ? "the temple" : "the yard") + ", they find no one there. No child, no cube. Only, on the stone, two small footprints, and a blue dust glittering in the sand.",
    akibet: (s) => [
      ["You", "No one knows. Like the voice of the woman in the cube, maybe somewhere, maybe everywhere."],
      ["Sena", "She got away. She never spoke the holocron's name, to anyone. But she renamed her ship; now it too bears the name of a light."],
      ["Orrin", has(s, "ORRIN_YANINDA") || has(s, "ORRIN_KATILDI") || has(s, "ORRIN_KURTARILDI") ? "He went with Sena. He never opened another pod." : (has(s, "ORRIN_ESIR") ? "That night, from the window of his cell, he saw a blue light. Whether he cried or laughed, even he doesn't know." : "In Varn. He never locks his workshop door anymore.")],
      ["The Seventh Brother", "He left Kessar empty-handed. He never closed his eyes again."]
    ],
    yil: "In Varn, on stormy nights, children run to the window. If you see a blue light in the sand, you get to make a wish. No one knows whose wish it grants."
  },

  e_golge: {
    act: 3, konum: (s) => s.hedef === "kristal" ? "The temple under the garrison" : "Varn garrison", time: "04:25", ruzgar: 0.1,
    end: { id: "golge", kind: "Dark ending" },
    title: "A Step into Shadow",
    text: (s) => {
      const p = [];
      const ofke = has(s, "OFKE") || (has(s, "ORRIN_ESIR") && !has(s, "ORRIN_KURTARILDI"));
      p.push(ofke
        ? "The anger rises like a wave and you don't stop it. You raise your hand; without touching him, the Inquisitor's weapon flies from his hand and hits the wall. You notice that he didn't move at all. He's smiling."
        : "You reach out your hand. His hands are cold. But what passes through you isn't cold; it's hot, angry, strong. For the first time you're not afraid of anything.");
      p.push(kutu(s) ? "Inside the lead box the cube is silent. As if it will never hum again." : "The cube in your pocket grows cold. The hum goes out like a candle.");
      p.push({ q: (has(s, "TUNEL") ? "There. What Ilara" : "There. What that woman") + " could never give you. Now come. I have much to teach you." });
      if (has(s, "SENA_YANINDA")) p.push("From somewhere comes Sena's voice, shouting your name. It sounds very far away. Like someone else's name.");
      return p;
    },
    sabah: "In the morning the Inquisitor's shuttle lifts off from Kessar. In the passenger compartment, wrapped in a black cloak, sits a young person. They don't look out the window.",
    akibet: (s) => [
      ["You", "The Eighth Brother. No one knows your name; you no longer remember it either."],
      ["The holocron", "In an Imperial vault. One day you tried to open it. It wouldn't open."],
      ["Orrin", has(s, "ORRIN_ESIR") && !has(s, "ORRIN_KURTARILDI") ? "He was taken out of his cell and set free. On your order. He didn't thank you; he didn't recognize you." : "In Varn or somewhere else, praying never to hear from you."],
      ["KT-4", "It was left behind at the garrison that night. No one knows who carried it onto Sena's ship."]
    ],
    yil: "Years later, at a rebel base, an old one-eyed droid tells young pilots a story. It never tells them the ending."
  },

  e_yalniz: {
    act: 3, konum: (s) => s.yalniz === "tunel" ? "The Dry Well tunnel" : "Varn garrison", time: "04:30", ruzgar: 0.1,
    end: { id: "yalniz", kind: "Ending" },
    title: "Alone",
    text: (s) => s.yalniz === "tunel" ? [

    if (has(s, "HOLOKRON")) list.push(has(s, "KURSUN") && !has(s, "ORRIN_SERBEST") ? "Stone cube, inside the lead box" : "Stone cube (holocron)");
    if (has(s, "KRISTAL")) list.push("Blue crystal");
    if (has(s, "TELSIZ")) list.push("Sena's radio (channel four)");
    if (has(s, "BOBIN") && !has(s, "GEMI_HAZIR")) list.push("Fuel coil");
    if (has(s, "YEMIN")) list.push("Orrin's broken pipe");
    return list;
  },
  hints: (s, act) => {
    const m = [];
    if (act === 1) {
      if (!has(s, "VIZYON")) m.push("You never listened to the cube's voice.");
      if (!has(s, "TELSIZ")) m.push("You could have gotten a radio from the pilot at the Dry Well.");
      if (has(s, "ORRIN_ESIR")) m.push("You left Orrin alone with the Inquisitor.");
      if (!has(s, "KURSUN")) m.push("There was a way to hide the cube from his eye.");
      if (!has(s, "ORRIN_HIKAYE")) m.push("You never asked about Orrin's past.");
    }
    if (act === 2) {
      if (!has(s, "TUNEL")) m.push("The cube could have shown you another way into the garrison.");
      if (!has(s, "BOBIN")) m.push("The ship at the garrison couldn't fly without the coil.");
      if (!has(s, "ORRIN_KURTARILDI") && has(s, "ORRIN_ESIR")) m.push("Orrin is still in a cell.");
      if (has(s, "ORRIN_SERBEST") && !has(s, "ORRIN_KATILDI")) m.push("Orrin had said he knew the way.");
      if (!has(s, "KRISTAL")) m.push("The light in the temple's heart was waiting for you.");
    }
    if (act === 3) {
      if (!has(s, "KRISTAL")) m.push("The cube wasn't alone; under the garrison there was something that completed it.");
      if (!has(s, "ORRIN_KURTARILDI") && has(s, "ORRIN_ESIR")) m.push("You could have gotten Orrin out of his cell.");
      if ((s.r.orrin || 0) < 2 && (has(s, "ORRIN_YANINDA") || has(s, "ORRIN_KATILDI") || has(s, "ORRIN_KURTARILDI"))) m.push("If you'd known Orrin better, he would have made a move too.");
      if ((s.r.kt4 || 0) < 1) m.push("If you'd trusted KT-4 a little more, it would have had a plan too.");
      if (!has(s, "TUNEL")) m.push("The woman in the cube wanted to show you an old path.");
    }
    return m;
  }
};

const esc = (t) => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

/* § numaraları: başlangıç 1, gerisi sabit tohumla karıştırılmış (klasik oyun kitabı gibi) */
const NUM = (() => {
  let seed = 1962;
  const rnd = () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const keys = [];
  Object.keys(S).forEach((k) => {
    keys.push(k);
    (S[k].choices || []).forEach((c, i) => keys.push(k + "#" + i));
    if (S[k].next) keys.push(k + "#next");
  });
  const pool = []; for (let n = 2; n <= 240; n++) pool.push(n);
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  const map = { a1: 1 }; let p = 0;
  keys.forEach((k) => { if (k !== "a1") map[k] = pool[p++]; });
  return map;
})();

let MUTE = false, toastTimer = null;
function toast(msg) {
  if (MUTE) return;
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 3200);
}
function loadEndings() { try { return JSON.parse(localStorage.getItem(END_KEY) || "[]"); } catch (e) { return []; } }
function saveEnding(id) {
  const list = loadEndings();
  if (!list.includes(id)) { list.push(id); try { localStorage.setItem(END_KEY, JSON.stringify(list)); } catch (e) {} }
}

const missedHints = (s, act) => (BOOK.hints ? BOOK.hints(s, act) : []).slice(0, 3);

/* ---------- sayfa ---------- */
function choiceNum(secId, c, i) { return NUM[secId + "#" + i]; }

function renderPage(turn) {
  const sec = S[state.sec];
  const act = val(sec.act) || 1;
  const time = val(sec.time);
  const num = state.num || NUM[state.sec];

  // sol sayfa
  let left = `<div class="plate"><div class="act-title">${ACTS[act][0]}<span>${ACTS[act][1]}</span></div>`;
  const imgKey = val(sec.img);
  const imgLabel = val(sec.imgLabel) || "";
  const hasImg = !!(imgKey && IMG[imgKey]);
  if (hasImg) left += `<figure class="ill"><div class="kb"><img src="${IMG[imgKey]}" alt="${esc(imgLabel)}"></div><figcaption>${esc(imgLabel.replace(/ \(.*\)/, ""))}</figcaption></figure>`;
  const lg = BOOK.ledger(sec, time);
  left += `<div class="ledger" aria-label="${esc(lg.title)}"><div class="lh">${esc(lg.title)}</div><div class="lv">${lg.html}</div></div>`;
  if (!hasImg) {
    const last = state.notes[state.notes.length - 1];
    left += `<div class="fleuron">✦ ✦ ✦</div>`;
    left += last ? `<div class="margin-note hand"><span class="lbl">${UI.sonYazdigin}</span>${esc(last)}</div>` : `<div class="margin-note hand"><span class="lbl">${esc(BOOK.rule[0])}</span>${esc(BOOK.rule[1])}</div>`;
  }
  const page = 2 * state.steps + 6;
  left = `<div class="runhead">${esc(META.baslik)}</div>` + left + `</div><div class="folio">${page}</div>`;

  // sağ sayfa
  let right = `<div class="runhead">${ACTS[act][1]}</div><div class="sect">§ ${num}</div>`;
  if (sec.end) right += `<div class="kind">${esc(val(sec.end.kind))}</div>`;
  if (sec.actEnd) right += `<div class="kind">${UI.perdeSonu(ACTS[act][0])}</div>`;
  right += `<h2>${esc(sec.title)}</h2><div class="text">`;
  let leadDone = false;
  sec.text(state).forEach((para) => {
    if (typeof para === "object") right += `<p class="quote">${DIL === "en" ? "“" : "«"}${esc(para.q)}${DIL === "en" ? "”" : "»"}</p>`;
    else {
      const cap = !leadDone && /^[A-Za-zÇĞİÖŞÜçğıöşü]/.test(para);
      right += `<p class="${cap ? "lead" : (!leadDone ? "first" : "")}">${esc(para)}</p>`; leadDone = true;
    }
  });
  right += `</div>`;

  if (sec.end) {
    right += `<div class="sub">${UI.sabah}</div><div class="text"><p class="first">${esc(val(sec.sabah))}</p></div>`;
    right += `<div class="sub">${UI.akibet}</div><ul class="fates">`;
    val(sec.akibet).forEach(([w, t]) => { right += `<li><b>${esc(w)}.</b> ${esc(t)}</li>`; });
    right += `</ul><div class="sub">${UI.yil}</div><div class="text"><p class="first">${esc(val(sec.yil))}</p></div>`;
    right += `<div class="the-end">${UI.son}</div>`;
    saveEnding(sec.end.id);
    right += `<div class="tally">${UI.bulunan(loadEndings().length, META.sonSayisi)}</div>`;
    right += `<div class="tally">${UI.takip} <a class="ig" href="${META.instagram}" target="_blank" rel="noopener">@${esc(META.instagramKullanici)}</a></div>`;
  }
  /* Perde sonundaki "Bu gece kaçırdıkların" kutusu okur isteğiyle kaldırıldı (2026-11-21).
     Kitaplardaki BOOK.hints verisi duruyor; geri açmak için bu bloğu eski haline getirmek yeterli. */

  right += `<div class="choices" id="choices"></div><div class="folio">${page + 1}</div>`;

  const read = Math.min(14, 3 + Math.round(state.steps * 0.8)), rest = Math.max(3, 16 - read);
  $("view").innerHTML = `<div class="binding"><div class="edges l" style="width:${read}px"></div><div class="edges r" style="width:${rest}px"></div><article class="book" id="book"><div class="leaf left" id="leaf-l">${left}</div><div class="leaf right" id="leaf-r">${right}</div></article><div class="ribbon"></div></div>`;

  const box = $("choices");
  const dh = document.createElement("div"); dh.className = "decide";
  dh.textContent = sec.end ? UI.kapatmadan : sec.actEnd ? ((typeof BOOK.actEndHead === "function" ? BOOK.actEndHead(sec) : BOOK.actEndHead) || UI.geceDevam) : UI.neYapacaksin;
  box.appendChild(dh);
  const addBtn = (text, n, onClick, id) => {
    const b = document.createElement("button");
    b.className = "choice"; b.type = "button"; if (id) b.id = id;
    b.innerHTML = (n == null ? `<span class="seal blank" aria-hidden="true">❧</span>` : `<span class="seal" aria-label="${UI.bolum(n)}">${n}</span>`)
      + `<span class="ct">${esc(text)}</span><span class="go" aria-hidden="true">${n == null ? UI.kapagaDon : UI.sayfayaGit}</span>`;
    b.addEventListener("click", onClick);
    box.appendChild(b);
  };
  if (sec.end || sec.actEnd) {
    if (sec.next) addBtn(sec.next.t, NUM[state.sec + "#next"], () => go(sec.next, NUM[state.sec + "#next"]), "c-next");
    if (sec.end) {
      addBtn(BOOK.againText || UI.bastan, 1, () => { state = fresh(); render(true); }, "c-again");
      addBtn(UI.KapagaDon, null, () => { state = Object.assign(fresh(), { sec: "cover" }); render(); }, "c-cover");
    }
  } else {
    sec.choices.forEach((c, i) => {
      if (c.if && !c.if(state)) return;
      const n = choiceNum(state.sec, c, i);
      addBtn(c.t, n, () => go(c, n), "c-" + i);
    });
  }
}

function go(choice, shownNum) {
  const oldRight = $("leaf-r") ? $("leaf-r").innerHTML : null;
  const oldLeft = $("leaf-l") ? $("leaf-l").innerHTML : null;
  const oldBook = $("book") ? $("book").innerHTML : null;
  state.steps = (state.steps || 0) + 1;
  if (choice.fx) choice.fx(state);
  state.sec = typeof choice.to === "function" ? choice.to(state) : choice.to;
  state.num = shownNum || null;
  const next = S[state.sec];
  if (next.enter) next.enter(state);
  render(true);
  flipFrom(oldRight, oldBook, oldLeft);
  if (next.end && window.ATM) ATM.flash = 1;
}

function flipFrom(oldRight, oldBook, oldLeft) {
  const book = $("book");
  if (!book || !oldRight || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const twoPage = getComputedStyle(book).gridTemplateColumns.split(" ").length > 1;
  if (twoPage) {
    const newLeft = $("leaf-l");
    const fl = document.createElement("div");
    fl.className = "flip";
    fl.innerHTML = `<div class="face front leaf right">${oldRight}</div><div class="face back leaf left">${newLeft.innerHTML}</div>`;
    // çevrilen sayfa üstünü örtene kadar altta eski sol sayfa görünür, gerçek kitaptaki gibi
    const newLeftHTML = newLeft.innerHTML;
    if (oldLeft) newLeft.innerHTML = oldLeft; else newLeft.classList.add("hide-under");
    book.appendChild(fl);
    setTimeout(() => { newLeft.innerHTML = newLeftHTML; newLeft.classList.remove("hide-under"); fl.remove(); }, 860);
  } else {
    const lf = document.createElement("div");
    lf.className = "lift book";
    lf.innerHTML = oldBook;
    lf.style.display = "block";
    book.appendChild(lf);
    setTimeout(() => lf.remove(), 620);
  }
}

function render(turn) {
  if (window.sozlukKapat) sozlukKapat();
  const onCover = state.sec === "cover";
  ["btn-book", "btn-cover"].forEach((id) => { $(id).style.visibility = onCover ? "hidden" : "visible"; });
  if (window.ATM) ATM.target = onCover ? (BOOK.coverAtmos ?? 0.6) : BOOK.atmos(S[state.sec]);
  if (window.ATM && !onCover && BOOK.hour) ATM.hour = BOOK.hour(S[state.sec], val(S[state.sec].time));
  if (onCover) renderCover(); else renderPage(turn);
  renderDrawer();
  $("main").scrollTop = 0;
}

function renderDrawer() {
  const items = $("items"); items.innerHTML = "";
  BOOK.items(state).forEach((x) => { const li = document.createElement("li"); li.textContent = x; items.appendChild(li); });

  const notes = $("notes"); notes.innerHTML = "";
  if (!state.notes.length) { const li = document.createElement("li"); li.className = "empty"; li.textContent = UI.bosDefter; notes.appendChild(li); }
  state.notes.forEach((n) => { const li = document.createElement("li"); li.textContent = n; notes.appendChild(li); });
  $("note-count").textContent = state.notes.length ? "(" + state.notes.length + ")" : "";

  const ends = $("endings"); ends.innerHTML = "";
  const found = loadEndings();
  ENDINGS.forEach((e) => {
    const li = document.createElement("li");
    li.textContent = found.includes(e.id) ? e.title : "· · ·";
    if (!found.includes(e.id)) li.className = "empty";
    ends.appendChild(li);
  });
}

if (META.kutuphane) { const l = $("lnk-lib"); l.href = META.kutuphane; l.hidden = false; }
$("btn-book").addEventListener("click", () => $("drawer").classList.add("open"));
$("btn-close").addEventListener("click", () => $("drawer").classList.remove("open"));
$("btn-cover").addEventListener("click", () => { $("confirm").classList.add("show"); $("btn-cover").style.display = "none"; });
const closeConfirm = () => { $("confirm").classList.remove("show"); $("btn-cover").style.display = ""; };
$("btn-no").addEventListener("click", closeConfirm);
$("btn-yes").addEventListener("click", () => { closeConfirm(); state = Object.assign(fresh(), { sec: "cover" }); render(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("drawer").classList.remove("open"); });


/* ---------- Sözlük: bir kelimeye dokununca kitaptaki anlamı (books/<id>/sozluk.js varsa) ---------- */
if (typeof SOZLUK !== "undefined") (function () {
  const st = document.createElement("style");
  st.textContent = `
  #sozluk { position: fixed; z-index: 60; max-width: 300px; padding: 10px 14px 11px; border-radius: 8px; background: #fbf6ea; color: #2a2118;
    box-shadow: 0 10px 30px rgba(0,0,0,.35), 0 0 0 1px rgba(120,90,50,.35); font-family: "EB Garamond", Georgia, serif; font-size: 18px; line-height: 1.35;
    opacity: 0; transform: translateY(4px); transition: opacity .15s, transform .15s; pointer-events: none; }
  #sozluk.acik { opacity: 1; transform: none; pointer-events: auto; }
  #sozluk b { font-weight: 600; } #sozluk .an { display: block; margin-top: 2px; }
  #sozluk .kal { display: block; margin-top: 7px; padding-top: 6px; border-top: 1px solid rgba(120,90,50,.25); font-size: 15px; }
  #sozluk .dil { display: block; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: #8a6a3a; margin-bottom: 3px; }
  #sozluk-isaret { position: fixed; z-index: 59; border-radius: 3px; background: rgba(233,179,79,.35); pointer-events: none; display: none; }
  .text p, .quote, .cover-wrap p { -webkit-tap-highlight-color: transparent; }
  .sozluk-ipucu { font-style: italic; font-size: 15px; opacity: .8; margin: 10px 0 4px; }`;
  document.head.appendChild(st);
  const balon = document.createElement("div"); balon.id = "sozluk"; balon.setAttribute("role", "status"); document.body.appendChild(balon);
  const isaret = document.createElement("div"); isaret.id = "sozluk-isaret"; document.body.appendChild(isaret);
  const HARF = /[\p{L}'’]/u;
  const temiz = (w) => w.toLocaleLowerCase("en").replace(/̇/g, "").replace(/’/g, "'").replace(/^'+|'+$/g, "");
  const kok = (w) => (w.length > 4 ? w.replace(/(ing|ed|s)$/, "") : w);
  const KAL = {}; Object.keys(SOZLUK.kaliplar || {}).forEach((k) => { KAL[k.split(" ").map(kok).join(" ")] = k; });
  function anlam(w) { const t = temiz(w); return SOZLUK.kelimeler[t] || (t.endsWith("'s") && SOZLUK.kelimeler[t.slice(0, -2)]) || null; }
  function kalip(metin, bas, son) {
    // dokunulan kelimeyi içeren 2-3 kelimelik kalıp var mı
    const ws = []; const re = /[\p{L}'’]+/gu; let m;
    while ((m = re.exec(metin))) ws.push({ w: kok(temiz(m[0])), a: m.index, b: m.index + m[0].length });
    const i = ws.findIndex((x) => x.a === bas); if (i < 0) return null;
    for (const n of [3, 2]) for (let j = i - n + 1; j <= i; j++) {
      if (j < 0 || j + n > ws.length) continue;
      const k = KAL[ws.slice(j, j + n).map((x) => x.w).join(" ")]; if (k) return k;
    }
    return null;
  }
  function noktadan(x, y) {
    if (document.caretPositionFromPoint) { const p = document.caretPositionFromPoint(x, y); return p && { node: p.offsetNode, off: p.offset }; }
    if (document.caretRangeFromPoint) { const r = document.caretRangeFromPoint(x, y); return r && { node: r.startContainer, off: r.startOffset }; }
    return null;
  }
  window.sozlukKapat = () => { balon.classList.remove("acik"); isaret.style.display = "none"; };
  document.addEventListener("click", (e) => {
    const hedef = e.target.closest && e.target.closest(".text p, .quote, .cover-wrap p");
    if (!hedef || e.target.closest("a, button") || String(window.getSelection())) { sozlukKapat(); return; }
    const c = noktadan(e.clientX, e.clientY);
    if (!c || c.node.nodeType !== 3) { sozlukKapat(); return; }
    const t = c.node.textContent; let a = c.off, b = c.off;
    while (a > 0 && HARF.test(t[a - 1])) a--;
    while (b < t.length && HARF.test(t[b])) b++;
    const kelime = t.slice(a, b).replace(/^['’]+|['’]+$/g, "");
    if (!kelime) { sozlukKapat(); return; }
    const an = anlam(kelime); const kl = kalip(t, a, b);
    if (!an && !kl) { sozlukKapat(); return; }
    const r = document.createRange(); r.setStart(c.node, a); r.setEnd(c.node, b);
    const k = r.getBoundingClientRect();
    if (k.width === 0 || e.clientX < k.left - 4 || e.clientX > k.right + 4) { sozlukKapat(); return; }
    balon.innerHTML = `<span class="dil" lang="tr">${esc(SOZLUK.baslik || "")}</span><b>${esc(kelime)}</b>` + (an ? `<span class="an" lang="tr">${esc(an)}</span>` : "") +
      (kl ? `<span class="kal"><b>${esc(kl)}</b> → ${esc(SOZLUK.kaliplar[kl])}</span>` : "");
    isaret.style.cssText = `display:block;left:${k.left - 2}px;top:${k.top - 1}px;width:${k.width + 4}px;height:${k.height + 2}px`;
    balon.classList.add("acik");
    const bw = balon.offsetWidth, bh = balon.offsetHeight;
    let x = Math.min(Math.max(8, k.left + k.width / 2 - bw / 2), window.innerWidth - bw - 8);
    let y = k.top - bh - 10; if (y < 8) y = k.bottom + 10;
    balon.style.left = x + "px"; balon.style.top = y + "px";
    e.stopPropagation();
  });
  ["scroll", "resize"].forEach((ev) => window.addEventListener(ev, () => sozlukKapat(), true));
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") sozlukKapat(); });
})();

/* ---------------- Çöl gezegeni: iki güneş, kum tepeleri, yıldızlar, kum fırtınası ---------------- */
const desert = { level: 0.15, target: 0.15, flash: 0, hour: 18, h: 18 };
window.ATM = desert;
(function scene() {
  const cv = $("sea"), ctx = cv.getContext("2d");
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W, H, dpr, dunes = [], stars = [], grains = [];
  let seed = 5;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  const lerp = (a, b, t) => a + (b - a) * t;
  const mix = (c1, c2, t) => c1.map((v, i) => Math.round(lerp(v, c2[i], t)));
  // saat: 17 gün batımı, 19 alacakaranlık, 20+ gece, 5 şafak
  const SKY = [
    [0, [8, 8, 20], [24, 18, 30]], [4.5, [14, 12, 30], [60, 40, 50]], [6, [90, 70, 90], [230, 150, 90]],
    [9, [110, 150, 190], [235, 200, 150]], [16, [120, 150, 180], [240, 190, 130]], [17.5, [90, 70, 90], [240, 130, 70]],
    [19, [30, 24, 46], [120, 60, 50]], [20.5, [8, 8, 20], [24, 18, 30]], [24, [8, 8, 20], [24, 18, 30]]
  ];
  function skyAt(h) {
    for (let i = 0; i < SKY.length - 1; i++) {
      const [a, t1, b1] = SKY[i], [b, t2, b2] = SKY[i + 1];
      if (h >= a && h <= b) { const t = (h - a) / (b - a); return [mix(t1, t2, t), mix(b1, b2, t)]; }
    }
    return [SKY[0][1], SKY[0][2]];
  }
  const nightness = (h) => (h < 4.5 || h > 20.5) ? 1 : (h < 6 ? 1 - (h - 4.5) / 1.5 : (h > 18.5 ? (h - 18.5) / 2 : 0));
  function size() {
    dpr = Math.min(2, window.devicePixelRatio || 1); W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    seed = 5;
    dunes = [0, 1, 2].map((d) => { const pts = []; for (let x = -50; x <= W + 50; x += 40) pts.push([x, H * (0.6 + d * 0.11) + Math.sin(x * (0.004 + d * 0.002) + d * 2) * (30 - d * 6) + rnd() * 10]); return pts; });
    stars = Array.from({ length: 180 }, () => ({ x: rnd() * W, y: rnd() * H * 0.6, r: rnd() * 1.3, p: rnd() * 6 }));
    grains = Array.from({ length: 400 }, () => ({ x: Math.random() * W, y: Math.random() * H, v: 2 + Math.random() * 5, l: 6 + Math.random() * 18 }));
  }
  window.addEventListener("resize", size); size();
  function frame(t) {
    const time = t / 1000;
    desert.level += (desert.target - desert.level) * 0.02;
    desert.h += (desert.hour - desert.h) * 0.02;
    const h = desert.h, L = desert.level, n = nightness(h);
    const [top, bot] = skyAt(h);
    const g = ctx.createLinearGradient(0, 0, 0, H * 0.75);
    g.addColorStop(0, `rgb(${top})`); g.addColorStop(1, `rgb(${bot})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    if (n > 0.1) stars.forEach((s) => { ctx.fillStyle = `rgba(255,245,230,${n * (0.4 + 0.5 * Math.sin(time + s.p))})`; ctx.fillRect(s.x, s.y, s.r + 0.6, s.r + 0.6); });
    // iki güneş (gündüz/batım), ya da iki küçük ay (gece)
    const day = 1 - n, sx = W * 0.68, sy = H * (0.25 + 0.35 * Math.min(1, Math.max(0, (h - 15) / 4)));
    [[0, 34, "255,210,140"], [70, 20, "255,170,110"]].forEach(([dx, r, c], i) => {
      const x = sx + dx, y = sy + i * 18;
      const gl = ctx.createRadialGradient(x, y, 0, x, y, r * 5); gl.addColorStop(0, `rgba(${c},${0.55 * day})`); gl.addColorStop(1, `rgba(${c},0)`);
      ctx.fillStyle = gl; ctx.fillRect(x - r * 5, y - r * 5, r * 10, r * 10);
      ctx.fillStyle = `rgba(${c},${0.9 * day})`; ctx.beginPath(); ctx.arc(x, y, r * 0.5, 0, 7); ctx.fill();
    });
    if (n > 0.3) [[W * 0.22, H * 0.18, 10], [W * 0.27, H * 0.13, 5]].forEach(([x, y, r]) => { ctx.fillStyle = `rgba(220,220,235,${n * 0.8})`; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); });
    dunes.forEach((pts, d) => {
      const c = mix(mix([196, 120, 70], [60, 40, 40], n), [20, 14, 14], d * 0.25 + n * 0.3);
      ctx.fillStyle = `rgb(${c})`; ctx.beginPath(); ctx.moveTo(0, H);
      pts.forEach(([x, y]) => ctx.lineTo(x + (reduce ? 0 : Math.sin(time * 0.03 + d) * 4), y)); ctx.lineTo(W, H); ctx.fill();
    });
    // kum fırtınası
    if (L > 0.05) {
      ctx.fillStyle = `rgba(200,140,80,${0.25 * L})`; ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = `rgba(230,180,120,${0.2 + 0.4 * L})`; ctx.lineWidth = 1; ctx.beginPath();
      const cnt = Math.floor(grains.length * L);
      for (let i = 0; i < cnt; i++) { const p = grains[i]; ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.l, p.y + 1); if (!reduce) { p.x -= p.v * (1 + L * 2); if (p.x < -20) { p.x = W + 20; p.y = Math.random() * H; } } }
      ctx.stroke();
    }
    if (desert.flash > 0) { ctx.fillStyle = `rgba(255,230,200,${desert.flash * 0.3})`; ctx.fillRect(0, 0, W, H); desert.flash *= 0.88; if (desert.flash < 0.02) desert.flash = 0; }
    if (!reduce) requestAnimationFrame(frame);
  }
  if (reduce) { frame(0); window.addEventListener("resize", () => frame(0)); }
  else requestAnimationFrame(frame);
})();

/* ---------------- Başlat ---------------- */
function start(data) {
  if (data && data.sec && (data.sec === "cover" || S[data.sec])) state = Object.assign(fresh(), data);
  else if (location.hash === "#oku") state = fresh();
  render();
}
window.claude?.hot?.snapshot?.(() => state);
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
