<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Yedinci Kat: zarla oynanan, yedi kat aşağı inen bir zindan macerası. Üç sınıf, on iki son ve adını kurutan bir mürekkep.">
<link rel="canonical" href="https://maceranisec.com/yedinci-kat/">
<title>Yedinci Kat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<style>
/*
VOICE: karanlık, ıslak taş; sakin ama tetikte. Kitap sesi, oyun dokusu.
IDEA: haritacının deri rulosu — oynadıkça kendini çizen parşömen bir harita, taş bir masanın üstünde.
PICTURE: oda görseli (Nano Banana yuvası) + kendiliğinden mürekkeplenen harita + kemik zarlar.
COLOUR/TYPE: yosunlu taş yeşili zemin, ıslak taş ikincil, meşale kızılı vurgu, mantar ışığı başarı rengi; Cinzel başlık, Alegreya metin.
LAYOUT: solda sahne (görsel, metin, seçim/zar/dövüş), sağda karakter kâğıdı ve harita; 860px altında tek sütun.
*/
:root{
  color-scheme:dark;
  --zemin:#101714; --tas:#1b2622; --tas2:#24322d; --cizgi:#34463f;
  --yazi:#e9e4d6; --soluk:#a9b3a8; --kizil:#e8643a; --kizil2:#ff8a5c;
  --isik:#7fe0c4; --kan:#e05252; --parsomen:#e3d6b4; --murekkep:#2b2118;
  --golge:0 18px 40px -18px #000c;
}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{
  background:
    radial-gradient(1200px 600px at 15% -10%,#e8643a1f,transparent 60%),
    radial-gradient(900px 500px at 110% 10%,#7fe0c414,transparent 60%),
    var(--zemin);
  color:var(--yazi);font:17px/1.6 Alegreya,Georgia,serif;min-height:100vh;overflow-x:clip;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--isik);outline-offset:2px}
.ust .ikincil{flex:none}
.ust{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px max(4vw,16px);border-bottom:1px solid var(--cizgi)}
.logo{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
.logo-ad{font:700 22px/1 Cinzel,serif;letter-spacing:.04em}
.logo-alt{color:var(--soluk);font-size:15px}
main{max-width:1240px;margin:0 auto;padding:clamp(16px,3vw,36px) max(4vw,16px) 60px}

/* düğmeler */
.birincil,.ikincil,.secim{border-radius:10px;min-height:44px;border:1px solid var(--cizgi)}
.birincil{background:linear-gradient(#f07448,#c94b26);border-color:#ff9a72;color:#1a0c05;font-weight:700;padding:10px 22px;box-shadow:0 6px 20px -8px #e8643aaa}
.birincil:hover{filter:brightness(1.08)}
.ikincil{background:var(--tas2);padding:8px 16px;white-space:nowrap}
.ikincil:hover{border-color:var(--soluk)}

/* giriş + sınıf seçimi */
.kapak{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(20px,4vw,56px);align-items:center;margin-bottom:34px}
.kapak h1{font:700 clamp(36px,6vw,64px)/1.02 Cinzel,serif;margin:0 0 14px;text-wrap:balance}
.kapak .harita{align-self:center}
.kapak p{margin:0 0 12px;max-width:62ch;color:#d8d2c2}
.kapak .soru{color:var(--isik);font-style:italic}
.siniflar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.sinif{--vurgu:var(--kizil);position:relative;overflow:hidden;background:linear-gradient(var(--tas2),var(--tas));border:1px solid var(--cizgi);border-radius:18px;padding:0;text-align:left;display:flex;flex-direction:column;box-shadow:var(--golge);transition:transform .25s,border-color .25s,box-shadow .25s;color:var(--yazi);font:inherit;cursor:pointer}
.sinif-hirsiz{--vurgu:var(--isik)}
.sinif-buyucu{--vurgu:#e3b35c}
.sinif:hover{transform:translateY(-4px)}
.sinif:focus-visible{outline:2px solid var(--vurgu);outline-offset:3px}
.sinif[aria-pressed=true]{border-color:var(--vurgu);box-shadow:0 0 0 1px var(--vurgu),0 0 34px -6px var(--vurgu),var(--golge)}
.sinif .portre{position:relative;aspect-ratio:4/5;overflow:hidden;background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--vurgu) 28%,transparent),transparent 62%),linear-gradient(#26332e,#0d1311)}
.sinif .portre img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 18%;filter:saturate(.92) brightness(.9);transition:transform .6s ease,filter .4s}
.sinif:hover .portre img,.sinif[aria-pressed=true] .portre img{transform:scale(1.04);filter:none}
.portre-bos{position:absolute;inset:0;display:grid;place-items:center;padding-bottom:22%}
.portre-bos svg{width:38%;height:auto;opacity:.9;filter:drop-shadow(0 0 18px color-mix(in srgb,var(--vurgu) 55%,transparent))}
.portre-yazi{position:absolute;inset:auto 0 0 0;padding:60px 18px 16px;background:linear-gradient(transparent,#0b100eE6 55%,#0b100e)}
.portre-yazi h3{font:700 28px/1.05 Cinzel,serif;margin:0 0 6px;letter-spacing:.02em;text-shadow:0 2px 10px #000}
.portre-yazi p{margin:0;color:#d8d2c2;font-size:15px;font-style:italic;line-height:1.4;min-height:2.8em}
.secildi{position:absolute;top:-30px;left:18px;font:700 12px/1 Alegreya,serif;letter-spacing:.12em;text-transform:uppercase;color:#0b100e;background:var(--vurgu);padding:5px 9px;border-radius:999px;opacity:0;transform:translateY(6px);transition:.25s}
.sinif[aria-pressed=true] .secildi{opacity:1;transform:none}
.sinif .govde{display:flex;flex-direction:column;gap:12px;padding:14px 16px 18px;flex:1}
.degerler{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.deger{background:#0d1311;border:1px solid #ffffff10;border-radius:10px;padding:6px 2px 5px;text-align:center}
.deger b{display:block;font:700 20px/1.1 Cinzel,serif}
.deger span{display:block;font-size:11.5px;color:var(--soluk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deger.guclu{border-color:color-mix(in srgb,var(--vurgu) 60%,transparent);background:color-mix(in srgb,var(--vurgu) 12%,#0d1311)}
.deger.guclu b{color:var(--vurgu)}
.deger.zayif b{color:#ffffff55}
.deger.can b{color:#f08a7a}
.deger.zirh b{color:var(--parsomen)}
.sinif .silah{display:flex;justify-content:space-between;gap:10px;font-size:14.5px;margin:0;color:var(--soluk);padding:7px 10px;border-radius:10px;background:#ffffff08}
.sinif .silah span{color:var(--parsomen);font-weight:700}
.rozet-listesi{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.rozet-listesi li{position:relative;padding-left:18px;font-size:14.5px;line-height:1.35}
.rozet-listesi li::before{content:"";position:absolute;left:2px;top:.45em;width:8px;height:8px;transform:rotate(45deg);background:var(--vurgu);border-radius:1px}
.rozet-listesi b{display:block;color:var(--yazi)}
.rozet-listesi span{color:var(--soluk)}
.sinif .yetenek{font-size:15px;margin:0;color:var(--isik)}
.kagit-bas{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.kagit-bas .alt{margin:0!important}
.kisi-portre{--vurgu:var(--kizil);flex:none;width:54px;height:54px;border-radius:50%;overflow:hidden;border:2px solid var(--vurgu);background:#0d1311;display:grid;place-items:center;box-shadow:0 0 14px -4px var(--vurgu)}
.kisi-portre.sinif-hirsiz{--vurgu:var(--isik)}
.kisi-portre.sinif-buyucu{--vurgu:#e3b35c}
.kisi-portre img{width:100%;height:100%;object-fit:cover;object-position:50% 14%}
.kisi-portre .portre-bos{position:static;padding:0}
.kisi-portre svg{width:30px;height:30px}
.olcu{display:grid;grid-template-columns:5.5em minmax(0,1fr) 2em;align-items:center;gap:8px;font-size:15px}
.olcu b{font-weight:500;text-align:right}
.cubuk{height:8px;border-radius:9px;background:#0007;overflow:hidden}
.cubuk i{display:block;height:100%;background:var(--kizil);border-radius:9px;transition:width .5s}
.cubuk.can i{background:linear-gradient(90deg,#c43d3d,#ef6b5b)}
.basla{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin-top:22px}
.basla label{display:flex;flex-direction:column;gap:6px;font-size:15px;color:var(--soluk)}
.basla input{font:inherit;font-size:17px;background:var(--tas);color:var(--yazi);border:1px solid var(--cizgi);border-radius:10px;padding:9px 12px;min-height:44px;width:16em}

/* oyun düzeni */
.oyun{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:clamp(18px,3vw,34px);align-items:start}
.sahne{background:var(--tas);border:1px solid var(--cizgi);border-radius:18px;overflow:hidden;box-shadow:var(--golge)}
.gorsel{position:relative;aspect-ratio:16/8;background:#0a0f0d;overflow:hidden}
.gorsel img,.gorsel svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gorsel{background:#0a0f0d}
/* Belleğe alınmış görsel hemen görünür; ilk kez yüklenen kısa bir geçişle belirir. */
.gorsel img.yukleniyor{opacity:0;transition:opacity .35s}
.gorsel img.yukleniyor.yuklendi{opacity:1}
.gorsel .etiket{position:absolute;left:12px;bottom:10px;font-size:13px;color:#cfd8cf;background:#000a;padding:2px 8px;border-radius:6px}
.metin{padding:clamp(18px,3vw,30px)}
.metin h2{font:700 clamp(26px,3.2vw,34px)/1.1 Cinzel,serif;margin:0 0 14px;text-wrap:balance}
.metin p{margin:0 0 12px;max-width:68ch}
.not{border-left:3px solid var(--isik);background:#7fe0c412;padding:10px 14px;border-radius:0 10px 10px 0;margin:0 0 16px;font-style:italic}
.not.kotu{border-color:var(--kan);background:#e0525214}
.secimler{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.secim{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--tas2);padding:10px 14px;transition:border-color .15s,transform .15s}
.secim:hover:not(:disabled){border-color:var(--kizil);transform:translateX(3px)}
.secim:disabled{opacity:.55;cursor:not-allowed}
.secim .no{font:700 15px Cinzel,serif;color:var(--kizil2);width:1.4em;flex:none}
.secim .ne{flex:1}
.rozet{flex:none;font-size:13px;border:1px solid var(--cizgi);border-radius:20px;padding:2px 10px;color:var(--soluk);white-space:nowrap}
.rozet.zarli{color:var(--parsomen)}
.rozet.ozel{color:var(--isik);border-color:#7fe0c455}
.rozet.kilit{color:var(--kan)}

/* zar paneli */
.panel{margin-top:20px;background:#0b110f;border:1px solid var(--cizgi);border-radius:14px;padding:18px}
.panel h3{font:700 17px Cinzel,serif;margin:0 0 12px;letter-spacing:.02em}
.zarlar{display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.taraf{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.taraf .kim{width:7.5em;color:var(--soluk);font-size:15px}
.zar{width:56px;height:56px;border-radius:12px;background:linear-gradient(145deg,#f4ecd8,#cfc2a0);box-shadow:inset 0 -4px 0 #a8996f,0 6px 14px -4px #000;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:9px;gap:2px}
.zar.dusman{background:linear-gradient(145deg,#4d5a55,#2a3430);box-shadow:inset 0 -4px 0 #1a2220,0 6px 14px -4px #000}
.zar i{border-radius:50%;background:var(--murekkep);opacity:0;transform:scale(.8)}
.zar.dusman i{background:#e9e4d6}
.zar.muttefik{background:linear-gradient(145deg,#b8473a,#7a231b);box-shadow:inset 0 -4px 0 #571610,0 6px 14px -4px #000}
.zar.muttefik i{background:#f6e6d8}
.zar i.a{opacity:1}
.zar.yuvarlan{animation:yuvarlan .16s linear infinite}
.zar.oturdu{animation:otur .35s ease-out}
.zar.cok{background:none;box-shadow:none;padding:0;display:grid;grid-template:none;place-items:center;position:relative;filter:drop-shadow(0 6px 8px #000a)}
.zar.cok svg{position:absolute;inset:0;width:100%;height:100%}
.zar.cok .zd-dis{fill:#e9dcb8;stroke:#a8996f;stroke-width:3;stroke-linejoin:round}
.zar.cok .zd-ic{fill:#f6eed8}
.zar.cok .zd-kenar{stroke:#b7a77c;stroke-width:2;fill:none}
.zar.cok span{position:relative;font:700 17px Cinzel,serif;color:var(--murekkep)}
.zar.cok.dusman .zd-dis{fill:#3a4743;stroke:#1a2220}.zar.cok.dusman .zd-ic{fill:#4d5a55}.zar.cok.dusman .zd-kenar{stroke:#28322e}
.zar.cok.dusman span{color:#e9e4d6}
.zar.cok.muttefik .zd-dis{fill:#9b3a2e;stroke:#571610}.zar.cok.muttefik .zd-ic{fill:#b8473a}.zar.cok.muttefik .zd-kenar{stroke:#6e2018}
.zar.cok.muttefik span{color:#f6e6d8}
.atis{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:12px}
.atis .kim{width:7.5em;color:var(--soluk);font-size:15px;line-height:1.25}
.atis .kim small{display:block;font-size:13px;opacity:.85}
.atis .zar{width:48px;height:48px}
.atis .zar:not(.cok){padding:8px}
.atis .ek,.atis .esit{font-size:17px}
.zarnot .atis{margin-top:0}
.sabit-ornek{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;border:1px dashed var(--soluk);font:700 18px Cinzel,serif;color:var(--soluk)}
.zar-secim{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.zs{display:flex;align-items:center;gap:16px;text-align:left;background:var(--tas);border:1px solid var(--cizgi);border-radius:14px;padding:14px 16px;min-height:44px}
.zs[aria-pressed=true]{border-color:var(--kizil);box-shadow:0 0 0 1px var(--kizil)}
.zs b{display:block;font:700 18px Cinzel,serif}
.zs small{display:block;font-size:15px;color:var(--soluk);line-height:1.4;margin-top:2px}
.zs-ornek{display:flex;flex-wrap:wrap;gap:6px;flex:none;max-width:96px}
.zs-ornek .zar{width:40px;height:40px;padding:6px}
.zs-ornek .zar.cok{padding:0}.zs-ornek .zar.cok span{font-size:13px}
@keyframes yuvarlan{0%{transform:rotate(0) translateY(0)}50%{transform:rotate(14deg) translateY(-6px)}100%{transform:rotate(-10deg) translateY(0)}}
@keyframes otur{0%{transform:scale(1.18)}100%{transform:scale(1)}}
.hesap{font-size:17px;color:#d8d2c2;margin:14px 0 0}
.hesap b{color:var(--yazi)}
.sonuc{display:inline-block;margin-top:10px;font:700 18px Cinzel,serif;padding:4px 14px;border-radius:8px}
.sonuc.iyi{background:#7fe0c422;color:var(--isik)}
.sonuc.kotu{background:#e0525222;color:#ff8b8b}
.sonuc.ara{background:#ffffff14;color:var(--soluk)}
.sonuc.kucuk{font-size:15px;padding:1px 10px;margin:0 0 0 6px;vertical-align:1px}
.gec .atis{margin:4px 0 10px}
.kurallar{margin-top:26px;background:var(--tas);border:1px solid var(--cizgi);border-radius:14px;padding:16px 20px}
.kurallar h2{font:700 20px Cinzel,serif;margin:0 0 8px}
.kurallar ul{margin:0;padding-left:18px;color:#d8d2c2;font-size:16px}
.kurallar li{margin:4px 0}
.dugmeler{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.gizli{visibility:hidden}

/* dövüş */
.rakip{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-bottom:14px}
.rakip .ad{font:700 16px Cinzel,serif;margin-bottom:6px}
.rakip .ad small{font:15px Alegreya,serif;color:var(--soluk)}
.kayit{margin:12px 0 0;padding:0;list-style:none;font-size:15px;color:var(--soluk)}
.kayit li{padding:2px 0}
.kayit li:last-child{color:var(--yazi)}
.vurus{animation:sars .35s}
@keyframes sars{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}

/* son */
.son-afis{padding:16px 18px;border-radius:12px;margin:0 0 16px;font:700 22px/1.2 Cinzel,serif}
.son-afis.zafer{background:#7fe0c41c;color:var(--isik);border:1px solid #7fe0c455}
.son-afis.notr{background:#ffffff10;color:var(--parsomen);border:1px solid var(--cizgi)}
.son-afis.olum{background:#e052521c;color:#ff8b8b;border:1px solid #e0525255}
.ozet{color:var(--soluk);font-size:15px}

/* yan kâğıt */
.yan{display:flex;flex-direction:column;gap:18px;position:sticky;top:16px}
.kagit{background:var(--tas);border:1px solid var(--cizgi);border-radius:16px;padding:16px 18px;box-shadow:var(--golge)}
.kagit h3{font:700 18px Cinzel,serif;margin:0 0 2px}
.kagit .alt{color:var(--soluk);font-size:15px;margin:0 0 12px}
.ozellikler{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.ozellikler div{background:var(--tas2);border-radius:10px;padding:6px 4px;text-align:center;font-size:13px;color:var(--soluk)}
.ozellikler b{display:block;font:700 22px Cinzel,serif;color:var(--yazi)}
.satir{display:flex;justify-content:space-between;gap:10px;font-size:15px;padding:5px 0;border-top:1px solid #ffffff0d}
.satir span:last-child{text-align:right}
.hak{letter-spacing:.2em;color:var(--kizil2)}
.hak .bos{color:#ffffff30}
.harita{background:
    radial-gradient(circle at 30% 20%,#fff6,transparent 50%),
    radial-gradient(circle at 80% 90%,#b9a3734d,transparent 60%),var(--parsomen);
  border-radius:6px 16px 8px 14px;padding:12px;color:var(--murekkep);box-shadow:var(--golge),inset 0 0 30px #8a6f3f66}
.harita h3{font:700 15px Cinzel,serif;margin:0 0 4px;color:#5a4630}
.harita svg{display:block;width:100%;height:auto}
.harita .oda rect{fill:#f2e8cc;stroke:var(--murekkep);stroke-width:1.6}
.harita .oda.simdi rect{fill:#f7c9a8;stroke:#a23c17;stroke-width:2.4}
.harita .oda text{font:600 11px Alegreya,serif;fill:var(--murekkep);text-anchor:middle;dominant-baseline:middle}
.harita .yol{stroke:var(--murekkep);stroke-width:2;stroke-dasharray:4 3;fill:none}
.harita .yeni{animation:cizil 1.2s ease-out both}
@keyframes cizil{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.harita .yedinci{font:700 12px Cinzel,serif;fill:#5a4630;text-anchor:middle}
.harita .islak{font:italic 700 13px Alegreya,serif;fill:#1d2f5a;text-anchor:middle;animation:islak 2.6s ease-in-out infinite}
@keyframes islak{50%{fill:#3b5aa8}}

/* Yeni harita: yırtık parşömen, elle çizilmiş odalar, Mürekkep'e göre mürekkep rengi */
.yeni-harita{--ink:#2b2118;padding:14px 12px 10px;border-radius:0;
  background:radial-gradient(circle at 22% 14%,#fff7,transparent 45%),radial-gradient(circle at 86% 78%,#a0844f55,transparent 55%),
    radial-gradient(circle at 12% 88%,#7b5a2a33,transparent 30%),#e6d5ab;
  clip-path:polygon(0 1.5%,5% 0,13% 1.2%,24% 0,37% .8%,51% 0,63% 1.3%,76% 0,88% 1%,100% 0,99.2% 10%,100% 24%,98.8% 39%,100% 54%,99.1% 69%,100% 84%,99% 100%,85% 99%,71% 100%,56% 99.1%,42% 100%,28% 99%,13% 100%,0 99.2%,1% 85%,0 69%,1.2% 53%,0 38%,.9% 22%)}
.yeni-harita.m-islak{--ink:#1f2b4d}.yeni-harita.m-kuruyor{--ink:#3a2c25}.yeni-harita.m-kurumus{--ink:#6e3f18}
.yeni-harita h3{text-align:center;font:700 15px Cinzel,serif;color:#3a2a1a;letter-spacing:.04em;margin:0}
.yeni-harita .harita-alt{text-align:center;font:italic 13px Alegreya,serif;color:#6b5434;margin:0 0 2px}
.yeni-harita .yol{stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;fill:none;stroke-dasharray:none}
.yeni-harita .yol.yeni{animation:mur-ciz 1.1s ease-out both;stroke-dasharray:1;stroke-dashoffset:1}
@keyframes mur-ciz{to{stroke-dashoffset:0}}
.yeni-harita .oda .kutu{fill:#f3e6c4;stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round}

<script>
/* Yedinci Kat motoru — zar modülü.
 * Tarayıcıda window.YK.Zar, Node'da require('./zar') olarak kullanılır.
 * Zar nesnesi tek bir şey yapar: at() → 1..6. Testler sabit zar verir,
 * oyun rastgele zar kullanır; motor hangisi olduğunu bilmez.
 */
(function (kok) {
  'use strict';

  // Tohumlu, tekrarlanabilir rastgele sayı üreteci (mulberry32).
  function mulberry32(tohum) {
    let a = tohum >>> 0;
    return function () {
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /** Gerçek oyun zarı. Tohum verilirse aynı oyun tekrar oynatılabilir. */
  function rastgeleZar(tohum) {
    const r = tohum == null ? Math.random : mulberry32(tohum);
    return { at: (yuz = 6) => 1 + Math.floor(r() * yuz) };
  }

  /** Test zarı: verilen değerleri sırayla döndürür, biterse hata verir. */
  function sabitZar(dizi) {
    let i = 0;
    return {
      at(yuz = 6) {
        if (i >= dizi.length) throw new Error('Sabit zar bitti (' + dizi.length + ' atış verilmişti)');
        const v = dizi[i++];
        if (!(v >= 1 && v <= yuz)) throw new Error('Geçersiz zar değeri: ' + v + ' (' + yuz + ' yüzlü)');
        return v;
      },
      kalan: () => dizi.length - i,
    };
  }

  /** Test zarı: verilen değerleri sonsuza kadar döngüyle döndürür. */
  function donguZar(dizi) {
    let i = 0;
    return { at: () => dizi[i++ % dizi.length] };
  }

  /** Test zarı: 'max' / 'min' kalıbını döngüyle döndürür; zarın yüz sayısına uyar. */
  function kalipZar(kalip) {
    let i = 0;
    return { at: (yuz = 6) => (kalip[i++ % kalip.length] === 'max' ? yuz : 1) };
  }

  const YUZLER = [4, 6, 8, 10, 12, 20];

  /** Test zarı: her atışın etiketine göre 'max' ya da 'min' döndürür.
   *  Etiketler: sinama, oyuncu, oyuncuHasar, dusman, dusmanHasar, iksir, buyu, altin. */
  function rolZar(politika, varsayilan = 'max') {
    return { at: (yuz = 6, etiket) => ((politika[etiket] || varsayilan) === 'max' ? yuz : 1) };
  }

  /** "2d6", "1d20", "1d4+2" gibi bir ifadeyi çözer. */
  function ifadeCoz(ifade) {
    const m = /^(\d+)d(\d+)([+-]\d+)?$/.exec(ifade);
    if (!m || +m[1] < 1 || !YUZLER.includes(+m[2])) throw new Error('Geçersiz zar ifadesi: ' + ifade);
    return { adet: +m[1], yuz: +m[2], ek: m[3] ? +m[3] : 0 };
  }

  /** İfadeyi atar ve ekiyle birlikte toplar: {ifade, adet, yuz, ek, zarlar, toplam}. */
  function ifadeAt(zar, ifade, etiket) {
    const c = ifadeCoz(ifade);
    const zarlar = Array.from({ length: c.adet }, () => zar.at(c.yuz, etiket));
    return Object.assign({ ifade, zarlar, toplam: zarlar.reduce((a, b) => a + b, 0) + c.ek }, c);
  }

  /** Okunur ad: "1d8" → "8 yüzlü", "2d6" → "2 × 6 yüzlü", "1d4+2" → "4 yüzlü + 2". */
  function ifadeAdi(ifade) {
    const c = ifadeCoz(ifade);
    return (c.adet > 1 ? c.adet + ' × ' : '') + c.yuz + ' yüzlü' + (c.ek ? (c.ek > 0 ? ' + ' : ' − ') + Math.abs(c.ek) : '');
  }

  /** En düşük ve en yüksek sonuç. */
  function aralik(ifade) {
    const c = ifadeCoz(ifade);
    return [c.adet + c.ek, c.adet * c.yuz + c.ek];
  }

  /** İfadeye göre zarları atar, tek tek değerleri döndürür. */
  function at(zar, ifade) {
    const { adet, yuz } = ifadeCoz(ifade);
    return Array.from({ length: adet }, () => zar.at(yuz));
  }

  function ikiZar(zar) {
    return at(zar, '2d6');
  }

  const Zar = { YUZLER, rastgeleZar, sabitZar, donguZar, kalipZar, rolZar, ifadeCoz, ifadeAt, ifadeAdi, aralik, at, ikiZar };

  if (typeof module === 'object' && module.exports) module.exports = Zar;
  else { kok.YK = kok.YK || {}; kok.YK.Zar = Zar; }
})(typeof globalThis !== 'undefined' ? globalThis : this);

<script>
/* Yedinci Kat motoru — kurallar ve durum makinesi (masa başı düzeni, v0.4).
 *
 * Kurallar:
 *  - Sınama: 20 yüzlü + özellik ≥ zorluk (kolay 10, orta 13, zor 16).
 *  - Saldırı: 20 yüzlü + saldırı özelliği ≥ savunanın Zırh'ı → isabet.
 *    Doğal 20 (Hırsızda 19–20) kritik: kesin isabet, hasar zarları iki kez. Doğal 1 kesin ıska.
 *  - Hasar: silah zarı + saldırı özelliği (en az 1).
 *  - Tur: önce oyuncu davranır (saldır / iksir / Ateş Oku / kaç), sonra rakip saldırır.
 *    Rakip o tur düşerse saldıramaz.

      simsek: { akil: 5, hak: 2, zar: '3d6' },         // 3 zar + Akıl hasar, kesin isabet

  function isabetOlasiligi(bonus, zirh, kritikEsigi) {
    let n = 0;
    for (let d = 2; d <= 20; d++) if (d >= (kritikEsigi || KURAL.kritikEsigi) || d + bonus >= zirh) n++;
    return n / 20;
  }

  // ───────────────────────── Oyun kurulumu ─────────────────────────

  function yeniOyun(kitap, sinifId, ad) {
    const sinif = kitap.siniflar[sinifId];
    if (!sinif) throw new Error('Bilinmeyen sınıf: ' + sinifId);
    const s = {
      kitap: kitap.id,
      ad: (ad || '').trim() || 'Gezgin',
      sinif: sinifId,
      ozellik: { guc: sinif.guc, ceviklik: sinif.ceviklik, akil: sinif.akil },
      zirh: sinif.zirh,
      can: sinif.can,
      maxCan: sinif.can,
      altin: sinif.altin || 0,
      esyalar: Object.assign({}, kitap.baslangicEsyalari || {}, sinif.esyalar || {}),
      buyuHakki: sinif.buyuHakki || 0,
      buyuHakkiEnFazla: sinif.buyuHakki || 0,
      sans: KURAL.sansHakki,
      sayaclar: Object.fromEntries(Object.entries(kitap.sayaclar || {}).map(([k, v]) => [k, v.baslangic || 0])),
      bayraklar: {},
      dugum: null,
      ziyaret: [],
      gecisler: [],
      not: null,
      zarNotu: null,
      bekleyen: null,
      dovus: null,
      son: null,
    };
    git(kitap, s, kitap.baslangic, null);
    return s;
  }

  function dugum(kitap, s) {
    return kitap.dugumler[s.dugum];
  }

  // ───────────────────────── Koşul ve etki ─────────────────────────

  /** {tamam, gizli, neden} — sınıf/bayrak koşulu tutmazsa seçenek hiç görünmez;
   *  eşya/altın/büyü eksikse görünür ama kilitli olur. */
  function kosulSaglaniyor(kitap, s, k) {
    if (!k) return { tamam: true };
    // "degil": içteki koşul tamamen tutuyorsa seçenek gizlenir (ör. bir tehlike varken olağan seçenekler).
    if (k.degil && kosulSaglaniyor(kitap, s, k.degil).tamam) return { tamam: false, gizli: true };
    if (k.sinif && !liste(k.sinif).includes(s.sinif)) return { tamam: false, gizli: true };
    // bayrak koşulu tutmazsa seçenek gizlenir; koşulda "neden" yazılıysa görünür ama kilitli olur.
    for (const b of liste(k.bayrak)) if (!s.bayraklar[b]) return k.neden ? { tamam: false, neden: k.neden } : { tamam: false, gizli: true };
    for (const b of liste(k.bayrakYok)) if (s.bayraklar[b]) return { tamam: false, gizli: true };
    for (const e of liste(k.esya)) {
      if (!(s.esyalar[e] > 0)) {
        const ad = (kitap.esyalar && kitap.esyalar[e] && kitap.esyalar[e].ad) || e;
        return { tamam: false, neden: ad + ' gerekir' };
      }
    }
    // Eşya sayısı (ör. Halvard'ın üç sayfası): tutmazsa gizlenir.
    for (const [e, n] of Object.entries(k.esyaEnAz || {})) if (!((s.esyalar[e] || 0) >= n)) return { tamam: false, gizli: true };
    for (const [e, n] of Object.entries(k.esyaEnFazla || {})) if ((s.esyalar[e] || 0) > n) return { tamam: false, gizli: true };
    if (k.altin && s.altin < k.altin) return { tamam: false, neden: k.altin + ' altın gerekir' };
    if (k.buyu && s.buyuHakki < k.buyu) return { tamam: false, neden: 'Büyü hakkın kalmadı' };
    // Sayaç koşulları (ör. Mürekkep): tutmazsa gizlenir; "neden" yazılıysa kilitli görünür.
    const sayacDegeri = (ad) => (s.sayaclar && s.sayaclar[ad]) || 0;
    for (const [ad, n] of Object.entries(k.sayacEnAz || {})) if (sayacDegeri(ad) < n) return k.neden ? { tamam: false, neden: k.neden } : { tamam: false, gizli: true };
    for (const [ad, n] of Object.entries(k.sayacEnFazla || {})) if (sayacDegeri(ad) > n) return k.neden ? { tamam: false, neden: k.neden } : { tamam: false, gizli: true };
    // ozellikEnAz: tutmazsa gizlenir (ör. gelişimin "Çeviklik 4'e çıkınca Zırh +1" sürümü)
    for (const [oz, n] of Object.entries(k.ozellikEnAz || {})) if ((s.ozellik[oz] || 0) < n) return { tamam: false, gizli: true };
    for (const [oz, enFazla] of Object.entries(k.ozellikEnFazla || {})) {
      if (s.ozellik[oz] > enFazla) return { tamam: false, neden: OZELLIK_ADLARI[oz] + ' en üst seviyede (' + s.ozellik[oz] + ')' };
    }
    return { tamam: true };
  }

  /** Etkiyi uygular. Altın zarı (altinZar) için zar gerekir; verilmezse sabit altin kullanılır. */
  function etkiUygula(s, e, zar, kitap) {
    if (!e) return;
    if (e.sayac) {
      s.sayaclar = s.sayaclar || {};
      for (const [ad, n] of Object.entries(e.sayac)) {
        const tanim = kitap && kitap.sayaclar && kitap.sayaclar[ad];
        const enFazla = tanim && tanim.enFazla != null ? tanim.enFazla : Infinity;
        s.sayaclar[ad] = Math.max(0, Math.min(enFazla, (s.sayaclar[ad] || 0) + n));
      }
    }
    if (e.can) s.can = Math.min(s.maxCan, s.can + e.can);
    if (e.altin || e.altinZar) {
      const atis = e.altinZar && zar ? Zar.ifadeAt(zar, e.altinZar, 'altin') : null;
      const deger = atis ? atis.toplam : e.altin || 0;
      s.altin = Math.max(0, s.altin + deger);
      if (deger > 0) s.zarNotu = { neden: 'altin', deger, atis };
    }
    if (e.buyu) s.buyuHakki = Math.max(0, s.buyuHakki + e.buyu);
    // Dinlenme: büyü hakları sınıfın başlangıç sayısına döner (büyüsü olmayan sınıfta etkisiz).
    if (e.buyuYenile && s.buyuHakkiEnFazla) s.buyuHakki = s.buyuHakkiEnFazla;
    // Kalıcı fazladan büyü hakkı (ör. Akıl 5'e çıkan Büyücü)
    if (e.buyuEnFazla) { s.buyuHakkiEnFazla += e.buyuEnFazla; s.buyuHakki += e.buyuEnFazla; }
    // Kalıcı gelişimler
    for (const [oz, n] of Object.entries(e.ozellik || {})) s.ozellik[oz] = Math.min(KURAL.ozellikSiniri, s.ozellik[oz] + n);
    if (e.zirh) s.zirh += e.zirh;
    // Silahın kalıcı hasar eki (ör. demircinin dövmesi)
    if (e.silahEki) s.silahEki = (s.silahEki || 0) + e.silahEki;
    if (e.maxCan) { s.maxCan += e.maxCan; s.can += e.maxCan; }
    if (e.esya) for (const k of Object.keys(e.esya)) s.esyalar[k] = Math.max(0, (s.esyalar[k] || 0) + e.esya[k]);
    for (const b of liste(e.bayrak)) s.bayraklar[b] = true;
  }

  // ───────────────────────── Hareket ─────────────────────────

  function git(kitap, s, hedef, not) {
    if (s.can <= 0) hedef = kitap.olumDugumu;
    const d = kitap.dugumler[hedef];
    if (!d) throw new Error('Kitapta olmayan düğüm: ' + hedef);
    const onceki = s.dugum;
    s.dugum = hedef;
    s.not = not || null;
    if (!s.ziyaret.includes(hedef)) s.ziyaret.push(hedef);
    if (onceki && onceki !== hedef) {
      const g = onceki + '>' + hedef;
      if (!s.gecisler.includes(g)) s.gecisler.push(g);
    }
    // Her düğüme ilk girişte "_giris_<düğüm>" bayrağı konur (koşullarda "bu odaya girildi mi" diye sorulabilir);
    // düğümün giriş etkisi de yalnızca ilk girişte uygulanır.
    const girisBayragi = '_giris_' + hedef;
    const ilkGiris = !s.bayraklar[girisBayragi];
    s.bayraklar[girisBayragi] = true;
    if (d.giris && ilkGiris) {
      etkiUygula(s, d.giris, null, kitap);
      if (s.can <= 0 && !d.son) return git(kitap, s, kitap.olumDugumu, s.not);
    }
    s.son = d.son ? Object.assign({}, d.son, { dugum: hedef }) : null;
  }

  // ───────────────────────── Seçenekler ─────────────────────────

  /** "hatirla": düz metin her zaman görünür; {metin, bayrak} biçimi yalnızca bayraklar konmuşsa görünür. */
  function hatirlaMetni(s, h) {
    if (!h) return null;
    if (typeof h === 'string') return h;
    return liste(h.bayrak).every((b) => s.bayraklar[b]) ? h.metin : null;
  }

  function secenekler(kitap, s) {
    if (s.son || s.bekleyen || s.dovus) return [];
    const d = dugum(kitap, s);
    const sonuc = [];
    (d.secenekler || []).forEach((sec, i) => {
      const k = kosulSaglaniyor(kitap, s, sec.kosul);
      if (k.gizli) return;
      sonuc.push({
        indeks: i,
        metin: sec.metin,
        aktif: k.tamam,
        neden: k.neden || null,
        tur: sec.sinama ? 'sinama' : sec.dovus ? 'dovus' : 'git',
        sinama: sec.sinama
          ? {
              ozellik: sec.sinama.ozellik,
              ozellikAdi: OZELLIK_ADLARI[sec.sinama.ozellik],
              zorluk: sec.sinama.zorluk,
              beceri: sec.sinama.beceri || null,
              ustalik: sinamaUstaMi(kitap, s, sec.sinama),
              olasilik: basariOlasiligi(s.ozellik[sec.sinama.ozellik], sec.sinama.zorluk, sinamaUstaMi(kitap, s, sec.sinama)),
            }
          : null,
        ozel: sec.kosul && sec.kosul.sinif ? liste(sec.kosul.sinif) : null,
        gelisim: !!sec.gelisim,
        // Geçmişte verilen bir kararın burada karşılık bulduğunu okura hatırlatır (yalnızca arayüz için).
        hatirla: hatirlaMetni(s, sec.hatirla),
        sayac: sec.etki && sec.etki.sayac ? Object.assign({}, sec.etki.sayac) : null,
      });
    });
    return sonuc;
  }

  function sec(kitap, s0, indeks, zar) {
    const s = kopyala(s0);
    if (s.son || s.bekleyen || s.dovus) throw new Error('Şu an seçim yapılamaz');
    const secenek = (dugum(kitap, s).secenekler || [])[indeks];
    if (!secenek) throw new Error('Böyle bir seçenek yok: ' + indeks);
    const k = kosulSaglaniyor(kitap, s, secenek.kosul);
    if (!k.tamam) throw new Error('Seçenek kullanılamaz: ' + (k.neden || 'koşul tutmuyor'));

    s.zarNotu = null;
    etkiUygula(s, secenek.etki, zar, kitap);
    if (s.can <= 0) { git(kitap, s, kitap.olumDugumu, secenek.not); return s; }

    if (secenek.sinama) {
      s.bekleyen = Object.assign(sinamaAt(s, secenek.sinama.ozellik, secenek.sinama.zorluk, zar, sinamaUstaMi(kitap, s, secenek.sinama)), {
        tip: 'sinama',
        kaynak: { dugum: s.dugum, indeks },
      });
      return s;
    }
    if (secenek.dovus) { dovusBaslat(kitap, s, secenek.dovus); s.not = secenek.not || null; return s; }
    // sinifNot: seçeneğin notuna sınıfa özel bir ek (ör. büyücünün büyüleri yenilendi)
    const ek = secenek.sinifNot && secenek.sinifNot[s.sinif];
    git(kitap, s, secenek.git, ek ? (secenek.not ? secenek.not + ' ' : '') + ek : secenek.not);
    return s;
  }

  // ───────────────────────── Sınama ─────────────────────────

  function sinamaAt(s, ozellik, zorluk, zar, ustalik) {
    // Ustalıkta iki zar atılır, yükseği sayılır. zarlar her iki zarı da tutar (ekranda gösterilir).
    const zarlar = ustalik ? [d20(zar, 'sinama'), d20(zar, 'sinama')] : [d20(zar, 'sinama')];
    const zarDegeri = Math.max(...zarlar);
    const deger = s.ozellik[ozellik];
    const toplam = zarDegeri + deger;
    const basari = toplam >= zorluk;
    return {
      ozellik,
      ozellikAdi: OZELLIK_ADLARI[ozellik],
      zorluk,
      zar: zarDegeri,
      zarlar,
      ustalik: !!ustalik,
      deger,
      toplam,
      basari,
      sansUygun: !basari && s.sans > 0,
    };
  }

  // ───────────────────────── Dövüş ─────────────────────────

  /** Kopya düşman: oyuncunun saldırısı, silahı ve Zırh'ı; özel yetenekleri (kalkan, büyü, iksir, Şans) yok.
   *  kopya.canOrani ve kopya.zirhFarki ile biraz zayıflatılabilir (bir yansıma). */
  function kopyaDusman(kitap, s, d) {
    const c = kitap.siniflar[s.sinif];
    const k = d.kopya === true ? {} : d.kopya;
    const bonus = s.ozellik[c.saldiriOzelligi];
    return Object.assign({}, d, {
      can: Math.max(1, Math.round(s.maxCan * (k.canOrani || 1))),
      zirh: s.zirh + (k.zirhFarki || 0),
      saldiri: bonus,
      silah: (d.silah || 'Yansıyan ') + c.silah.toLocaleLowerCase('tr'),
      hasarZari: c.hasarZari,
      hasarEki: bonus,
    });
  }

  /** Dövüşte yanında olan yoldaş (kitap.muttefikler): koşulu tutan ilki. dv.muttefikYok ile kapatılır (ör. yoldaşın kendisiyle dövüş). */
  function muttefikBul(kitap, s, dv) {
    if (dv.muttefikYok) return null;
    const m = (kitap.muttefikler || []).find((x) => kosulSaglaniyor(kitap, s, x.kosul || {}).tamam);
    return m ? { ad: m.ad, silah: m.silah, saldiri: m.saldiri, hasarZari: m.hasarZari, hasarEki: m.hasarEki || 0 } : null;
  }

  function dovusBaslat(kitap, s, dv) {
    const sinif = kitap.siniflar[s.sinif];
    const dusman = dv.dusman.kopya ? kopyaDusman(kitap, s, dv.dusman) : Object.assign({}, dv.dusman);
    s.dovus = {
      dusman,
      dusmanCan: dusman.can,
      tur: 0,
      kalkan: sinif.kalkan || 0,
      zafer: dv.zafer,
      zaferNot: dv.zaferNot || null,
      zaferEtki: dv.zaferEtki || null,
      kacis: dv.kacis || null,
      kacisNot: dv.kacisNot || null,
      kacisZorlugu: dv.kacisZorlugu || KURAL.kacisZorlugu,
      // Pusu: dövüş fark edilmeden başladıysa ve sınıfın "sinsi ilk vuruş"u varsa ilk saldırı kesin kritiktir,
      // şaşıran rakip o tur saldıramaz.
      // pusuHerkes: fırsat sınıfa özel değil (ör. rakibin zayıflığını fark ettiysen herkes yararlanır)
      pusu: !!(dv.pusu && (sinif.sinsiIlkVurus || dv.pusuHerkes)),
      ekZirh: 0, // Kalkan Hecesi gibi dövüşe özel Zırh artışı
      muttefik: muttefikBul(kitap, s, dv), // yanındaki yoldaş: senden sonra, rakipten önce vurur
      kayit: [],
    };
  }

  function dovusEylemleri(kitap, s) {
    if (!s.dovus || s.bekleyen || s.son) return [];
    const sinif = kitap.siniflar[s.sinif];
    const dm = s.dovus.dusman;
    const e = [{
      id: 'saldir',
      ad: (s.dovus.pusu ? 'Sinsi ilk vuruş (' : 'Saldır (') + sinif.silah + ')',
      aktif: true,
      olasilik: s.dovus.pusu ? 1 : isabetOlasiligi(s.ozellik[sinif.saldiriOzelligi], dm.zirh, sinif.kritikEsigi),
      pusu: s.dovus.pusu,
    }];
    e.push({
      id: 'iksir',
      ad: 'İksir iç (' + Zar.ifadeAdi(KURAL.iksirZari) + ' Can)',
      aktif: (s.esyalar.iksir || 0) > 0 && s.can < s.maxCan,
      neden: !(s.esyalar.iksir > 0) ? 'İksirin yok' : s.can >= s.maxCan ? 'Canın dolu' : null,
    });
    if (sinif.buyuHakki) {
      e.push({
        id: 'buyu',
        ad: 'Ateş Oku (' + Zar.ifadeAdi(KURAL.buyuZari) + ' + Akıl ' + (s.ozellik.akil || 0) + ', kesin isabet)',
        aktif: s.buyuHakki > 0,
        neden: s.buyuHakki > 0 ? null : 'Büyü hakkın kalmadı',
      });
      e.push({
        id: 'hece',
        ad: 'Kalkan Hecesi (bu dövüşte Zırh +' + KURAL.heceZirhi + ')',
        aktif: s.buyuHakki > 0 && !s.dovus.ekZirh,
        neden: s.dovus.ekZirh ? 'Hece zaten etkin' : s.buyuHakki > 0 ? null : 'Büyü hakkın kalmadı',
      });
      // Akıl'la açılan büyüler: eşiğin altındayken kilitli görünür ("Akıl 4'te açılır")
      const akil = s.ozellik.akil || 0, IB = KURAL.ileriBuyuler;
      const ileri = (id, ad, ek) => {
        const t = IB[id], acik = akil >= t.akil, hakVar = s.buyuHakki >= t.hak;
        const engel = !acik ? 'Akıl ' + t.akil + '’te açılır' : !hakVar ? (t.hak > 1 ? t.hak + ' büyü hakkı gerekir' : 'Büyü hakkın kalmadı') : ek ? ek() : null;
        e.push({ id, ad: ad + (t.hak > 1 ? ' · ' + t.hak + ' büyü hakkı' : ''), aktif: !engel, neden: engel, ileri: true });
      };
      ileri('baglama', 'Bağlama Hecesi (rakip bu tur saldıramaz)');
      ileri('sifa', 'Şifa Hecesi (' + Zar.ifadeAdi(IB.sifa.zar) + ' Can)', () => (s.can >= s.maxCan ? 'Canın dolu' : null));
      ileri('simsek', 'Şimşek (' + Zar.ifadeAdi(IB.simsek.zar) + ' + Akıl ' + akil + ', kesin isabet)');
      ileri('zayiflatma', 'Zayıflatma (rakibin Zırhı bu dövüşte −' + IB.zayiflatma.zirh + ')', () => (s.dovus.zayif ? 'Rakip zaten zayıf' : null));
    }
    if (s.dovus.kacis) {
      e.push({ id: 'kac', ad: 'Kaç', aktif: true, olasilik: basariOlasiligi(s.ozellik.ceviklik, s.dovus.kacisZorlugu) });
    }
    return e;
  }

  /** Bir saldırı atışı: 20 yüzlü + bonus, Zırh'a karşı; isabetse hasar zarı (kritikte iki kat zar). */
  function saldiriAt(zar, o) {
    const nat = d20(zar, o.kim);
    const kritik = o.sinsi || nat >= o.kritikEsigi;
    const isabet = o.sinsi || (nat !== 1 && (kritik || nat + o.bonus >= o.zirh));
    const r = { kim: o.kim, nat, bonus: o.bonus, toplam: nat + o.bonus, zirh: o.zirh, isabet, kritik: isabet && kritik, sinsi: !!o.sinsi, kalkanla: false, hasar: 0, hasarAtisi: null, silah: o.silah };
    if (!isabet) return r;
    if (o.kalkan) { r.kalkanla = true; return r; } // kalkan savuşturur: hasar zarı atılmaz
    const c = Zar.ifadeCoz(o.hasarZari);
    const ifade = (r.kritik ? c.adet * 2 : c.adet) + 'd' + c.yuz + (c.ek ? (c.ek > 0 ? '+' : '') + c.ek : '');
    const atis = Zar.ifadeAt(zar, ifade, o.kim + 'Hasar');
    atis.ozellikEki = o.hasarEki || 0;
    r.hasarAtisi = atis;
    r.hasar = Math.max(1, atis.toplam + atis.ozellikEki);
    return r;
  }

  function oyuncuSaldirisi(kitap, s, zar, sinsi) {
    const sinif = kitap.siniflar[s.sinif];
    const bonus = s.ozellik[sinif.saldiriOzelligi];
    return saldiriAt(zar, {
      kim: 'oyuncu', bonus, zirh: s.dovus.dusman.zirh, sinsi: !!sinsi,
      kritikEsigi: sinif.kritikEsigi || KURAL.kritikEsigi,
      hasarZari: sinif.hasarZari, hasarEki: bonus + (s.silahEki || 0), silah: sinif.silah,
    });
  }

  function muttefikSaldirisi(s, zar) {
    const m = s.dovus.muttefik;
    return saldiriAt(zar, {
      kim: 'muttefik', bonus: m.saldiri, zirh: s.dovus.dusman.zirh,
      kritikEsigi: KURAL.kritikEsigi, hasarZari: m.hasarZari, hasarEki: m.hasarEki, silah: m.silah,
    });
  }

  /** Ateş Oku: kesin isabet; hasar 2 zar + Akıl. */
  function buyuAt(s, zar) {
    const a = Zar.ifadeAt(zar, KURAL.buyuZari, 'buyu');
    a.ozellikEki = s.ozellik.akil || 0;
    a.hasar = a.toplam + a.ozellikEki;
    return a;
  }

  function dusmanSaldirisi(s, zar) {
    const dm = s.dovus.dusman;
    return saldiriAt(zar, {
      kim: 'dusman', bonus: dm.saldiri, zirh: s.zirh + (s.dovus.ekZirh || 0),
      kritikEsigi: KURAL.kritikEsigi,
      hasarZari: dm.hasarZari, hasarEki: dm.hasarEki || 0, silah: dm.silah,
      kalkan: s.dovus.kalkan > 0,
    });
  }

  function dovusEylem(kitap, s0, eylem, zar) {
    const s = kopyala(s0);
    if (!s.dovus || s.bekleyen) throw new Error('Şu an dövüş eylemi yapılamaz');
    const e = dovusEylemleri(kitap, s).find((x) => x.id === eylem);
    if (!e || !e.aktif) throw new Error('Eylem kullanılamaz: ' + eylem);
    s.dovus.tur++;

    const b = { tip: 'tur', eylem, oyuncu: null, buyu: null, iksir: null, kacis: null, dusman: null, sansUygun: false, pusu: false };
    let verilen = 0;
    // Pusu yalnızca ilk eylemde işe yarar; ilk eylem saldırı değilse kaçırılmış olur.
    const pusu = s.dovus.pusu;
    s.dovus.pusu = false;
    if (eylem === 'saldir') {
      b.oyuncu = oyuncuSaldirisi(kitap, s, zar, pusu);
      b.pusu = pusu;
      verilen = b.oyuncu.hasar;
      b.sansUygun = !b.oyuncu.isabet && s.sans > 0;
    } else if (eylem === 'buyu') {
      s.buyuHakki--;
      b.buyu = buyuAt(s, zar);
      verilen = b.buyu.hasar;
    } else if (eylem === 'hece') {
      s.buyuHakki--;
      s.dovus.ekZirh = KURAL.heceZirhi;
      b.hece = KURAL.heceZirhi;
    } else if (eylem === 'baglama') {
      s.buyuHakki -= KURAL.ileriBuyuler.baglama.hak;
      b.baglama = true;
    } else if (eylem === 'sifa') {
      s.buyuHakki -= KURAL.ileriBuyuler.sifa.hak;
      const atis = Zar.ifadeAt(zar, KURAL.ileriBuyuler.sifa.zar, 'sifa');
      const once = s.can;
      s.can = Math.min(s.maxCan, s.can + atis.toplam);
      b.sifa = { atis, iyilesme: s.can - once };
    } else if (eylem === 'simsek') {
      s.buyuHakki -= KURAL.ileriBuyuler.simsek.hak;
      const a = Zar.ifadeAt(zar, KURAL.ileriBuyuler.simsek.zar, 'simsek');
      a.ozellikEki = s.ozellik.akil || 0;
      a.hasar = a.toplam + a.ozellikEki;
      b.simsek = a;
      verilen = a.hasar;
    } else if (eylem === 'zayiflatma') {
      s.buyuHakki -= KURAL.ileriBuyuler.zayiflatma.hak;
      s.dovus.zayif = KURAL.ileriBuyuler.zayiflatma.zirh;
      s.dovus.dusman.zirh -= s.dovus.zayif;
      b.zayiflatma = s.dovus.zayif;
    } else if (eylem === 'iksir') {
      s.esyalar.iksir--;
      const atis = Zar.ifadeAt(zar, KURAL.iksirZari, 'iksir');
      const once = s.can;
      s.can = Math.min(s.maxCan, s.can + atis.toplam);
      b.iksir = { atis, iyilesme: s.can - once };
    } else if (eylem === 'kac') {
      b.kacis = sinamaAt(s, 'ceviklik', s.dovus.kacisZorlugu, zar);
      b.sansUygun = b.kacis.sansUygun;
    }
    const kacti = b.kacis && b.kacis.basari;
    // Yoldaş: rakip hâlâ ayaktaysa ve kaçmadıysan o da vurur.
    if (s.dovus.muttefik && !kacti && verilen < s.dovus.dusmanCan) {
      b.muttefik = muttefikSaldirisi(s, zar);
      b.muttefikAd = s.dovus.muttefik.ad;
      verilen += b.muttefik.hasar;
    }
    // Rakip, düşmediyse ve sen kaçmadıysan saldırır.
    const dustu = verilen >= s.dovus.dusmanCan;
    const sasirdi = b.pusu || b.baglama; // pusuya düşen ya da bağlanan rakip o tur saldıramaz
    if (!dustu && !kacti && !sasirdi) b.dusman = dusmanSaldirisi(s, zar);
    s.bekleyen = b;
    return s;
  }

  function dovusKontrol(kitap, s) {
    const dv = s.dovus;
    if (dv.dusmanCan <= 0) { s.dovus = null; etkiUygula(s, dv.zaferEtki, null, kitap); git(kitap, s, dv.zafer, dv.zaferNot || dv.dusman.ad + ' yere yığıldı.'); return; }
    if (s.can <= 0) { s.dovus = null; git(kitap, s, kitap.olumDugumu, dv.dusman.ad + ' son darbeyi indirdi.'); }
  }

  function mAd(b) { return b.muttefikAd || 'Yoldaşın'; }
  function turOzeti(b, dm) {
    const p = [];
    if (b.oyuncu) p.push(b.oyuncu.isabet ? (b.oyuncu.sinsi ? 'Sinsi ilk vuruş! ' : b.oyuncu.kritik ? 'Kritik! ' : '') + 'Rakibine ' + b.oyuncu.hasar + ' hasar verdin.' : 'Iskaladın.');
    if (b.buyu) p.push('Ateş Oku ' + b.buyu.hasar + ' hasar verdi.');
    if (b.simsek) p.push('Şimşek ' + b.simsek.hasar + ' hasar verdi.');
    if (b.baglama) p.push('Bağlama Hecesi: ' + dm.ad + ' bu tur kıpırdayamadı.');
    if (b.sifa) p.push('Şifa Hecesi ' + b.sifa.iyilesme + ' Can verdi.');
    if (b.zayiflatma) p.push('Zayıflatma: rakibin Zırhı −' + b.zayiflatma + '.');
    if (b.muttefik) p.push(b.muttefik.isabet ? (b.muttefik.kritik ? 'Kritik! ' : '') + mAd(b) + ' ' + b.muttefik.hasar + ' hasar verdi.' : mAd(b) + ' ıskaladı.');
    if (b.iksir) p.push('İksirle ' + b.iksir.iyilesme + ' Can kazandın.');
    if (b.hece) p.push('Kalkan Hecesi: Zırhın bu dövüşte +' + b.hece + '.');
    if (b.kacis) p.push(b.kacis.basari ? 'Kaçtın.' : 'Kaçamadın.');
    if (b.dusman) p.push(!b.dusman.isabet ? dm.ad + ' ıskaladı.' : b.dusman.kalkanla ? 'Kalkanın darbeyi savuşturdu.' : (b.dusman.kritik ? 'Kritik! ' : '') + b.dusman.hasar + ' hasar aldın.');
    return p.join(' ');
  }

  // ───────────────────────── Bekleyen olayı sonuçlandırma ─────────────────────────

  /** Bekleyen olayı uygular. zar: sınama ödülündeki altın zarı için (verilmezse sabit altın). */
  function devam(kitap, s0, zar) {
    const s = kopyala(s0);
    const b = s.bekleyen;
    if (!b) throw new Error('Bekleyen zar yok');
    s.bekleyen = null;
    s.zarNotu = null;

    if (b.tip === 'sinama') {
      const sn = kitap.dugumler[b.kaynak.dugum].secenekler[b.kaynak.indeks].sinama;
      if (b.basari) { etkiUygula(s, sn.basariEtki, zar, kitap); git(kitap, s, sn.basari, sn.basariNot); }
      else { etkiUygula(s, sn.basarisizlikEtki, zar, kitap); git(kitap, s, sn.basarisizlik, sn.basarisizlikNot); }
      if (s.can <= 0 && !s.son) git(kitap, s, kitap.olumDugumu, s.not);
      return s;
    }

    const dv = s.dovus;
    if (b.oyuncu) dv.dusmanCan -= b.oyuncu.hasar;
    if (b.buyu) dv.dusmanCan -= b.buyu.hasar;
    if (b.simsek) dv.dusmanCan -= b.simsek.hasar;
    if (b.muttefik) dv.dusmanCan -= b.muttefik.hasar;
    if (b.dusman && b.dusman.isabet) {
      if (b.dusman.kalkanla) dv.kalkan--;
      else s.can -= b.dusman.hasar;
    }
    dv.kayit.push(turOzeti(b, dv.dusman));
    if (b.kacis && b.kacis.basari) {
      const hedef = dv.kacis, not = dv.kacisNot;
      s.dovus = null;
      git(kitap, s, hedef, not || 'Kaçmayı başardın.');
      return s;
    }
    dovusKontrol(kitap, s);
    return s;
  }

  /** Şans: başarısız sınamayı, başarısız kaçışı ya da ıskalanan kendi saldırını yeniden atar. */
  function sansKullan(kitap, s0, zar) {
    const s = kopyala(s0);
    const b = s.bekleyen;
    if (!b || !b.sansUygun || s.sans <= 0) throw new Error('Şans kullanılamaz');
    s.sans--;
    let yeni;
    if (b.tip === 'sinama') {
      yeni = Object.assign({}, b, sinamaAt(s, b.ozellik, b.zorluk, zar, b.ustalik));
      yeni.onceki = { zar: b.zar, zarlar: b.zarlar };
    } else if (b.tip === 'tur' && b.oyuncu) {
      yeni = Object.assign({}, b, { oyuncu: oyuncuSaldirisi(kitap, s, zar) });
      yeni.onceki = { zar: b.oyuncu.nat };
      // Yeni vuruş rakibi düşürüyorsa yoldaş da rakip de vuramaz; yoldaşla birlikte düşürüyorsa rakip saldıramaz.
      if (yeni.oyuncu.hasar >= s.dovus.dusmanCan) { yeni.dusman = null; yeni.muttefik = null; }
      else if (yeni.muttefik && yeni.oyuncu.hasar + yeni.muttefik.hasar >= s.dovus.dusmanCan) yeni.dusman = null;
    } else if (b.tip === 'tur' && b.kacis) {
      yeni = Object.assign({}, b, { kacis: sinamaAt(s, 'ceviklik', b.kacis.zorluk, zar) });
      yeni.onceki = { zar: b.kacis.zar };
      if (yeni.kacis.basari) yeni.dusman = null;
    } else throw new Error('Bu olayda Şans kullanılamaz');
    yeni.sansUygun = false;
    yeni.sansKullanildi = true;
    s.bekleyen = yeni;
    return s;
  }

  // ───────────────────────── Dövüş dışında eşya kullanma ─────────────────────────

  /** Dövüş dışında kullanılabilen eşyalar: şimdilik yalnızca iksir. {aktif, neden} döndürür. */
  function esyaKullanilabilir(kitap, s, esya) {
    if (esya !== 'iksir') return { aktif: false, neden: 'Bu eşya burada kullanılmaz' };
    if (s.son || s.bekleyen || s.dovus) return { aktif: false, neden: 'Şu an olmaz' };
    if (!(s.esyalar.iksir > 0)) return { aktif: false, neden: 'İksirin yok' };
    if (s.can >= s.maxCan) return { aktif: false, neden: 'Canın dolu' };
    return { aktif: true };
  }

  function esyaKullan(kitap, s0, esya, zar) {
    const s = kopyala(s0);
    const k = esyaKullanilabilir(kitap, s, esya);
    if (!k.aktif) throw new Error('Eşya kullanılamaz: ' + k.neden);
    s.esyalar.iksir--;
    const atis = Zar.ifadeAt(zar, KURAL.iksirZari, 'iksir');
    const once = s.can;
    s.can = Math.min(s.maxCan, s.can + atis.toplam);
    s.zarNotu = { neden: 'iksir', deger: s.can - once, atis };
    return s;
  }

  // ───────────────────────── Yardımcılar ─────────────────────────

  /** Düğümde gösterilecek paragraflar: metin + koşulu tutan kosulluMetin + sınıfa özel paragraf. */
  /** Düğümün o anki görselinin aday listesi: "gorselKosullu" içinde koşulu tutan ilk giriş
   *  (görseli ve yedekleri), yoksa düğümün kendi görseli. Arayüz listedeki ilk var olan görseli gösterir. */
  function gorselAdaylari(kitap, s, d, id) {
    for (const g of d.gorselKosullu || []) {
      if (kosulSaglaniyor(kitap, s, g.kosul).tamam) return [g.gorsel].concat(liste(g.yedek));
    }
    return [d.gorsel || id];
  }

  function gorunenMetin(kitap, s, d) {
    d = d || dugum(kitap, s);
    const p = (d.metin || []).slice();
    for (const km of d.kosulluMetin || []) if (kosulSaglaniyor(kitap, s, km.kosul).tamam) p.push(...liste(km.metin));
    if (d.sinifMetni && d.sinifMetni[s.sinif]) p.push(d.sinifMetni[s.sinif]);
    return p;
  }

  function metinIsle(kitap, s, metin) {
    const sinif = kitap.siniflar[s.sinif];
    return String(metin).replace(/\{ad\}/g, s.ad).replace(/\{sinif\}/g, sinif ? sinif.ad : '');
  }

  /** Kitabı yazarken hataları yakalar. Boş dizi = sorun yok. */
  function kitapDogrula(kitap) {
    const h = [];
    const D = kitap.dugumler;
    const var_ = (id, yer) => { if (!D[id]) h.push(yer + ': "' + id + '" düğümü yok'); };
    const ifadeKontrol = (ifade, yer) => { if (ifade == null) return; try { Zar.ifadeCoz(ifade); } catch (e) { h.push(yer + ': ' + e.message); } };
    const etkiKontrol = (e, yer) => {
      if (!e) return;
      ifadeKontrol(e.altinZar, yer + ' altinZar');
      for (const oz of Object.keys(e.ozellik || {})) if (!OZELLIK_ADLARI[oz]) h.push(yer + ': bilinmeyen özellik ' + oz);
      for (const es of Object.keys(e.esya || {})) if (kitap.esyalar && !kitap.esyalar[es]) h.push(yer + ': kitapta tanımsız eşya ' + es);
      for (const ad of Object.keys(e.sayac || {})) if (!kitap.sayaclar || !kitap.sayaclar[ad]) h.push(yer + ': kitapta tanımsız sayaç ' + ad);
    };
    var_(kitap.baslangic, 'baslangic');
    var_(kitap.olumDugumu, 'olumDugumu');
    for (const [sid, c] of Object.entries(kitap.siniflar)) {
      for (const b of liste(c.ustalik)) if (!BECERILER[b]) h.push('sınıf ' + sid + ': bilinmeyen ustalık ' + b);
      if (!(c.zirh > 0)) h.push('sınıf ' + sid + ': zirh eksik');
      if (!c.hasarZari) h.push('sınıf ' + sid + ': hasarZari eksik');
      ifadeKontrol(c.hasarZari, 'sınıf ' + sid + ' hasarZari');
      if (!OZELLIK_ADLARI[c.saldiriOzelligi]) h.push('sınıf ' + sid + ': saldiriOzelligi geçersiz');
    }
    for (const [id, d] of Object.entries(D)) {
      const sc = d.secenekler || [];
      if (d.son && sc.length) h.push(id + ': son düğümde seçenek olmamalı');
      if (!d.son && !sc.length) h.push(id + ': son olmayan düğümde seçenek yok (çıkmaz)');
      if (!d.son && !d.harita) h.push(id + ': harita konumu yok');
      etkiKontrol(d.giris, id + ' giris');
      if (d.son && !d.son.tur) h.push(id + ': son türü eksik');
      for (const km of d.kosulluMetin || []) if (!km.kosul || !km.metin) h.push(id + ': kosulluMetin için kosul ve metin gerekir');
      sc.forEach((c, i) => {
        const yer = id + '#' + i;
        etkiKontrol(c.etki, yer);
        const turSayisi = ['git', 'sinama', 'dovus'].filter((t) => c[t]).length;
        if (turSayisi !== 1) h.push(yer + ': tam olarak bir tane git/sinama/dovus olmalı');
        if (c.git) var_(c.git, yer);
        if (c.sinama) {
          const sn = c.sinama;
          if (!OZELLIK_ADLARI[sn.ozellik]) h.push(yer + ': bilinmeyen özellik ' + sn.ozellik);
          if (!(sn.zorluk > 0)) h.push(yer + ': zorluk eksik');
          if (sn.beceri && !BECERILER[sn.beceri]) h.push(yer + ': bilinmeyen beceri ' + sn.beceri);
          var_(sn.basari, yer + ' basari');
          var_(sn.basarisizlik, yer + ' basarisizlik');
          etkiKontrol(sn.basariEtki, yer + ' basari');
          etkiKontrol(sn.basarisizlikEtki, yer + ' basarisizlik');
          // İki dal da 20 yüzlüyle gerçekten mümkün olmalı (1..20 + özellik).
          const uygun = c.kosul && c.kosul.sinif ? liste(c.kosul.sinif) : Object.keys(kitap.siniflar);
          for (const sid of uygun) {
            const deger = kitap.siniflar[sid][sn.ozellik];
            if (1 + deger >= sn.zorluk) h.push(yer + ': ' + sid + ' için başarısızlık imkânsız (zorluk ' + sn.zorluk + ')');
            if (20 + deger < sn.zorluk) h.push(yer + ': ' + sid + ' için başarı imkânsız (zorluk ' + sn.zorluk + ')');
          }
        }
        if (c.dovus) {
          var_(c.dovus.zafer, yer + ' zafer');
          if (c.dovus.kacis) var_(c.dovus.kacis, yer + ' kacis');
          etkiKontrol(c.dovus.zaferEtki, yer + ' zaferEtki');
          const dm = c.dovus.dusman || {};
          if (dm.kopya) { if (!dm.ad) h.push(yer + ': kopya düşmanın adı eksik'); }
          else if (!(dm.can > 0 && dm.zirh > 0 && dm.saldiri != null && dm.ad && dm.hasarZari)) h.push(yer + ': düşman tanımı eksik (ad, can, zirh, saldiri, hasarZari)');
          ifadeKontrol(dm.hasarZari, yer + ' düşman hasarZari');
        }
      });
    }
    return h;
  }

  const Motor = {
    KURAL, OZELLIK_ADLARI, BECERILER, basariOlasiligi, isabetOlasiligi, ustaMi,
    yeniOyun, dugum, secenekler, sec, devam, sansKullan,
    dovusEylemleri, dovusEylem, kosulSaglaniyor, gorunenMetin, gorselAdaylari, metinIsle, kitapDogrula,
    esyaKullanilabilir, esyaKullan,
  };

  if (typeof module === 'object' && module.exports) module.exports = Motor;
  else { kok.YK = kok.YK || {}; kok.YK.Motor = Motor; }
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script>
/* Yedinci Kat — kitabın kendisi. Kitap tamam: Kat 1–7 ve finaldeki sonlar.
 * Bütün adlar, canavarlar ve büyüler özgündür.
 *
 * Düğüm alanları:
 *   baslik, metin[], kosulluMetin[{kosul, metin}], sinifMetni{sinif: paragraf}, gorsel,
 *   harita{kat,x,y,etiket}, giris (ilk girişte etki), secenekler[], son{tur:'zafer'|'olum'|'notr', baslik}
 * Seçenek alanları:
 *   metin, kosul{sinif,esya,altin,buyu,bayrak,bayrakYok}, etki{can,altin,altinZar,esya,buyu,bayrak}, not,
 *   ve tam olarak biri: git | sinama{ozellik,zorluk,basari,basarisizlik,basariEtki,basarisizlikEtki,basariNot,basarisizlikNot}
 *                      | dovus{dusman{ad,can,zirh,saldiri,silah,hasarZari,hasarEki}, zafer, kacis, kacisZorlugu, zaferNot, kacisNot}
 * Kurallar: masa başı düzeni (motor/motor.js). Zorluklar: kolay 10, orta 13, zor 16.
 *
 * Gizem (okur en sonda öğrenir): Zindan, ejderha Kül'ü tutan bir hapishane. Mühür bir isimle tutar;
 * her kuşakta seçilen kişi yedinci odada adını kendi eliyle yazar. Rulo bir sonraki bekçiyi seçip adını
 * ıslak mürekkeple yazar. Kırk yıl önce seçilen Halvard'dı; kaçtı, mühür zayıfladı. Okurun şüphesi:
 * adları rulo değil, el yazısını taklit eden ejderha mı yazıyor? Corin'in haritası bu şüpheyi besler.
 */
(function (kok) {
  'use strict';

  /** Kat sonu gelişimi: dört seçenek, kat başına bir kez. Seçilince merdivende kalırsın. */
  // Kat sonu gelişimi. Özellikler dövüş dışında da işe yarar:
  //  Güç: her +1 Güç en yüksek Can'ı da +2 artırır (dayanıklılık).
  //  Çeviklik: 4'e ve 5'e çıkarken Zırh +1 (sıyrılma).
  //  Akıl: Ateş Oku'nun hasarına eklenir; Büyücü 5'e çıkarken +1 büyü hakkı kazanır.
  function gelisim(kat, dugumId, metinler) {
    const bayrak = 'gelisim_k' + kat;
    const not = (n) => 'Bu katın izi üstünde kaldı. (' + n + ', kalıcı)';
    const g = (metin, kosul, etki, etiket) => ({ metin: metin + ' (' + etiket + ')', kosul: Object.assign({ bayrakYok: bayrak }, kosul), etki: Object.assign({ bayrak }, etki), not: not(etiket), git: dugumId, gelisim: true });
    return [
      g(metinler.guc, { ozellikEnFazla: { guc: 4 } }, { ozellik: { guc: 1 }, maxCan: 2 }, '+1 Güç, +2 en yüksek Can'),
      g(metinler.ceviklik, { ozellikEnFazla: { ceviklik: 4 }, degil: { ozellikEnAz: { ceviklik: 3 } } }, { ozellik: { ceviklik: 1 } }, '+1 Çeviklik'),
      g(metinler.ceviklik, { ozellikEnFazla: { ceviklik: 4 }, ozellikEnAz: { ceviklik: 3 } }, { ozellik: { ceviklik: 1 }, zirh: 1 }, '+1 Çeviklik, +1 Zırh'),
      g(metinler.akil, { ozellikEnFazla: { akil: 4 }, degil: { sinif: 'buyucu', ozellikEnAz: { akil: 3 } } }, { ozellik: { akil: 1 } }, '+1 Akıl'),
      // Büyücü Akıl 4'te Bağlama ve Şifa Hecesi'ni, 5'te Şimşek ve Zayıflatma'yı öğrenir (motor: KURAL.ileriBuyuler)
      // Büyücü 2 Akıl'la başlar: Akıl 3 en erken 2. katın, Akıl 4 en erken 3. katın merdiveninde olur.
      ...(kat > 1 ? [g(metinler.akil, { sinif: 'buyucu', ozellikEnAz: { akil: 3 }, degil: { ozellikEnAz: { akil: 4 } } }, { ozellik: { akil: 1 } }, '+1 Akıl; yeni büyüler: Bağlama ve Şifa Hecesi')] : []),
      ...(kat > 2 ? [g(metinler.akil, { sinif: 'buyucu', ozellikEnFazla: { akil: 4 }, ozellikEnAz: { akil: 4 } }, { ozellik: { akil: 1 }, buyuEnFazla: 1 }, '+1 Akıl, +1 büyü hakkı; yeni büyüler: Şimşek ve Zayıflatma')] : []),
      g(metinler.can, {}, { maxCan: 3 }, '+3 en yüksek Can'),

  /** Halvard'ın kampı: böcekler yaklaşırken tek bir şeye vakit var; ruloya sorarsan (Mürekkep) bir şeye daha. */
  function kampSecimleri(secimler) {
    const sonuc = [];
    for (const c of secimler) {
      const ilk = Object.assign({}, c.kosul || {});
      ilk.bayrakYok = [].concat(ilk.bayrakYok || [], 'kamp_1', c.bayrak);
      sonuc.push(Object.assign({}, c.secenek, { kosul: ilk, etki: Object.assign({}, c.secenek.etki, { bayrak: [c.bayrak, 'kamp_1'] }) }));
      const ikinci = Object.assign({}, c.kosul || {});
      ikinci.bayrak = [].concat(ikinci.bayrak || [], 'kamp_1', 'kamp_zaman');
      ikinci.bayrakYok = [].concat(ikinci.bayrakYok || [], 'kamp_2', c.bayrak);
      sonuc.push(Object.assign({}, c.secenek, { kosul: ikinci, etki: Object.assign({}, c.secenek.etki, { bayrak: [c.bayrak, 'kamp_2'] }) }));
    }
    return sonuc;
  }

        not: 'Isı seni bir eski dost gibi selamladı ve geçti. Ocak seni kendinden sayıyor. ' + yer, git: hedef }] : []),

  function kulDovusu(metin, kosulEk, hatirla, ek, not) {
    return [

      const c = { metin, kosul: Object.assign({}, kosulEk || {}, v.kosul) };
      if (hatirla) c.hatirla = hatirla;
      if (not) c.not = not;
      c.dovus = {
        dusman: { ad: v.ad, can: v.can - (ek.canEksi || 0), zirh: v.zirh - (ek.zirhEksi || 0), saldiri: 8, silah: 'Kül ateşi ve pençe', hasarZari: '1d12', hasarEki: 2 },

      return c;

          for (const h of [c.git, c.sinama && c.sinama.basari, c.sinama && c.sinama.basarisizlik, c.dovus && c.dovus.zafer, c.dovus && c.dovus.kacis]) {

    for (const x of gor) { const d = kitap.dugumler[x]; if (!d) continue; onYukle((s ? M.gorselAdaylari(kitap, s, d, x) : [d.gorsel || x]).find(gorselVar)); }
  }

  const SEKIL = {
